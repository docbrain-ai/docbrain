# ═══════════════════════════════════════════════════════════════════════════
# DocBrain CI Knowledge Capture — GitHub Action
#
# Add this to .github/workflows/docbrain-capture.yml in any repository.
# When a PR is merged, DocBrain extracts knowledge fragments (decisions,
# caveats, procedures) from the PR title, body, and diff stats.
#
# Required repository secrets:
#   DOCBRAIN_API_URL  — Your DocBrain server URL (e.g. https://docbrain.yourco.com)
#   DOCBRAIN_API_KEY  — API key with editor+ role
# ═══════════════════════════════════════════════════════════════════════════

name: DocBrain Knowledge Capture

on:
  pull_request:
    types: [closed]

jobs:
  capture-knowledge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Capture knowledge from merged PR
        env:
          DOCBRAIN_API_URL: ${{ secrets.DOCBRAIN_API_URL }}
          DOCBRAIN_API_KEY: ${{ secrets.DOCBRAIN_API_KEY }}
        run: |
          DIFF_STAT=$(git diff --stat HEAD~1 HEAD | tail -1)
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | tr '\n' ',')
          LABELS=$(echo '${{ toJSON(github.event.pull_request.labels.*.name) }}' | jq -r 'join(",")')

          RESPONSE=$(curl -sf -w "\n%{http_code}" -X POST \
            "${DOCBRAIN_API_URL}/api/v1/ci/analyze" \
            -H "Authorization: Bearer ${DOCBRAIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --argjson pr_number ${{ github.event.pull_request.number }} \
              --arg repo '${{ github.repository }}' \
              --arg pr_title '${{ github.event.pull_request.title }}' \
              --arg pr_body '${{ github.event.pull_request.body }}' \
              --arg diff_stat "$DIFF_STAT" \
              --arg changed_files "$CHANGED_FILES" \
              --arg labels "$LABELS" \
              --arg author '${{ github.event.pull_request.user.login }}' \
              '{
                pr_number: $pr_number,
                repo: $repo,
                pr_title: $pr_title,
                pr_body: $pr_body,
                diff_stat: $diff_stat,
                changed_files: $changed_files,
                labels: $labels,
                author: $author
              }')")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "200" ]; then
            FRAGMENTS=$(echo "$BODY" | jq -r '.fragments_created // 0')
            echo "✓ DocBrain captured $FRAGMENTS knowledge fragment(s) from PR #${{ github.event.pull_request.number }}"
          else
            echo "⚠ DocBrain capture returned HTTP $HTTP_CODE"
            echo "$BODY"
          fi

  capture-deploy:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'deploy')
    runs-on: ubuntu-latest
    needs: capture-knowledge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Capture deployment context
        env:
          DOCBRAIN_API_URL: ${{ secrets.DOCBRAIN_API_URL }}
          DOCBRAIN_API_KEY: ${{ secrets.DOCBRAIN_API_KEY }}
        run: |
          SERVICE_NAME=$(basename "${{ github.repository }}")
          VERSION=$(git describe --tags --always 2>/dev/null || echo "${{ github.sha }}")
          CHANGELOG=$(git log --oneline HEAD~5..HEAD 2>/dev/null || echo "")

          curl -sf -X POST "${DOCBRAIN_API_URL}/api/v1/ci/deploy-capture" \
            -H "Authorization: Bearer ${DOCBRAIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg service "$SERVICE_NAME" \
              --arg version "$VERSION" \
              --arg environment "production" \
              --arg changelog "$CHANGELOG" \
              '{
                service: $service,
                version: $version,
                environment: $environment,
                changelog: $changelog
              }')"

          echo "✓ DocBrain captured deployment context for $SERVICE_NAME $VERSION"
