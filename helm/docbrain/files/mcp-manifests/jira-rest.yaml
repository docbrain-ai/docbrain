# Atlassian Jira via REST API — DocBrain MCP manifest (fallback / primary
# for direct ticket lookups).
#
# Why two Jira manifests?
#
# The other manifest (`jira`) talks to Atlassian's hosted Remote MCP
# Server (mcp.atlassian.com/v1/mcp/authv2) which exposes the Teamwork
# Graph API. That product is in early rollout and live verification has
# shown it returning generic "We are having trouble completing this
# action" errors for queries that work fine via Atlassian's standard
# REST API. This manifest wraps the REST API as a second MCP server so
# the dispatcher can route around the Teamwork Graph manifest when
# Atlassian's upstream is unreliable.
#
# Architecture: not a special-case bypass. This is a second MCP server
# served by docbrain-server itself at /internal/mcp/jira-rest. The
# orchestrator's gateway speaks MCP 2024-11-05 Streamable HTTP to it
# the same way it speaks to Atlassian's hosted server. Two distinct
# auth layers:
#   - Orchestrator → shim:  bearer DOCBRAIN_INTERNAL_MCP_SECRET
#   - Shim → Atlassian REST: Basic JIRA_USER_EMAIL:JIRA_API_TOKEN
#
# Routing intent: prefer this manifest for direct ticket questions
# (status / assignee / search). Use the Teamwork Graph manifest only
# when the question explicitly asks about cross-product relationships.

manifest_version: 1
id: jira_rest
display_name: "Atlassian Jira (REST)"
description: |
  Jira ticket lookups via Atlassian's standard REST API, wrapped as MCP tools.
  Primary path for Jira queries — more reliable than the Teamwork Graph manifest
  (jira), which depends on Atlassian's hosted MCP server and may transiently
  return 'trouble completing this action' errors during their early-stage rollout.
  Use this for direct ticket status / assignee / search queries; use the
  Teamwork Graph manifest only when the question explicitly asks about
  cross-product relationships.
category: "issue-tracking"
icon: "jira.svg"

# DOCBRAIN_SERVER_PORT is substituted into the endpoint URL at manifest
# load time. Local dev: DOCBRAIN_SERVER_PORT=3000. Helm sets it from the
# service port to keep dev / staging / prod consistent.
config_refs:
  - DOCBRAIN_SERVER_PORT

server:
  transport: http_sse
  endpoint: "http://localhost:${DOCBRAIN_SERVER_PORT}/internal/mcp/jira-rest"
  protocol_version: "2024-11-05"

auth:
  modes:
    - service_account
  service_account:
    # The shim authenticates the orchestrator (caller) via this bearer.
    # NOT the Atlassian credential — that's read by the shim from its
    # own JIRA_USER_EMAIL + JIRA_API_TOKEN env vars (same vars the rest
    # of the codebase uses for Jira ingest / enrichment).
    secret_refs:
      - DOCBRAIN_INTERNAL_MCP_SECRET
    header_template: "Bearer ${DOCBRAIN_INTERNAL_MCP_SECRET}"

tools:
  - name: jira_rest.get_issue
    upstream_name: get_issue
    description: |
      Fetch full data for a Jira ticket by key (e.g. AITOOLINTG-35). Returns
      summary, status, assignee, reporter, priority, type, labels, created/updated
      timestamps, comment count, and the first 2KB of description. Use this for
      'what is X about / who owns X / what is the status of X' questions.
      Faster and more reliable than the Teamwork Graph alternative.
    args_schema:
      type: object
      properties:
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]+-\\d+$"
          description: "Jira ticket key like 'AITOOLINTG-35' or 'PROJ-123'."
      required: [key]
      additionalProperties: false
    output_size_cap_bytes: 16384
    latency_budget_ms: 7000

  - name: jira_rest.search
    upstream_name: search
    description: |
      Search Jira tickets via JQL. Returns up to 25 issue keys with summary,
      status, and assignee. Use for queries like 'show me all open tickets
      assigned to me' or 'what's blocking the migration this week.'
    args_schema:
      type: object
      properties:
        jql:
          type: string
          maxLength: 500
          description: "JQL query. Example: 'assignee = currentUser() AND status != Done ORDER BY updated DESC'"
        max_results:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
      required: [jql]
      additionalProperties: false
    output_size_cap_bytes: 16384
    latency_budget_ms: 7000

egress:
  # localhost / 127.0.0.1: the shim itself (orchestrator → docbrain-server).
  # *.atlassian.net: where the shim's own outbound REST calls go.
  hosts:
    - "localhost"
    - "127.0.0.1"
    - "*.atlassian.net"

rbac:
  required_role: viewer

retention:
  audit_log_days: 90
