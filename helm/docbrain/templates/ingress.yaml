{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "docbrain.fullname" . }}
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # The generate path runs gather → (live-tool dispatch) → reasoning → writing →
    # freshness critic — a tool-heavy / agentic generation takes minutes, so 120
    # was too tight (the slowest enriched generations 502'd). Set the ALB
    # idle_timeout to the SAME value via ingress.annotations so the lower can't
    # silently win. Raise to 900+ for agentic / live-tool mode.
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.proxyReadTimeout | default 600 | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" (include "docbrain.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "docbrain.fullname" . }}-server
                port:
                  number: {{ .Values.server.port }}
          - path: /slack
            pathType: Prefix
            backend:
              service:
                name: {{ include "docbrain.fullname" . }}-server
                port:
                  number: {{ .Values.server.port }}
          - path: /api/v1/health
            pathType: Exact
            backend:
              service:
                name: {{ include "docbrain.fullname" . }}-server
                port:
                  number: {{ .Values.server.port }}
          {{- if .Values.web.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "docbrain.fullname" . }}-web
                port:
                  number: {{ .Values.web.port }}
          {{- end }}
{{- end }}
