{{- /*
  Local overlay ConfigMap — renders helm-managed config subtrees into a
  `local.yaml` file mounted at /app/config/local.yaml inside the server and
  ingest containers.

  The DocBrain config loader reads local.yaml LAST, so any subtree defined
  here overrides anything baked into default.yaml / production.yaml.

  Currently emits three optional subtrees:
    * `sources:`                       — when .Values.ingest.sources is set
    * `freshness.exclusion_rules:`     — when .Values.freshness.exclusionRules is set
    * `freshness.event_based_spaces:`  — when .Values.freshness.eventBasedSpaces is set

  Only rendered when at least one subtree is configured — keeps the file out
  of clusters that don't need overrides so container-image defaults apply.
*/}}
{{- $hasSources := and (kindIs "map" .Values.ingest.sources) (gt (len .Values.ingest.sources) 0) }}
{{- $hasExclusion := and (kindIs "map" .Values.freshness) (kindIs "map" .Values.freshness.exclusionRules) (gt (len .Values.freshness.exclusionRules) 0) }}
{{- $hasEventSpaces := and (kindIs "map" .Values.freshness) (kindIs "slice" .Values.freshness.eventBasedSpaces) (gt (len .Values.freshness.eventBasedSpaces) 0) }}
{{- $hasFreshnessOverlay := or $hasExclusion $hasEventSpaces }}
{{- if or $hasSources $hasFreshnessOverlay }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docbrain.fullname" . }}-sources
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
data:
  local.yaml: |
    # Generated by Helm from values.yaml — do not edit manually.
    {{- if $hasSources }}
    # See docs/configuration.md for the full `sources:` shape.
    sources:
      {{- toYaml .Values.ingest.sources | nindent 6 }}
    {{- end }}
    {{- if $hasFreshnessOverlay }}
    # Freshness overrides — emitted as a single `freshness:` block so YAML
    # remains well-formed when both subtrees are set.
    freshness:
      {{- if $hasExclusion }}
      # Lifecycle exclusion rules — docs matching these are auto-marked
      # 'archived' at ingest and skipped by the scorer.
      exclusion_rules:
        {{- toYaml .Values.freshness.exclusionRules | nindent 8 }}
      {{- end }}
      {{- if $hasEventSpaces }}
      # Event-based source types — permanent historical records (time_decay=100).
      event_based_spaces:
        {{- toYaml .Values.freshness.eventBasedSpaces | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
