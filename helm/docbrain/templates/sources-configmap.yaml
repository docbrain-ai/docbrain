{{- /*
  Sources ConfigMap — renders the `ingest.sources` subtree from values.yaml
  into a `local.yaml` file that is mounted at /app/config/local.yaml inside
  the server and ingest containers.

  The DocBrain config loader reads local.yaml LAST, so any sub-source defined
  here overrides anything baked into default.yaml / production.yaml.

  Only emitted when .Values.ingest.sources is non-empty — this way customers
  who don't use helm-managed ingest configuration aren't forced into an
  empty ConfigMap that would shadow container-image defaults.
*/}}
{{- if .Values.ingest.sources }}
{{- if gt (len .Values.ingest.sources) 0 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docbrain.fullname" . }}-sources
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
data:
  local.yaml: |
    # Generated by Helm from values.yaml — do not edit manually.
    # See docs/configuration.md for the full `sources:` shape.
    sources:
      {{- toYaml .Values.ingest.sources | nindent 6 }}
{{- end }}
{{- end }}
