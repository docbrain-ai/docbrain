{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docbrain.secretName" . }}
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ default "docbrain" .Values.postgresql.password | quote }}
  {{- if eq .Values.llm.provider "anthropic" }}
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropicApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "openai" }}
  OPENAI_API_KEY: {{ .Values.llm.openaiApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "groq" }}
  GROQ_API_KEY: {{ .Values.llm.groqApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "openrouter" }}
  OPENROUTER_API_KEY: {{ .Values.llm.openrouterApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "together" }}
  TOGETHER_API_KEY: {{ .Values.llm.togetherApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "deepseek" }}
  DEEPSEEK_API_KEY: {{ .Values.llm.deepseekApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "mistral" }}
  MISTRAL_API_KEY: {{ .Values.llm.mistralApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "xai" }}
  XAI_API_KEY: {{ .Values.llm.xaiApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "gemini" }}
  GEMINI_API_KEY: {{ .Values.llm.geminiApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "azure_openai" }}
  AZURE_OPENAI_API_KEY: {{ .Values.llm.azureOpenaiApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "cohere" }}
  COHERE_API_KEY: {{ .Values.llm.cohereApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.embedding.provider "openai" }}
  OPENAI_API_KEY: {{ .Values.embedding.openaiApiKey | default .Values.llm.openaiApiKey | default "" | quote }}
  {{- end }}
  {{- if .Values.ingest.confluence }}
  CONFLUENCE_API_TOKEN: {{ .Values.ingest.confluence.apiToken | default "" | quote }}
  {{- end }}
  {{- if .Values.confluenceWebhook.enabled }}
  CONFLUENCE_WEBHOOK_SECRET: {{ .Values.confluenceWebhook.webhookSecret | default "" | quote }}
  {{- if not .Values.ingest.confluence }}
  CONFLUENCE_API_TOKEN: {{ .Values.confluenceWebhook.apiToken | default "" | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.ingest.github }}
  GITHUB_TOKEN: {{ .Values.ingest.github.token | default "" | quote }}
  {{- end }}
  {{- if .Values.githubOAuth.enabled }}
  GITHUB_CLIENT_ID: {{ .Values.githubOAuth.clientId | default "" | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.githubOAuth.clientSecret | default "" | quote }}
  {{- end }}
  {{- if .Values.gitlabCapture.enabled }}
  GITLAB_CAPTURE_WEBHOOK_SECRET: {{ .Values.gitlabCapture.webhookSecret | default "" | quote }}
  GITLAB_CAPTURE_TOKEN: {{ .Values.gitlabCapture.token | default "" | quote }}
  {{- end }}
  {{- if .Values.gitlabOAuth.enabled }}
  GITLAB_CLIENT_ID: {{ .Values.gitlabOAuth.clientId | default "" | quote }}
  GITLAB_CLIENT_SECRET: {{ .Values.gitlabOAuth.clientSecret | default "" | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | default "" | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | default "" | quote }}
  {{- end }}
  {{- if .Values.mcpTools.enabled }}
  # MCP tool platform credentials (Plan 4) — populated when mcpTools.enabled=true.
  MCP_OAUTH_ENCRYPTION_KEY: {{ .Values.mcpTools.encryptionKey | default "" | quote }}
  # Plan A — signed remote registry public key. Base64-encoded 32-byte
  # Ed25519 pubkey. Filed in the Secret alongside MCP_OAUTH_ENCRYPTION_KEY
  # to match existing key-material conventions; empty disables the
  # /admin/mcp/registry* + /install-from-registry endpoints (they return
  # 503; server still boots normally).
  MCP_REGISTRY_PUBKEY: {{ .Values.mcpTools.registry.pubkey | default "" | quote }}
  ATLASSIAN_OAUTH_CLIENT_ID: {{ .Values.mcpTools.oauth.atlassian.clientId | default "" | quote }}
  ATLASSIAN_OAUTH_CLIENT_SECRET: {{ .Values.mcpTools.oauth.atlassian.clientSecret | default "" | quote }}
  JIRA_API_TOKEN: {{ .Values.mcpTools.serviceAccount.jira.apiToken | default "" | quote }}
  JIRA_CLOUD_ID: {{ .Values.mcpTools.serviceAccount.jira.cloudId | default "" | quote }}
  # jira_rest manifest — REST-API fallback for Atlassian's hosted MCP server.
  # The shim authenticates the orchestrator (server → server) via this bearer.
  # Set explicitly in prod so rolling deploys don't invalidate in-flight MCP
  # sessions; if empty the server auto-generates a 32-char value at boot.
  DOCBRAIN_INTERNAL_MCP_SECRET: {{ .Values.mcpTools.internalShimSecret | default "" | quote }}
  # Server port the shim listens on; substituted into the jira_rest
  # manifest's endpoint URL at registry load.
  DOCBRAIN_SERVER_PORT: {{ .Values.server.port | quote }}
  # Atlassian REST creds used by the jira_rest shim's upstream calls.
  # JIRA_API_TOKEN above is shared between ingest and the shim.
  JIRA_BASE_URL: {{ .Values.mcpTools.serviceAccount.jira.baseUrl | default "" | quote }}
  JIRA_USER_EMAIL: {{ .Values.mcpTools.serviceAccount.jira.userEmail | default "" | quote }}
  # Slack manifest. OAuth (per-user, preferred) client credentials, plus the
  # bearer key for the self-hosted Slack MCP server's HTTP gate (service-account
  # fallback). The Slack USER token (xoxp-) itself lives on the Slack MCP server,
  # not here — DocBrain only forwards SLACK_MCP_API_KEY as the bearer.
  SLACK_OAUTH_CLIENT_ID: {{ .Values.mcpTools.oauth.slack.clientId | default "" | quote }}
  SLACK_OAUTH_CLIENT_SECRET: {{ .Values.mcpTools.oauth.slack.clientSecret | default "" | quote }}
  SLACK_MCP_API_KEY: {{ .Values.mcpTools.serviceAccount.slack.mcpApiKey | default "" | quote }}
  {{- end }}
{{- end }}
