{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docbrain.secretName" . }}
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ default "docbrain" .Values.postgresql.password | quote }}
  {{- if eq .Values.llm.provider "anthropic" }}
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropicApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "openai" }}
  OPENAI_API_KEY: {{ .Values.llm.openaiApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.embedding.provider "openai" }}
  OPENAI_API_KEY: {{ .Values.embedding.openaiApiKey | default .Values.llm.openaiApiKey | default "" | quote }}
  {{- end }}
  {{- if .Values.ingest.confluence }}
  CONFLUENCE_API_TOKEN: {{ .Values.ingest.confluence.apiToken | default "" | quote }}
  {{- end }}
  {{- if .Values.confluenceWebhook.enabled }}
  CONFLUENCE_WEBHOOK_SECRET: {{ .Values.confluenceWebhook.webhookSecret | default "" | quote }}
  {{- if not .Values.ingest.confluence }}
  CONFLUENCE_API_TOKEN: {{ .Values.confluenceWebhook.apiToken | default "" | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.ingest.github }}
  GITHUB_TOKEN: {{ .Values.ingest.github.token | default "" | quote }}
  {{- end }}
  {{- if .Values.githubOAuth.enabled }}
  GITHUB_CLIENT_ID: {{ .Values.githubOAuth.clientId | default "" | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.githubOAuth.clientSecret | default "" | quote }}
  {{- end }}
  {{- if .Values.gitlabCapture.enabled }}
  GITLAB_CAPTURE_WEBHOOK_SECRET: {{ .Values.gitlabCapture.webhookSecret | default "" | quote }}
  GITLAB_CAPTURE_TOKEN: {{ .Values.gitlabCapture.token | default "" | quote }}
  {{- end }}
  {{- if .Values.gitlabOAuth.enabled }}
  GITLAB_CLIENT_ID: {{ .Values.gitlabOAuth.clientId | default "" | quote }}
  GITLAB_CLIENT_SECRET: {{ .Values.gitlabOAuth.clientSecret | default "" | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | default "" | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | default "" | quote }}
  {{- end }}
  {{- range $key, $val := .Values.server.secrets }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
