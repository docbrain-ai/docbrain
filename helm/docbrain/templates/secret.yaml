{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docbrain.secretName" . }}
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ default "docbrain" .Values.postgresql.password | quote }}
  {{- if eq .Values.llm.provider "anthropic" }}
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropicApiKey | default "" | quote }}
  {{- end }}
  {{- if or (eq .Values.llm.provider "openai") (eq .Values.embedding.provider "openai") }}
  OPENAI_API_KEY: {{ .Values.embedding.openaiApiKey | default .Values.llm.openaiApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "groq" }}
  GROQ_API_KEY: {{ .Values.llm.groqApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "openrouter" }}
  OPENROUTER_API_KEY: {{ .Values.llm.openrouterApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "together" }}
  TOGETHER_API_KEY: {{ .Values.llm.togetherApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "deepseek" }}
  DEEPSEEK_API_KEY: {{ .Values.llm.deepseekApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "mistral" }}
  MISTRAL_API_KEY: {{ .Values.llm.mistralApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "xai" }}
  XAI_API_KEY: {{ .Values.llm.xaiApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "gemini" }}
  GEMINI_API_KEY: {{ .Values.llm.geminiApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "azure_openai" }}
  AZURE_OPENAI_API_KEY: {{ .Values.llm.azureOpenaiApiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "cohere" }}
  COHERE_API_KEY: {{ .Values.llm.cohereApiKey | default "" | quote }}
  {{- end }}
  {{- if .Values.ingest.confluence }}
  CONFLUENCE_API_TOKEN: {{ .Values.ingest.confluence.apiToken | default "" | quote }}
  {{- end }}
  {{- if .Values.confluenceWebhook.enabled }}
  CONFLUENCE_WEBHOOK_SECRET: {{ .Values.confluenceWebhook.webhookSecret | default "" | quote }}
  {{- if not .Values.ingest.confluence }}
  CONFLUENCE_API_TOKEN: {{ .Values.confluenceWebhook.apiToken | default "" | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.ingest.github }}
  GITHUB_TOKEN: {{ .Values.ingest.github.token | default "" | quote }}
  {{- end }}
  {{- if .Values.githubOAuth.enabled }}
  GITHUB_CLIENT_ID: {{ .Values.githubOAuth.clientId | default "" | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.githubOAuth.clientSecret | default "" | quote }}
  {{- end }}
  {{- if .Values.gitlabCapture.enabled }}
  GITLAB_CAPTURE_WEBHOOK_SECRET: {{ .Values.gitlabCapture.webhookSecret | default "" | quote }}
  GITLAB_CAPTURE_TOKEN: {{ .Values.gitlabCapture.token | default "" | quote }}
  {{- end }}
  {{- if .Values.gitlabOAuth.enabled }}
  GITLAB_CLIENT_ID: {{ .Values.gitlabOAuth.clientId | default "" | quote }}
  GITLAB_CLIENT_SECRET: {{ .Values.gitlabOAuth.clientSecret | default "" | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | default "" | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | default "" | quote }}
  {{- end }}
  {{- if and .Values.draftPublish .Values.draftPublish.github .Values.draftPublish.github.token }}
  GITHUB_PUBLISH_TOKEN: {{ .Values.draftPublish.github.token | quote }}
  {{- end }}
  {{- if and .Values.draftPublish .Values.draftPublish.gitlab .Values.draftPublish.gitlab.token }}
  GITLAB_PUBLISH_TOKEN: {{ .Values.draftPublish.gitlab.token | quote }}
  {{- end }}
  {{- if .Values.trainer.enabled }}
  TRAINER_API_KEY: {{ .Values.trainer.apiKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.learning.storage.backend "azure" }}
  TRAINER_AZURE_CONNECTION_STRING: {{ .Values.learning.storage.azureConnectionString | default "" | quote }}
  {{- end }}
  {{- range $key, $val := .Values.server.secrets }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
