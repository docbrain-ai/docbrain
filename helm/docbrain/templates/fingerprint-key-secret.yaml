{{/*
The fingerprint key lives in its own Secret, kept on `helm uninstall` (resource-policy: keep), so
uninstalling never loses it and the other credentials are not kept with it. Its value: the
operator's fingerprintKey when set; otherwise the value already in this Secret (lookup), so an
upgrade or reinstall never rotates it (a rollback reapplies a stored manifest holding the same value); otherwise 32 random bytes, base64 (first install).
`lookup` returns nothing under `helm template` and in tools that render offline (Argo CD), so there
a new key is rendered every time: supply fingerprintKey or fingerprintKeySecret.existingSecret.
Not rendered when fingerprintKeySecret.existingSecret names your own Secret.
*/}}
{{- if not .Values.fingerprintKeySecret.existingSecret }}
{{- $name := include "docbrain.fingerprintKeySecretName" . }}
{{- $key := .Values.fingerprintKey }}
{{- if not $key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "DOCBRAIN_FINGERPRINT_KEY") }}
{{- $key = index $existing.data "DOCBRAIN_FINGERPRINT_KEY" | b64dec }}
{{- else }}
{{- $key = randBytes 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
  annotations:
    # Uninstall keeps this Secret: a lost key reopens every restored or declined secret finding.
    # Delete it by hand only to start fresh.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  DOCBRAIN_FINGERPRINT_KEY: {{ $key | quote }}
{{- end }}
