apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docbrain.fullname" . }}-server
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "docbrain.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "docbrain.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "docbrain.fullname" . }}-config
            - secretRef:
                name: {{ include "docbrain.secretName" . }}
          env:
            - name: DATABASE_URL
              value: {{ include "docbrain.databaseUrl" . | quote }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          {{- if or (and .Values.learning.enabled (eq .Values.learning.storage.backend "local") .Values.trainer.persistence.enabled) .Values.mcpTools.enabled }}
          volumeMounts:
            {{- if and .Values.learning.enabled (eq .Values.learning.storage.backend "local") .Values.trainer.persistence.enabled }}
            - name: trainer-models
              mountPath: {{ .Values.learning.storage.localModelRoot }}
              readOnly: false
            {{- end }}
            {{- if .Values.mcpTools.enabled }}
            - name: mcp-manifests
              mountPath: /etc/docbrain/mcp-manifests
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (and .Values.learning.enabled (eq .Values.learning.storage.backend "local") .Values.trainer.persistence.enabled) .Values.mcpTools.enabled }}
      volumes:
        {{- if and .Values.learning.enabled (eq .Values.learning.storage.backend "local") .Values.trainer.persistence.enabled }}
        - name: trainer-models
          persistentVolumeClaim:
            claimName: {{ include "docbrain.fullname" . }}-trainer-models
        {{- end }}
        {{- if .Values.mcpTools.enabled }}
        - name: mcp-manifests
          configMap:
            name: {{ include "docbrain.fullname" . }}-mcp-manifests
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docbrain.fullname" . }}-server
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
      protocol: TCP
  selector:
    {{- include "docbrain.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
