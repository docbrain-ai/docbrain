apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docbrain.fullname" . }}-server
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "docbrain.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "docbrain.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        # Issue #10: Rolling restart on ConfigMap or Secret changes
        {{- include "docbrain.configChecksum" . | nindent 8 }}
        {{- with .Values.server.vaultAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Issue #9: Wait for all dependencies before starting the server.
      # Prevents race conditions when all pods start simultaneously.
      initContainers:
        {{- if .Values.postgresql.internal }}
        - name: wait-for-postgres
          image: {{ .Values.postgresql.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "docbrain.fullname" . }}-postgres -p 5432 -U docbrain; do
                echo "waiting for postgres..."; sleep 2;
              done
        {{- end }}
        {{- if .Values.opensearch.internal }}
        - name: wait-for-opensearch
          image: {{ .Values.opensearch.image }}
          command:
            - sh
            - -c
            - |
              until (echo > /dev/tcp/{{ include "docbrain.fullname" . }}-opensearch/9200) 2>/dev/null; do
                echo "waiting for opensearch..."; sleep 2;
              done
        {{- end }}
        {{- if .Values.redis.internal }}
        - name: wait-for-redis
          image: {{ .Values.redis.image }}
          command:
            - sh
            - -c
            - |
              until redis-cli -h {{ include "docbrain.fullname" . }}-redis -p 6379 ping | grep -q PONG; do
                echo "waiting for redis..."; sleep 2;
              done
        {{- end }}
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "docbrain.fullname" . }}-config
            - secretRef:
                name: {{ include "docbrain.secretName" . }}
          env:
            - name: DATABASE_URL
              value: {{ include "docbrain.databaseUrl" . | quote }}
          # Issue #6: /api/v1/health is on the public (unauthenticated) router.
          # The old path /health returned 401 because it was behind auth middleware.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          {{- if and (contains "local" .Values.ingest.sources) .Values.ingest.localDocsPath }}
          volumeMounts:
            - name: docs
              mountPath: {{ .Values.ingest.localDocsPath }}
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- if and (contains "local" .Values.ingest.sources) .Values.ingest.localDocsPath }}
      volumes:
        - name: docs
          persistentVolumeClaim:
            claimName: {{ include "docbrain.fullname" . }}-docs
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docbrain.fullname" . }}-server
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
      protocol: TCP
  selector:
    {{- include "docbrain.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
