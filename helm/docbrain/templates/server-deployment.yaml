apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docbrain.fullname" . }}-server
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  # Zero-downtime rolling update. Safe even on a single-replica deployment
  # because sqlx::migrate! at boot acquires the `_sqlx_migrations` advisory
  # lock — only one pod runs the migration, the other waits. The two-pod
  # window during rollover is ~10s, which is acceptable for: (1) read-side
  # work that's idempotent against the DB, and (2) writers that are
  # protected by their own per-resource locks (single-flight quality
  # rescore, freshness scorer pass guard, etc.).
  #
  # WAS `type: Recreate` — caused a brief outage window on every rollout
  # because the old pod terminated before the new one became Ready. The
  # advisory lock makes Recreate unnecessary.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "docbrain.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "docbrain.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        # Restart on a change to any chart object this pod reads whole (docbrain.configChecksum in _helpers.tpl).
        {{- include "docbrain.configChecksum" . | nindent 8 }}
        {{- include "docbrain.localOverlayChecksum" . | nindent 8 }}
        {{- if .Values.mcpTools.enabled }}
        checksum/mcp-manifests: {{ include (print $.Template.BasePath "/configmap-mcp-manifests.yaml") . | sha256sum }}
        {{- end }}
    spec:
      # A capture an MCP client started finishes even if the client leaves; shutdown waits up to
      # 130 s for those writes, so the pod is given longer than that.
      terminationGracePeriodSeconds: 180
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "docbrain.fullname" . }}-config
            - secretRef:
                name: {{ include "docbrain.secretName" . }}
          env:
            - name: DATABASE_URL
              value: {{ include "docbrain.databaseUrl" . | quote }}
            # Required: read from the fingerprint key's own Secret (generated and kept by the chart,
            # or yours via fingerprintKeySecret.existingSecret; a Secret without the key fails the pod).
            - name: DOCBRAIN_FINGERPRINT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "docbrain.fingerprintKeySecretName" . }}
                  key: {{ include "docbrain.fingerprintKeySecretKey" . }}
            {{- if and (not .Values.existingSecret) .Values.bootstrapKey.enabled }}
            # The first-login admin key the chart generates (initial-admin-secret.yaml). The server registers it at
            # first boot; without it the server makes a key of its own and the one in the Secret never works.
            # Optional: the Secret may be deleted after first login (the key stays active in the database).
            # With existingSecret, put BOOTSTRAP_ADMIN_KEY in your Secret; envFrom above hands it over.
            - name: BOOTSTRAP_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "docbrain.fullname" . }}-initial-admin-secret
                  key: BOOTSTRAP_ADMIN_KEY
                  optional: true
            {{- end }}
            {{- if and (not .Values.bootstrapKey.enabled) (not (hasKey (.Values.server.env | default dict) "BOOTSTRAP_KEY_ENABLED")) }}
            # bootstrapKey.enabled=false: the server revokes the first-login admin key at start and keeps it revoked
            # (docs/kubernetes.md, "Bootstrap key lifecycle"). An explicit server.env.BOOTSTRAP_KEY_ENABLED wins.
            - name: BOOTSTRAP_KEY_ENABLED
              value: "false"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          {{- $trainerModels := and .Values.learning.enabled (eq .Values.learning.storage.backend "local") .Values.trainer.persistence.enabled }}
          {{- $localOverlay := include "docbrain.hasLocalOverlay" . }}
          {{- if or $trainerModels .Values.mcpTools.enabled $localOverlay }}
          volumeMounts:
            {{- if $trainerModels }}
            - name: trainer-models
              mountPath: {{ .Values.learning.storage.localModelRoot }}
              readOnly: false
            {{- end }}
            {{- if .Values.mcpTools.enabled }}
            - name: mcp-manifests
              mountPath: /etc/docbrain/mcp-manifests
              readOnly: true
            {{- end }}
            {{- if $localOverlay }}
            # The chart's local.yaml (sources-configmap.yaml): the server reads the freshness rules and the
            # sources from it, the same file the ingest mounts.
            - name: sources-config
              mountPath: /app/config/local.yaml
              subPath: local.yaml
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $trainerModels .Values.mcpTools.enabled $localOverlay }}
      volumes:
        {{- if $trainerModels }}
        - name: trainer-models
          persistentVolumeClaim:
            claimName: {{ include "docbrain.fullname" . }}-trainer-models
        {{- end }}
        {{- if .Values.mcpTools.enabled }}
        - name: mcp-manifests
          configMap:
            name: {{ include "docbrain.fullname" . }}-mcp-manifests
        {{- end }}
        {{- if $localOverlay }}
        - name: sources-config
          configMap:
            name: {{ include "docbrain.fullname" . }}-sources
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docbrain.fullname" . }}-server
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
      protocol: TCP
  selector:
    {{- include "docbrain.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
