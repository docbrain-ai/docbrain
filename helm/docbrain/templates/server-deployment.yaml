apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docbrain.fullname" . }}-server
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  # Zero-downtime rolling update. Safe even on a single-replica deployment
  # because sqlx::migrate! at boot acquires the `_sqlx_migrations` advisory
  # lock — only one pod runs the migration, the other waits. The two-pod
  # window during rollover is ~10s, which is acceptable for: (1) read-side
  # work that's idempotent against the DB, and (2) writers that are
  # protected by their own per-resource locks (single-flight quality
  # rescore, freshness scorer pass guard, etc.).
  #
  # WAS `type: Recreate` — caused a brief outage window on every rollout
  # because the old pod terminated before the new one became Ready. The
  # advisory lock makes Recreate unnecessary.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "docbrain.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "docbrain.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "docbrain.fullname" . }}-config
            - secretRef:
                name: {{ include "docbrain.secretName" . }}
          env:
            - name: DATABASE_URL
              value: {{ include "docbrain.databaseUrl" . | quote }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          {{- if or (and .Values.learning.enabled (eq .Values.learning.storage.backend "local") .Values.trainer.persistence.enabled) .Values.mcpTools.enabled }}
          volumeMounts:
            {{- if and .Values.learning.enabled (eq .Values.learning.storage.backend "local") .Values.trainer.persistence.enabled }}
            - name: trainer-models
              mountPath: {{ .Values.learning.storage.localModelRoot }}
              readOnly: false
            {{- end }}
            {{- if .Values.mcpTools.enabled }}
            - name: mcp-manifests
              mountPath: /etc/docbrain/mcp-manifests
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (and .Values.learning.enabled (eq .Values.learning.storage.backend "local") .Values.trainer.persistence.enabled) .Values.mcpTools.enabled }}
      volumes:
        {{- if and .Values.learning.enabled (eq .Values.learning.storage.backend "local") .Values.trainer.persistence.enabled }}
        - name: trainer-models
          persistentVolumeClaim:
            claimName: {{ include "docbrain.fullname" . }}-trainer-models
        {{- end }}
        {{- if .Values.mcpTools.enabled }}
        - name: mcp-manifests
          configMap:
            name: {{ include "docbrain.fullname" . }}-mcp-manifests
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docbrain.fullname" . }}-server
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
      protocol: TCP
  selector:
    {{- include "docbrain.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
