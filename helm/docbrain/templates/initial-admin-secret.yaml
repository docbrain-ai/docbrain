{{/*
Bootstrap admin key — stored in a separate Secret so it can be managed
independently of operational secrets (DB password, API keys).

Lifecycle:
  - Created on `helm install` with a randomly generated key.
  - Preserved across `helm upgrade` via lookup (never regenerated automatically).
  - When bootstrapKey.enabled=false: this template is not rendered, so Helm
    deletes the Secret on the next upgrade. The server simultaneously revokes
    the key from the database (BOOTSTRAP_KEY_ENABLED=false in ConfigMap).
  - Safe to delete manually after first login — the key remains active in the
    database until explicitly revoked via the API or bootstrapKey.enabled=false.

Retrieve:
  kubectl get secret <release>-initial-admin-secret \
    -o jsonpath='{.data.BOOTSTRAP_ADMIN_KEY}' | base64 -d
*/}}
{{- if and (not .Values.existingSecret) (.Values.bootstrapKey.enabled) }}
{{- $secretName := printf "%s-initial-admin-secret" (include "docbrain.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $bootstrapKey := "" }}
{{- if $existing }}
  {{- $bootstrapKey = index $existing.data "BOOTSTRAP_ADMIN_KEY" | b64dec }}
{{- else }}
  {{- $bootstrapKey = randAlphaNum 40 | printf "db_sk_%s" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Retrieve: kubectl get secret {{ $secretName }} -o jsonpath='{.data.BOOTSTRAP_ADMIN_KEY}' | base64 -d
  # Delete this Secret after creating a proper admin key. The bootstrap key
  # remains active in the database until revoked via API or bootstrapKey.enabled=false.
  BOOTSTRAP_ADMIN_KEY: {{ $bootstrapKey | quote }}
{{- end }}
