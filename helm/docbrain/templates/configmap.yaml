apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docbrain.fullname" . }}-config
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
data:
  # Issue #2: APP_ENV must be "production" for production config loading
  APP_ENV: "production"
  # Point server to the config directory baked into the container image.
  # Without this the server looks for ./config relative to CWD and crashes silently.
  DOCBRAIN_CONFIG_DIR: "/app/config"
  # Bootstrap admin key lifecycle control.
  # Set bootstrapKey.enabled=false to revoke the bootstrap key from the DB on
  # next restart and have Helm delete the initial-admin-secret on next upgrade.
  BOOTSTRAP_KEY_ENABLED: {{ .Values.bootstrapKey.enabled | default true | quote }}

  LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  LLM_MODEL_ID: {{ .Values.llm.modelId | quote }}
  {{- if .Values.llm.fastModelId }}
  FAST_MODEL_ID: {{ .Values.llm.fastModelId | quote }}
  {{- end }}
  {{- if .Values.llm.ingestModelId }}
  INGEST_LLM_MODEL_ID: {{ .Values.llm.ingestModelId | quote }}
  {{- end }}
  {{- if .Values.llm.draftModelId }}
  DRAFT_MODEL_ID: {{ .Values.llm.draftModelId | quote }}
  {{- end }}
  {{- if .Values.llm.draftProvider }}
  DRAFT_LLM_PROVIDER: {{ .Values.llm.draftProvider | quote }}
  {{- end }}
  {{- if .Values.llm.thinkingBudget }}
  LLM_THINKING_BUDGET: {{ .Values.llm.thinkingBudget | quote }}
  {{- end }}
  EMBED_PROVIDER: {{ .Values.embedding.provider | quote }}
  EMBED_MODEL_ID: {{ .Values.embedding.modelId | quote }}

  # ── Retrieval pipeline tuning ─────────────────────────────────────
  # Every knob is emitted only when explicitly set in values.yaml, so
  # the app's own defaults (from config/default.yaml) apply when a
  # customer hasn't opted in.
  {{- with .Values.rag }}
  {{- if .topK }}
  RAG_TOP_K: {{ .topK | quote }}
  {{- end }}
  {{- if .bm25Boost }}
  RAG_BM25_BOOST: {{ .bm25Boost | quote }}
  {{- end }}
  {{- if .candidatePoolSize }}
  RAG_CANDIDATE_POOL_SIZE: {{ .candidatePoolSize | quote }}
  {{- end }}
  {{- if .rrfK }}
  RAG_RRF_K: {{ .rrfK | quote }}
  {{- end }}
  {{- if .maxPerSource }}
  RAG_MAX_PER_SOURCE: {{ .maxPerSource | quote }}
  {{- end }}
  {{- if .maxPerDocument }}
  RAG_MAX_PER_DOCUMENT: {{ .maxPerDocument | quote }}
  {{- end }}
  {{- if .minRelevanceScore }}
  RAG_MIN_RELEVANCE_SCORE: {{ .minRelevanceScore | quote }}
  {{- end }}
  {{- if .displayFloor }}
  RAG_DISPLAY_FLOOR: {{ .displayFloor | quote }}
  {{- end }}
  {{- if .confidenceGate }}
  RAG_CONFIDENCE_GATE: {{ .confidenceGate | quote }}
  {{- end }}
  {{- if .strongAnswerFloor }}
  RAG_STRONG_ANSWER_FLOOR: {{ .strongAnswerFloor | quote }}
  {{- end }}
  {{- if .freshnessWindowDays }}
  RAG_FRESHNESS_WINDOW_DAYS: {{ .freshnessWindowDays | quote }}
  {{- end }}
  {{- if hasKey . "freshnessPreDiversity" }}
  RAG_FRESHNESS_PRE_DIVERSITY: {{ .freshnessPreDiversity | quote }}
  {{- end }}
  {{- if hasKey . "rerankTitleEnrich" }}
  RAG_RERANK_TITLE_ENRICH: {{ .rerankTitleEnrich | quote }}
  {{- end }}
  {{- if .entityCacheTtlSecs }}
  RAG_ENTITY_CACHE_TTL_SECS: {{ .entityCacheTtlSecs | quote }}
  {{- end }}
  {{- if .maxRewrites }}
  RAG_MAX_REWRITES: {{ .maxRewrites | quote }}
  {{- end }}
  {{- if .maxChunksPerDoc }}
  RAG_MAX_CHUNKS_PER_DOC: {{ .maxChunksPerDoc | quote }}
  {{- end }}
  {{- if hasKey . "compoundDecompose" }}
  RAG_COMPOUND_DECOMPOSE: {{ .compoundDecompose | quote }}
  {{- end }}
  {{- if .traceDetail }}
  RAG_TRACE_DETAIL: {{ .traceDetail | quote }}
  {{- end }}
  {{- end }}

  # ── Reranker (stage 3 of retrieval pipeline) ────────────────────
  # Default `provider: none` disables the five-stage pipeline. Flip
  # to `bedrock` to activate on AWS deployments.
  {{- with .Values.rerank }}
  {{- if .provider }}
  RAG_RERANK_PROVIDER: {{ .provider | quote }}
  {{- end }}
  {{- if .modelId }}
  RAG_RERANK_MODEL_ID: {{ .modelId | quote }}
  {{- end }}
  {{- if .topN }}
  RAG_RERANK_TOP_N: {{ .topN | quote }}
  {{- end }}
  {{- if .batchSize }}
  RAG_RERANK_BATCH_SIZE: {{ .batchSize | quote }}
  {{- end }}
  {{- if .timeoutSecs }}
  RAG_RERANK_TIMEOUT_SECS: {{ .timeoutSecs | quote }}
  {{- end }}
  {{- if .ollamaBaseUrl }}
  RAG_RERANK_OLLAMA_BASE_URL: {{ .ollamaBaseUrl | quote }}
  {{- end }}
  {{/* Custom-dialect plug-and-play fields — wire any Cohere-family
       rerank API without rebuilding DocBrain. See docs/rerank-providers.md. */}}
  {{- if .customBaseUrl }}
  RAG_RERANK_CUSTOM_BASE_URL: {{ .customBaseUrl | quote }}
  {{- end }}
  {{- if .customApiKeyEnv }}
  RAG_RERANK_CUSTOM_API_KEY_ENV: {{ .customApiKeyEnv | quote }}
  {{- end }}
  {{- if .customAuthStyle }}
  RAG_RERANK_CUSTOM_AUTH_STYLE: {{ .customAuthStyle | quote }}
  {{- end }}
  {{- if .customAuthHeaderName }}
  RAG_RERANK_CUSTOM_AUTH_HEADER_NAME: {{ .customAuthHeaderName | quote }}
  {{- end }}
  {{- if .customDocumentsField }}
  RAG_RERANK_CUSTOM_DOCUMENTS_FIELD: {{ .customDocumentsField | quote }}
  {{- end }}
  {{- if .customTopNField }}
  RAG_RERANK_CUSTOM_TOP_N_FIELD: {{ .customTopNField | quote }}
  {{- end }}
  {{- if .customResultsField }}
  RAG_RERANK_CUSTOM_RESULTS_FIELD: {{ .customResultsField | quote }}
  {{- end }}
  {{- if .customScoreField }}
  RAG_RERANK_CUSTOM_SCORE_FIELD: {{ .customScoreField | quote }}
  {{- end }}
  {{- end }}

  # Ingestion sources live under the nested `sources:` block in config/*.yaml.
  # See docs/configuration.md for the full shape. Env var INGEST_SOURCES is no
  # longer used — enablement is derived from whether a sub-source is present
  # in YAML. Only scalar paths and credentials can be set via env.
  #
  # LOCAL_DOCS_PATH is ONLY emitted when the customer has explicitly opted
  # into local ingest by adding `local:` under `ingest.sources`. Otherwise
  # it would silently populate `sources.local.path` via the env_override
  # mapping and enable local ingest against a non-existent directory.
  {{- if and .Values.ingest.sources (kindIs "map" .Values.ingest.sources) (hasKey .Values.ingest.sources "local") .Values.ingest.localDocsPath }}
  LOCAL_DOCS_PATH: {{ .Values.ingest.localDocsPath | quote }}
  {{- end }}
  INGEST_RUN_ON_STARTUP: {{ .Values.ingest.runOnStartup | default false | quote }}
  OPENSEARCH_URL: {{ include "docbrain.opensearchUrl" . | quote }}
  REDIS_URL: {{ include "docbrain.redisUrl" . | quote }}
  SERVER_BIND: "0.0.0.0"
  SERVER_PORT: {{ .Values.server.port | quote }}

  # Issue #3: env vars documented in docker-compose but previously missing
  CORS_ALLOWED_ORIGINS: {{ .Values.server.corsAllowedOrigins | default "" | quote }}
  LOGIN_SESSION_TTL_HOURS: {{ .Values.server.loginSessionTtlHours | default "720" | quote }}
  AUTOPILOT_GAP_ANALYSIS_INTERVAL_HOURS: {{ .Values.autopilot.gapAnalysisIntervalHours | default "6" | quote }}
  FRESHNESS_SCHEDULER_INTERVAL_HOURS: {{ .Values.freshness.schedulerIntervalHours | default "24" | quote }}
  CONTRADICTION_CHECKS_PER_PASS: {{ .Values.freshness.contradictionChecksPerPass | default "10" | quote }}
  CONTRADICTION_INCLUDE_RECENT_EVENT_DOCS: {{ .Values.freshness.contradictionIncludeRecentEventDocs | default true | quote }}
  CONTRADICTION_EVENT_DOC_MAX_AGE_DAYS: {{ .Values.freshness.contradictionEventDocMaxAgeDays | default 90 | quote }}
  SEMANTIC_QUALITY_ENABLED: {{ .Values.semanticQuality.enabled | default true | quote }}
  SEMANTIC_QUALITY_INTERVAL_HOURS: {{ .Values.semanticQuality.intervalHours | default "24" | quote }}
  SEMANTIC_QUALITY_BUDGET: {{ .Values.semanticQuality.budget | default "50" | quote }}
  SEMANTIC_QUALITY_STRUCTURAL_THRESHOLD: {{ .Values.semanticQuality.structuralThreshold | default "40.0" | quote }}
  CONSOLIDATION_INTERVAL_HOURS: {{ .Values.memory.consolidationIntervalHours | default "6" | quote }}

  {{- if eq .Values.llm.provider "ollama" }}
  OLLAMA_BASE_URL: {{ .Values.llm.ollamaBaseUrl | default "http://ollama:11434" | quote }}
  {{- if .Values.llm.ollamaTimeoutSecs }}
  OLLAMA_TIMEOUT_SECS: {{ .Values.llm.ollamaTimeoutSecs | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.llm.provider "azure_openai" }}
  {{- if .Values.llm.azureOpenaiEndpoint }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.llm.azureOpenaiEndpoint | quote }}
  {{- end }}
  {{- if .Values.llm.azureOpenaiApiVersion }}
  AZURE_OPENAI_API_VERSION: {{ .Values.llm.azureOpenaiApiVersion | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.llm.provider "vertex_ai" }}
  {{- if .Values.llm.vertexProject }}
  VERTEX_PROJECT: {{ .Values.llm.vertexProject | quote }}
  {{- end }}
  {{- if .Values.llm.vertexRegion }}
  VERTEX_REGION: {{ .Values.llm.vertexRegion | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.ingest.confluence }}
  CONFLUENCE_BASE_URL: {{ .Values.ingest.confluence.baseUrl | default "" | quote }}
  CONFLUENCE_USER_EMAIL: {{ .Values.ingest.confluence.email | default "" | quote }}
  CONFLUENCE_SPACE_KEYS: {{ .Values.ingest.confluence.spaceKeys | default "" | quote }}
  CONFLUENCE_API_VERSION: {{ .Values.ingest.confluence.apiVersion | default "v2" | quote }}
  CONFLUENCE_TLS_VERIFY: {{ .Values.ingest.confluence.tlsVerify | default "true" | quote }}
  {{- if .Values.ingest.confluence.pageIds }}
  CONFLUENCE_PAGE_IDS: {{ .Values.ingest.confluence.pageIds | quote }}
  {{- end }}
  {{- if .Values.ingest.confluence.pageLimit }}
  CONFLUENCE_PAGE_LIMIT: {{ .Values.ingest.confluence.pageLimit | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.gitlabCapture.enabled }}
  GITLAB_CAPTURE_BASE_URL: {{ .Values.gitlabCapture.baseUrl | default "https://gitlab.com" | quote }}
  {{- if .Values.gitlabCapture.tlsInsecure }}
  GITLAB_CAPTURE_TLS_INSECURE: "true"
  {{- end }}
  {{- if .Values.gitlabCapture.allowedUsers }}
  GITLAB_CAPTURE_ALLOWED_USERS: {{ .Values.gitlabCapture.allowedUsers | quote }}
  {{- end }}
  {{- if .Values.gitlabCapture.allowedProjects }}
  GITLAB_CAPTURE_ALLOWED_PROJECTS: {{ .Values.gitlabCapture.allowedProjects | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.confluenceWebhook.enabled (not .Values.ingest.confluence) }}
  CONFLUENCE_BASE_URL: {{ .Values.confluenceWebhook.baseUrl | default "" | quote }}
  CONFLUENCE_USER_EMAIL: {{ .Values.confluenceWebhook.email | default "" | quote }}
  CONFLUENCE_API_VERSION: {{ .Values.confluenceWebhook.apiVersion | default "v2" | quote }}
  {{- end }}
  # GitHub, GitLab, Slack, Jira, Linear, etc. are configured in the nested
  # `sources:` YAML block (see docs/configuration.md). Their credentials can
  # be injected via Secret — see the secret.yaml template and values.yaml.
  {{- if ne .Values.autopilot.enabled false }}
  AUTOPILOT_ENABLED: "true"
  {{- else }}
  AUTOPILOT_ENABLED: "false"
  {{- end }}
  {{- if .Values.autopilot.autoDraft }}
  AUTOPILOT_AUTO_DRAFT: "true"
  AUTOPILOT_AUTO_DRAFT_SEVERITY: {{ .Values.autopilot.autoDraftSeverity | default "critical" | quote }}
  {{- end }}
  AUTOPILOT_CRITICAL_USERS: {{ .Values.autopilot.criticalUsers | default 5 | quote }}
  AUTOPILOT_CRITICAL_SIGNALS: {{ .Values.autopilot.criticalSignals | default 15 | quote }}
  AUTOPILOT_CRITICAL_THRESHOLD: {{ .Values.autopilot.thresholdCritical | default 0.75 | quote }}
  AUTOPILOT_HIGH_THRESHOLD: {{ .Values.autopilot.thresholdHigh | default 0.55 | quote }}
  AUTOPILOT_MEDIUM_THRESHOLD: {{ .Values.autopilot.thresholdMedium | default 0.35 | quote }}
  {{- if and .Values.draftPublish .Values.draftPublish.target (ne .Values.draftPublish.target "none") }}
  DRAFT_PUBLISH_TARGET: {{ .Values.draftPublish.target | quote }}
  {{- end }}
  {{- if and .Values.draftPublish .Values.draftPublish.confluenceSpaceKey }}
  DRAFT_PUBLISH_CONFLUENCE_SPACE_KEY: {{ .Values.draftPublish.confluenceSpaceKey | quote }}
  {{- end }}
  {{- if and .Values.draftPublish .Values.draftPublish.confluenceParentPageId }}
  DRAFT_PUBLISH_PARENT_PAGE_ID: {{ .Values.draftPublish.confluenceParentPageId | quote }}
  {{- end }}
  {{- if and .Values.draftPublish .Values.draftPublish.github }}
  {{- with .Values.draftPublish.github }}
  {{- if .repo }}
  GITHUB_PUBLISH_REPO: {{ .repo | quote }}
  {{- end }}
  GITHUB_PUBLISH_BRANCH: {{ .branch | default "main" | quote }}
  GITHUB_PUBLISH_DOCS_PATH: {{ .docsPath | default "docs" | quote }}
  GITHUB_PUBLISH_PR_LABELS: {{ .prLabels | default "docbrain,auto-generated" | quote }}
  GITHUB_PUBLISH_CREATE_PR: {{ .createPr | default true | quote }}
  {{- if .apiUrl }}
  GITHUB_PUBLISH_API_URL: {{ .apiUrl | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and .Values.draftPublish .Values.draftPublish.gitlab }}
  {{- with .Values.draftPublish.gitlab }}
  {{- if .projectId }}
  GITLAB_PUBLISH_PROJECT_ID: {{ .projectId | quote }}
  {{- end }}
  {{- if .baseUrl }}
  GITLAB_PUBLISH_BASE_URL: {{ .baseUrl | quote }}
  {{- end }}
  GITLAB_PUBLISH_BRANCH: {{ .branch | default "main" | quote }}
  GITLAB_PUBLISH_DOCS_PATH: {{ .docsPath | default "docs" | quote }}
  GITLAB_PUBLISH_MR_LABELS: {{ .mrLabels | default "docbrain,auto-generated" | quote }}
  GITLAB_PUBLISH_CREATE_MR: {{ .createMr | default true | quote }}
  {{- end }}
  {{- end }}

  # OAuth / SSO providers
  # OIDC_WEB_UI_URL tells the backend where to redirect the browser after any OAuth
  # callback completes (GitHub, GitLab, or generic OIDC). It must be set whenever any
  # SSO provider is enabled; emitting it here unconditionally when any provider is on.
  {{- $webUiUrl := .Values.sso.webUiUrl | default "" }}
  {{- if .Values.oidc.webUiUrl }}{{- $webUiUrl = .Values.oidc.webUiUrl }}{{- end }}
  {{- if .Values.githubOAuth.webUiUrl }}{{- $webUiUrl = .Values.githubOAuth.webUiUrl }}{{- end }}
  {{- if .Values.gitlabOAuth.webUiUrl }}{{- $webUiUrl = .Values.gitlabOAuth.webUiUrl }}{{- end }}
  {{- if $webUiUrl }}
  OIDC_WEB_UI_URL: {{ $webUiUrl | quote }}
  {{- end }}
  {{- if .Values.githubOAuth.enabled }}
  GITHUB_REDIRECT_URI: {{ .Values.githubOAuth.redirectUri | default "" | quote }}
  {{- end }}
  {{- if .Values.gitlabOAuth.enabled }}
  GITLAB_OIDC_ISSUER_URL: {{ .Values.gitlabOAuth.instanceUrl | default "https://gitlab.com" | quote }}
  GITLAB_REDIRECT_URI: {{ .Values.gitlabOAuth.redirectUri | default "" | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  OIDC_ISSUER_URL: {{ .Values.oidc.issuerUrl | default "" | quote }}
  OIDC_REDIRECT_URI: {{ .Values.oidc.redirectUri | default "" | quote }}
  {{- end }}

  # Source-System ACL Mirroring (RFC-001)
  ACL_MODE: {{ .Values.acl.mode | default "off" | quote }}
  ACL_UNKNOWN_POLICY: {{ .Values.acl.unknownPolicy | default "deny" | quote }}
  ACL_RECALL_OVERFETCH: {{ .Values.acl.recallOverfetch | default 1.0 | quote }}
  ACL_USER_PRINCIPAL_MAX_AGE_SECS: {{ .Values.acl.userPrincipalMaxAgeSecs | default 3600 | quote }}
  # Denial UX (RFC-002) — guarded against missing acl.denial block in older values files.
  {{- $denial := .Values.acl.denial | default dict }}
  ACL_DENIAL_MODE: {{ $denial.mode | default "disclosed_no_count" | quote }}
  ACL_DENIAL_REFERRAL: {{ $denial.referral | default "your administrator" | quote }}
  ACL_DENIAL_AUDIT: {{ $denial.audit | default false | quote }}
  ACL_DENIAL_AUDIT_RAW_QUERY: {{ $denial.auditRawQuery | default false | quote }}
  # Per-source ingest policy (M1.4 / M1.5) — drives the *AclProvider impls.
  {{- $sources := .Values.acl.sources | default dict }}
  {{- $confluence := $sources.confluence | default dict }}
  {{- $github := $sources.github | default dict }}
  {{- $slack := $sources.slack | default dict }}
  {{- $jira := $sources.jira | default dict }}
  ACL_CONFLUENCE_MODE: {{ $confluence.mode | default "off" | quote }}
  {{- range $space, $mode := $confluence.spaceOverrides }}
  ACL_CONFLUENCE_SPACE_{{ $space | upper }}: {{ $mode | quote }}
  {{- end }}
  ACL_GITHUB_MODE: {{ $github.mode | default "off" | quote }}
  ACL_SLACK_MODE:  {{ $slack.mode | default "off" | quote }}
  ACL_JIRA_MODE:   {{ $jira.mode | default "off" | quote }}

  # RBAC / SSO access control — emitted unconditionally so the server always
  # has these available regardless of which SSO provider is active.
  OIDC_DEFAULT_ROLE: {{ .Values.rbac.defaultRole | default "viewer" | quote }}
  {{- if .Values.rbac.adminDomain }}
  OIDC_ADMIN_DOMAIN: {{ .Values.rbac.adminDomain | quote }}
  {{- end }}
  {{- if .Values.rbac.adminEmails }}
  OIDC_ADMIN_EMAILS: {{ .Values.rbac.adminEmails | quote }}
  {{- end }}
  {{- if .Values.rbac.adminGroups }}
  OIDC_ADMIN_GROUPS: {{ .Values.rbac.adminGroups | quote }}
  {{- end }}
  {{- if .Values.rbac.analystGroups }}
  OIDC_ANALYST_GROUPS: {{ .Values.rbac.analystGroups | quote }}
  {{- end }}
  {{- if .Values.rbac.editorGroups }}
  OIDC_EDITOR_GROUPS: {{ .Values.rbac.editorGroups | quote }}
  {{- end }}
  {{- if .Values.rbac.allowedGroups }}
  OIDC_ALLOWED_GROUPS: {{ .Values.rbac.allowedGroups | quote }}
  {{- end }}
  {{- if .Values.rbac.allowedDomains }}
  OIDC_ALLOWED_DOMAINS: {{ .Values.rbac.allowedDomains | quote }}
  {{- end }}

  # Learning pipeline — wires the server to the trainer sidecar when enabled
  {{- if .Values.learning.enabled }}
  LEARNING_ENABLED: "true"
  EMBED_PROVIDER: "local"
  TRAINER_URL: {{ printf "http://%s-trainer:8765" (include "docbrain.fullname" .) | quote }}
  {{- end }}

  # Documentation Analytics
  VELOCITY_MINUTES_SAVED_PER_QUERY: {{ .Values.velocity.minutesSavedPerQuery | default 15 | quote }}
  VELOCITY_HOURLY_RATE: {{ .Values.velocity.hourlyRate | default 75 | quote }}

  # Event Bus
  EVENT_BUS_CAPACITY: {{ .Values.eventBus.capacity | default 4096 | quote }}
  EVENT_LOG_RETENTION_DAYS: {{ .Values.eventBus.retentionDays | default 90 | quote }}

  # Knowledge Fragments
  FRAGMENT_AUTO_INDEX_THRESHOLD: {{ .Values.fragments.autoIndexThreshold | default 0.7 | quote }}
  FRAGMENT_REVIEW_THRESHOLD: {{ .Values.fragments.reviewThreshold | default 0.4 | quote }}
  FRAGMENT_MAX_CONTENT_LENGTH: {{ .Values.fragments.maxContentLength | default 10000 | quote }}

  # Conversation Auto-Distillation
  DISTILLATION_ENABLED: {{ .Values.fragments.distillation.enabled | default true | quote }}
  DISTILLATION_MAX_CONCURRENT: {{ .Values.fragments.distillation.maxConcurrent | default 3 | quote }}
  DISTILLATION_MAX_CONTENT_CHARS: {{ .Values.fragments.distillation.maxContentChars | default 8000 | quote }}
  DISTILLATION_MAX_FRAGMENTS: {{ .Values.fragments.distillation.maxFragments | default 5 | quote }}

  # Fragment Clustering
  FRAGMENT_CLUSTERING_ENABLED: {{ .Values.fragments.clustering.enabled | default true | quote }}
  FRAGMENT_CLUSTER_THRESHOLD: {{ .Values.fragments.clustering.clusterThreshold | default 0.80 | quote }}
  FRAGMENT_MIN_CLUSTER_SIZE: {{ .Values.fragments.clustering.minClusterSize | default 3 | quote }}
  FRAGMENT_MIN_SOURCE_DIVERSITY: {{ .Values.fragments.clustering.minSourceDiversity | default 2 | quote }}
  FRAGMENT_MAX_PER_CLUSTERING_RUN: {{ .Values.fragments.clustering.maxFragmentsPerRun | default 2000 | quote }}

  # Governance SLA Checker
  SLA_CHECKER_INTERVAL_HOURS: {{ .Values.governance.slaCheckerIntervalHours | default 1 | quote }}
  SLA_CHECKER_QUERY_TIMEOUT_SECS: {{ .Values.governance.slaCheckerQueryTimeoutSecs | default 30 | quote }}
  SLA_CHECKER_MAX_CANDIDATES: {{ .Values.governance.slaCheckerMaxCandidates | default 5000 | quote }}
  SLA_CHECKER_MAX_EVENTS_PER_RUN: {{ .Values.governance.slaCheckerMaxEventsPerRun | default 50 | quote }}

  # External Connectors
  CONNECTOR_ENABLED: {{ .Values.connectors.enabled | default true | quote }}
  CONNECTOR_MAX_CONCURRENT_SYNCS: {{ .Values.connectors.maxConcurrentSyncs | default 3 | quote }}
  CONNECTOR_MAX_PAGES_PER_SYNC: {{ .Values.connectors.maxPagesPerSync | default 200 | quote }}
  CONNECTOR_MAX_DOCUMENTS_PER_SYNC: {{ .Values.connectors.maxDocumentsPerSync | default 5000 | quote }}
  CONNECTOR_FETCH_BATCH_SIZE: {{ .Values.connectors.fetchBatchSize | default 50 | quote }}
  CONNECTOR_REQUEST_TIMEOUT_SECS: {{ .Values.connectors.requestTimeoutSecs | default 30 | quote }}
  CONNECTOR_SYNC_TIMEOUT_SECS: {{ .Values.connectors.syncTimeoutSecs | default 3600 | quote }}
  CONNECTOR_MAX_RESPONSE_BYTES: {{ .Values.connectors.maxResponseBytes | default 10485760 | int64 | quote }}
  CONNECTOR_CIRCUIT_BREAKER_THRESHOLD: {{ .Values.connectors.circuitBreakerThreshold | default 5 | quote }}
  CONNECTOR_ALLOW_INTERNAL: {{ .Values.connectors.allowInternal | default false | quote }}

  # CI/CD Pipeline Capture
  CI_ANALYZE_ENABLED: {{ .Values.ci.enabled | default true | quote }}

  # Knowledge Stream
  STREAM_ENABLED: {{ .Values.stream.enabled | default false | quote }}
  STREAM_INTERVAL_MINUTES: {{ .Values.stream.intervalMinutes | default 30 | quote }}
  STREAM_INCIDENT_WARNING_MIN_USERS: {{ .Values.stream.incidentWarningMinUsers | default 2 | quote }}
  STREAM_DECAY_THRESHOLD: {{ .Values.stream.decayThreshold | default 0.5 | quote }}

  {{- range $key, $val := .Values.server.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
