apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docbrain.fullname" . }}-config
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
data:
  LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  LLM_MODEL_ID: {{ .Values.llm.modelId | quote }}
  {{- if .Values.llm.fastModelId }}
  FAST_MODEL_ID: {{ .Values.llm.fastModelId | quote }}
  {{- end }}
  {{- if .Values.llm.ingestModelId }}
  INGEST_LLM_MODEL_ID: {{ .Values.llm.ingestModelId | quote }}
  {{- end }}
  {{- if .Values.llm.draftModelId }}
  DRAFT_MODEL_ID: {{ .Values.llm.draftModelId | quote }}
  {{- end }}
  {{- if .Values.llm.draftProvider }}
  DRAFT_LLM_PROVIDER: {{ .Values.llm.draftProvider | quote }}
  {{- end }}
  {{- if .Values.llm.thinkingBudget }}
  LLM_THINKING_BUDGET: {{ .Values.llm.thinkingBudget | quote }}
  {{- end }}
  EMBED_PROVIDER: {{ .Values.embedding.provider | quote }}
  EMBED_MODEL_ID: {{ .Values.embedding.modelId | quote }}
  INGEST_SOURCES: {{ .Values.ingest.sources | quote }}
  LOCAL_DOCS_PATH: {{ .Values.ingest.localDocsPath | quote }}
  OPENSEARCH_URL: {{ include "docbrain.opensearchUrl" . | quote }}
  REDIS_URL: {{ include "docbrain.redisUrl" . | quote }}
  SERVER_BIND: "0.0.0.0"
  SERVER_PORT: {{ .Values.server.port | quote }}
  {{- if eq .Values.llm.provider "ollama" }}
  OLLAMA_BASE_URL: {{ .Values.llm.ollamaBaseUrl | default "http://ollama:11434" | quote }}
  {{- if .Values.llm.ollamaTimeoutSecs }}
  OLLAMA_TIMEOUT_SECS: {{ .Values.llm.ollamaTimeoutSecs | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.llm.provider "azure_openai" }}
  {{- if .Values.llm.azureOpenaiEndpoint }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.llm.azureOpenaiEndpoint | quote }}
  {{- end }}
  {{- if .Values.llm.azureOpenaiApiVersion }}
  AZURE_OPENAI_API_VERSION: {{ .Values.llm.azureOpenaiApiVersion | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.llm.provider "vertex_ai" }}
  {{- if .Values.llm.vertexProject }}
  VERTEX_PROJECT: {{ .Values.llm.vertexProject | quote }}
  {{- end }}
  {{- if .Values.llm.vertexRegion }}
  VERTEX_REGION: {{ .Values.llm.vertexRegion | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.ingest.confluence }}
  CONFLUENCE_BASE_URL: {{ .Values.ingest.confluence.baseUrl | default "" | quote }}
  CONFLUENCE_EMAIL: {{ .Values.ingest.confluence.email | default "" | quote }}
  # The code reads CONFLUENCE_USER_EMAIL for Confluence Cloud (v2) Basic auth on
  # every WRITE (publisher update/create + augment fetch). It was previously only
  # emitted from confluenceWebhook.email, which is unset when ingest.confluence is
  # configured — so all v2 writes failed "requires user_email". Source it from the
  # same ingest account email that already drives reads.
  CONFLUENCE_USER_EMAIL: {{ .Values.ingest.confluence.email | default "" | quote }}
  CONFLUENCE_SPACE_KEYS: {{ .Values.ingest.confluence.spaceKeys | default "" | quote }}
  CONFLUENCE_API_VERSION: {{ .Values.ingest.confluence.apiVersion | default "v2" | quote }}
  {{- if .Values.ingest.confluence.pageIds }}
  CONFLUENCE_PAGE_IDS: {{ .Values.ingest.confluence.pageIds | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.gitlabCapture.enabled }}
  GITLAB_CAPTURE_BASE_URL: {{ .Values.gitlabCapture.baseUrl | default "https://gitlab.com" | quote }}
  {{- if .Values.gitlabCapture.tlsInsecure }}
  GITLAB_CAPTURE_TLS_INSECURE: "true"
  {{- end }}
  {{- if .Values.gitlabCapture.allowedUsers }}
  GITLAB_CAPTURE_ALLOWED_USERS: {{ .Values.gitlabCapture.allowedUsers | quote }}
  {{- end }}
  {{- if .Values.gitlabCapture.allowedProjects }}
  GITLAB_CAPTURE_ALLOWED_PROJECTS: {{ .Values.gitlabCapture.allowedProjects | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.confluenceWebhook.enabled (not .Values.ingest.confluence) }}
  CONFLUENCE_BASE_URL: {{ .Values.confluenceWebhook.baseUrl | default "" | quote }}
  CONFLUENCE_USER_EMAIL: {{ .Values.confluenceWebhook.email | default "" | quote }}
  CONFLUENCE_API_VERSION: {{ .Values.confluenceWebhook.apiVersion | default "v2" | quote }}
  {{- end }}
  {{- if .Values.ingest.github }}
  GITHUB_REPO_URL: {{ .Values.ingest.github.repoUrl | default "" | quote }}
  GITHUB_BRANCH: {{ .Values.ingest.github.branch | default "main" | quote }}
  {{- end }}
  OPENSEARCH_INDEX: {{ .Values.opensearch.chunksIndex | default "docbrain-chunks" | quote }}
  OPENSEARCH_EPISODE_INDEX: {{ .Values.opensearch.episodesIndex | default "docbrain-episodes" | quote }}
  {{- if ne .Values.autopilot.enabled false }}
  AUTOPILOT_ENABLED: "true"
  {{- else }}
  AUTOPILOT_ENABLED: "false"
  {{- end }}

  # OAuth / SSO providers
  # OIDC_WEB_UI_URL tells the backend where to redirect the browser after any OAuth
  # callback completes (GitHub, GitLab, or generic OIDC). Must be set in prod.
  {{- $webUiUrl := .Values.sso.webUiUrl | default "" }}
  {{- if .Values.oidc.webUiUrl }}{{- $webUiUrl = .Values.oidc.webUiUrl }}{{- end }}
  {{- if .Values.githubOAuth.webUiUrl }}{{- $webUiUrl = .Values.githubOAuth.webUiUrl }}{{- end }}
  {{- if .Values.gitlabOAuth.webUiUrl }}{{- $webUiUrl = .Values.gitlabOAuth.webUiUrl }}{{- end }}
  {{- if $webUiUrl }}
  OIDC_WEB_UI_URL: {{ $webUiUrl | quote }}
  {{- end }}
  {{- if .Values.githubOAuth.enabled }}
  GITHUB_REDIRECT_URI: {{ .Values.githubOAuth.redirectUri | default "" | quote }}
  {{- end }}
  {{- if .Values.gitlabOAuth.enabled }}
  GITLAB_OIDC_ISSUER_URL: {{ .Values.gitlabOAuth.instanceUrl | default "https://gitlab.com" | quote }}
  GITLAB_REDIRECT_URI: {{ .Values.gitlabOAuth.redirectUri | default "" | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  OIDC_ISSUER_URL: {{ .Values.oidc.issuerUrl | default "" | quote }}
  OIDC_REDIRECT_URI: {{ .Values.oidc.redirectUri | default "" | quote }}
  {{- end }}

  # Source-System ACL Mirroring (RFC-001)
  ACL_MODE: {{ .Values.acl.mode | default "off" | quote }}
  ACL_UNKNOWN_POLICY: {{ .Values.acl.unknownPolicy | default "deny" | quote }}
  ACL_RECALL_OVERFETCH: {{ .Values.acl.recallOverfetch | default 1.0 | quote }}
  ACL_USER_PRINCIPAL_MAX_AGE_SECS: {{ .Values.acl.userPrincipalMaxAgeSecs | default 3600 | quote }}
  # Denial UX (RFC-002)
  ACL_DENIAL_MODE: {{ .Values.acl.denial.mode | default "disclosed_no_count" | quote }}
  ACL_DENIAL_REFERRAL: {{ .Values.acl.denial.referral | default "your administrator" | quote }}
  ACL_DENIAL_AUDIT: {{ .Values.acl.denial.audit | default false | quote }}
  ACL_DENIAL_AUDIT_RAW_QUERY: {{ .Values.acl.denial.auditRawQuery | default false | quote }}
  # Per-source ingest policy (M1.4 / M1.5) — drives the *AclProvider impls.
  ACL_CONFLUENCE_MODE: {{ .Values.acl.sources.confluence.mode | default "off" | quote }}
  {{- range $space, $mode := .Values.acl.sources.confluence.spaceOverrides }}
  ACL_CONFLUENCE_SPACE_{{ $space | upper }}: {{ $mode | quote }}
  {{- end }}
  ACL_GITHUB_MODE: {{ .Values.acl.sources.github.mode | default "off" | quote }}
  ACL_SLACK_MODE:  {{ .Values.acl.sources.slack.mode | default "off" | quote }}
  ACL_JIRA_MODE:   {{ .Values.acl.sources.jira.mode | default "off" | quote }}

  # RBAC / SSO access control
  OIDC_DEFAULT_ROLE: {{ .Values.rbac.defaultRole | default "viewer" | quote }}
  {{- if .Values.rbac.adminDomain }}
  OIDC_ADMIN_DOMAIN: {{ .Values.rbac.adminDomain | quote }}
  {{- end }}
  {{- if .Values.rbac.adminEmails }}
  OIDC_ADMIN_EMAILS: {{ .Values.rbac.adminEmails | quote }}
  {{- end }}
  {{- if .Values.rbac.adminGroups }}
  OIDC_ADMIN_GROUPS: {{ .Values.rbac.adminGroups | quote }}
  {{- end }}
  {{- if .Values.rbac.editorGroups }}
  OIDC_EDITOR_GROUPS: {{ .Values.rbac.editorGroups | quote }}
  {{- end }}
  {{- if .Values.rbac.allowedGroups }}
  OIDC_ALLOWED_GROUPS: {{ .Values.rbac.allowedGroups | quote }}
  {{- end }}
  {{- if .Values.rbac.allowedDomains }}
  OIDC_ALLOWED_DOMAINS: {{ .Values.rbac.allowedDomains | quote }}
  {{- end }}

  AUTOPILOT_LOOKBACK_DAYS: {{ .Values.autopilot.lookbackDays | default 30 | quote }}
  AUTOPILOT_MAX_CLUSTERS: {{ .Values.autopilot.maxClusters | default 50 | quote }}
  AUTOPILOT_MAX_EPISODES: {{ .Values.autopilot.maxEpisodes | default 500 | quote }}
  AUTOPILOT_GAP_ANALYSIS_INTERVAL_HOURS: {{ .Values.autopilot.gapAnalysisIntervalHours | default 6 | quote }}
  {{- if .Values.autopilot.autoDraft }}
  AUTOPILOT_AUTO_DRAFT: "true"
  AUTOPILOT_AUTO_DRAFT_SEVERITY: {{ .Values.autopilot.autoDraftSeverity | default "critical" | quote }}
  {{- end }}
  AUTOPILOT_CRITICAL_USERS: {{ .Values.autopilot.criticalUsers | default 5 | quote }}
  AUTOPILOT_CRITICAL_SIGNALS: {{ .Values.autopilot.criticalSignals | default 15 | quote }}
  AUTOPILOT_CRITICAL_THRESHOLD: {{ .Values.autopilot.thresholdCritical | default 0.75 | quote }}
  AUTOPILOT_HIGH_THRESHOLD: {{ .Values.autopilot.thresholdHigh | default 0.55 | quote }}
  AUTOPILOT_MEDIUM_THRESHOLD: {{ .Values.autopilot.thresholdMedium | default 0.35 | quote }}
  # Forecast Trend v2 — see docs/configuration.md § "Forecast Trend methodology".
  AUTOPILOT_TREND_V2_ENABLED:        {{ if hasKey .Values.autopilot "trendV2Enabled" }}{{ .Values.autopilot.trendV2Enabled | quote }}{{ else }}"true"{{ end }}
  AUTOPILOT_TREND_MIN_EVENTS:        {{ .Values.autopilot.trendMinEvents          | default 5    | quote }}
  AUTOPILOT_TREND_IMPROVING_THRESHOLD: {{ .Values.autopilot.trendImprovingThreshold | default 0.75 | quote }}
  AUTOPILOT_TREND_WORSENING_THRESHOLD: {{ .Values.autopilot.trendWorseningThreshold | default 0.40 | quote }}
  {{- if hasKey .Values.autopilot "generatedDocsRetentionDays" }}
  GENERATED_DOCS_RETENTION_DAYS: {{ .Values.autopilot.generatedDocsRetentionDays | quote }}
  {{- end }}
  {{- if .Values.draftPublish.target }}
  DRAFT_PUBLISH_TARGET: {{ .Values.draftPublish.target | quote }}
  {{- end }}
  {{- if .Values.draftPublish.confluenceSpaceKey }}
  DRAFT_PUBLISH_CONFLUENCE_SPACE_KEY: {{ .Values.draftPublish.confluenceSpaceKey | quote }}
  {{- end }}
  {{- if .Values.draftPublish.confluenceParentPageId }}
  DRAFT_PUBLISH_PARENT_PAGE_ID: {{ .Values.draftPublish.confluenceParentPageId | quote }}
  {{- end }}
  DRAFT_PUBLISH_AUTO_INGEST: {{ .Values.draftPublish.autoIngestAfterPublish | default true | quote }}
  FRESHNESS_SCHEDULER_INTERVAL_HOURS: {{ .Values.freshness.schedulerIntervalHours | default 24 | quote }}
  CONTRADICTION_CHECKS_PER_PASS: {{ .Values.freshness.contradictionChecksPerPass | default 10 | quote }}
  CONTRADICTION_INCLUDE_RECENT_EVENT_DOCS: {{ .Values.freshness.contradictionIncludeRecentEventDocs | default true | quote }}
  CONTRADICTION_EVENT_DOC_MAX_AGE_DAYS: {{ .Values.freshness.contradictionEventDocMaxAgeDays | default 90 | quote }}
  # Engagement-v2 (Wilson lower bound on distinct users, recency-windowed).
  # See values.yaml `freshness.engagementV2Enabled` for the semantics.
  # Flag-off (default) → legacy v1 engagement path runs verbatim.
  FRESHNESS_ENGAGEMENT_V2_ENABLED: {{ .Values.freshness.engagementV2Enabled | default false | quote }}
  FRESHNESS_ENGAGEMENT_MIN_RETRIEVERS: {{ .Values.freshness.engagementMinRetrievers | default 3 | quote }}
  FRESHNESS_ENGAGEMENT_MIN_VOTERS: {{ .Values.freshness.engagementMinVoters | default 3 | quote }}
  FRESHNESS_ENGAGEMENT_WINDOW_DAYS: {{ .Values.freshness.engagementWindowDays | default 180 | quote }}
  # Pass 2: LLM content-currency analysis. Default 50 docs per scheduler tick.
  # Raise for larger corpora — at 50/day, 10k docs would take ~200 days to cover.
  # Each call costs LLM tokens proportional to doc length.
  FRESHNESS_LLM_CALLS_PER_PASS: {{ .Values.freshness.llmCallsPerPass | default 50 | quote }}
  # Pass 3: HTTP HEAD link-health checks. Default 20 docs per tick. Cheap
  # compared to LLM — safe to raise for large corpora.
  FRESHNESS_LINK_CHECKS_PER_PASS: {{ .Values.freshness.linkChecksPerPass | default 20 | quote }}
  CONSOLIDATION_INTERVAL_HOURS: {{ .Values.consolidation.intervalHours | default 6 | quote }}
  # Learning Velocity / Documentation ROI
  # See docs/configuration.md § "Documentation ROI — how the number is calculated"
  # for a non-technical operator guide on tuning these knobs.
  VELOCITY_MINUTES_SAVED:           {{ .Values.velocity.minutesSavedPerQuery     | default 15    | quote }}
  VELOCITY_HOURLY_RATE:             {{ .Values.velocity.hourlyRate               | default 75    | quote }}
  # Booleans below use `hasKey` rather than Sprig's `default` because the
  # `default true` filter silently overrides an operator's explicit `false`.
  VELOCITY_ROI_V2_ENABLED:          {{ if hasKey .Values.velocity "roiV2Enabled"   }}{{ .Values.velocity.roiV2Enabled   | quote }}{{ else }}"true"{{ end }}
  VELOCITY_ROI_MIN_MINUTES_LOW:     {{ .Values.velocity.roiMinutesSavedLow       | default 5     | quote }}
  VELOCITY_ROI_MIN_MINUTES_HIGH:    {{ .Values.velocity.roiMinutesSavedHigh      | default 25    | quote }}
  VELOCITY_ROI_MIN_DISTINCT_USERS:  {{ .Values.velocity.roiMinDistinctUsers      | default 3     | quote }}
  VELOCITY_ROI_EXCLUDE_ADMIN:       {{ if hasKey .Values.velocity "roiExcludeAdmin" }}{{ .Values.velocity.roiExcludeAdmin | quote }}{{ else }}"true"{{ end }}
  VELOCITY_ROI_MAX_VOTES_PER_USER:  {{ .Values.velocity.roiMaxVotesPerUser       | default 10    | quote }}
  # Tribal Knowledge v2 — same hasKey pattern for booleans.
  VELOCITY_TRIBAL_V2_ENABLED:       {{ if hasKey .Values.velocity "tribalV2Enabled"    }}{{ .Values.velocity.tribalV2Enabled    | quote }}{{ else }}"true"{{ end }}
  VELOCITY_TRIBAL_MAX_EXPERTS:      {{ .Values.velocity.tribalMaxExpertsPerDomain | default 2 | quote }}
  VELOCITY_TRIBAL_MIN_DOMAINS:      {{ .Values.velocity.tribalMinDomainsWithSignal | default 3 | quote }}
  VELOCITY_MAINTENANCE_TREND_MIN_SNAPSHOTS: {{ .Values.velocity.maintenanceTrendMinSnapshots | default 4 | quote }}
  VELOCITY_BULK_UPDATE_MULTIPLE:    {{ .Values.velocity.bulkUpdateMultiple | default 10.0 | quote }}
  VELOCITY_SUBSTANTIVE_UPDATE_CEILING: {{ .Values.velocity.substantiveUpdateCeiling | default 2000 | quote }}
  # Expertise Ownership Gate — thresholds the scorer clears before publishing a
  # (subject, team) attribution. UI accuracy gate controls whether confident
  # attributions reach end users; disabled by default until accuracy is proven.
  {{- if .Values.expertiseGate }}
  EXPERTISE_GATE_V_MIN: {{ .Values.expertiseGate.vMin | default 1.0 | quote }}
  EXPERTISE_GATE_N_MIN: {{ .Values.expertiseGate.nMin | default 5 | quote }}
  EXPERTISE_GATE_M_ASKERS: {{ .Values.expertiseGate.mAskers | default 2 | quote }}
  EXPERTISE_GATE_MARGIN_FRAC: {{ .Values.expertiseGate.marginFrac | default 0.25 | quote }}
  EXPERTISE_GATE_DIVERSITY_MIN: {{ .Values.expertiseGate.diversityMin | default 2 | quote }}
  # Booleans use hasKey so an explicit `false` is not silently overridden.
  EXPERTISE_GATE_UI_ENABLED: {{ if hasKey .Values.expertiseGate "uiGateEnabled" }}{{ .Values.expertiseGate.uiGateEnabled | quote }}{{ else }}"false"{{ end }}
  EXPERTISE_GATE_UI_CONFIDENTLY_WRONG_BAR: {{ .Values.expertiseGate.uiConfidentlyWrongBar | default 0.0 | quote }}
  EXPERTISE_GATE_UI_MIN_AUDIT_SAMPLES: {{ .Values.expertiseGate.uiMinAuditSamples | default 30 | quote }}
  {{- end }}
  # Doc-improvement evidence loop. The re-ingest-confirm timeout distinguishes a
  # stuck publish ("stale — never confirmed live") from a normal in-flight one.
  {{- if .Values.improvement }}
  IMPROVEMENT_REINGEST_CONFIRM_TIMEOUT_HOURS: {{ .Values.improvement.reingestConfirmTimeoutHours | default 72 | quote }}
  {{- end }}
  # Knowledge Stream
  {{- if .Values.stream.enabled }}
  STREAM_ENABLED: "true"
  {{- else }}
  STREAM_ENABLED: "false"
  {{- end }}
  STREAM_INTERVAL_MINUTES: {{ .Values.stream.intervalMinutes | default 30 | quote }}
  STREAM_INCIDENT_WARNING_MIN_USERS: {{ .Values.stream.incidentWarningMinUsers | default 2 | quote }}
  {{- if .Values.stream.alertChannel }}
  STREAM_ALERT_CHANNEL: {{ .Values.stream.alertChannel | quote }}
  {{- end }}
  STREAM_EXPERTISE_GAP_DAYS: {{ .Values.stream.expertiseGapDays | default 90 | quote }}
  RAG_CACHE_TTL_HOURS: {{ .Values.rag.cacheTtlHours | default 24 | quote }}
  RAG_CACHE_THRESHOLD: {{ .Values.rag.cacheThreshold | default "0.95" | quote }}
  {{- if .Values.rag.mcpOutputCeilingBytes }}
  DOCBRAIN_MCP_OUTPUT_CEILING_BYTES: {{ .Values.rag.mcpOutputCeilingBytes | quote }}
  {{- end }}
  {{- if .Values.rag.mcpDefaultToolOutputCapBytes }}
  DOCBRAIN_MCP_DEFAULT_TOOL_OUTPUT_CAP_BYTES: {{ .Values.rag.mcpDefaultToolOutputCapBytes | quote }}
  {{- end }}
  {{- if .Values.rag.evidenceBufferCapBytes }}
  DOCBRAIN_EVIDENCE_BUFFER_CAP_BYTES: {{ .Values.rag.evidenceBufferCapBytes | quote }}
  {{- end }}
  {{- if .Values.rag.mcpJqlRecencyBoundDays }}
  DOCBRAIN_MCP_JQL_RECENCY_BOUND_DAYS: {{ .Values.rag.mcpJqlRecencyBoundDays | quote }}
  {{- end }}
  {{- if .Values.rag.retrievalLadder }}
  {{- if .Values.rag.retrievalLadder.enabled }}
  RAG_RETRIEVAL_LADDER_ENABLED: {{ .Values.rag.retrievalLadder.enabled | quote }}
  {{- end }}
  {{- if .Values.rag.retrievalLadder.graphAppendThreshold }}
  RAG_RETRIEVAL_LADDER_GRAPH_THRESHOLD: {{ .Values.rag.retrievalLadder.graphAppendThreshold | quote }}
  {{- end }}
  {{- if .Values.rag.retrievalLadder.judgeTimeoutMs }}
  RAG_RETRIEVAL_LADDER_JUDGE_TIMEOUT_MS: {{ .Values.rag.retrievalLadder.judgeTimeoutMs | quote }}
  {{- end }}
  {{- if .Values.rag.retrievalLadder.judgeModelId }}
  RAG_RETRIEVAL_LADDER_JUDGE_MODEL_ID: {{ .Values.rag.retrievalLadder.judgeModelId | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.rag.fusion }}
  {{- if .Values.rag.fusion.preferFused }}
  RAG_FUSION_PREFER_FUSED: {{ .Values.rag.fusion.preferFused | quote }}
  {{- end }}
  {{- end }}
  {{- if hasKey .Values.rag "regenLoopEnabled" }}
  DOCBRAIN_REGEN_LOOP_ENABLED: {{ .Values.rag.regenLoopEnabled | quote }}
  {{- end }}
  {{- if .Values.rag.regenLoopMaxRounds }}
  DOCBRAIN_REGEN_LOOP_MAX_ROUNDS: {{ .Values.rag.regenLoopMaxRounds | quote }}
  {{- end }}
  {{- if .Values.rag.regenLoopMaxRevisions }}
  DOCBRAIN_REGEN_LOOP_MAX_REVISIONS: {{ .Values.rag.regenLoopMaxRevisions | quote }}
  {{- end }}
  {{- if hasKey .Values.rag "regenLoopMinBudgetMs" }}
  DOCBRAIN_REGEN_LOOP_MIN_BUDGET_MS: {{ .Values.rag.regenLoopMinBudgetMs | quote }}
  {{- end }}
  {{- if hasKey .Values.rag "generateHollowMinSections" }}
  DOCBRAIN_GENERATE_HOLLOW_MIN_SECTIONS: {{ .Values.rag.generateHollowMinSections | quote }}
  {{- end }}
  {{- if hasKey .Values.rag "generateHollowRatioPct" }}
  DOCBRAIN_GENERATE_HOLLOW_RATIO_PCT: {{ .Values.rag.generateHollowRatioPct | quote }}
  {{- end }}
  {{- /* Support critic (grounding). enabled uses hasKey so an explicit `false`
       is honored (a bare `if` would drop it). */}}
  {{- if hasKey .Values.rag "supportCriticEnabled" }}
  DOCBRAIN_SUPPORT_CRITIC_ENABLED: {{ .Values.rag.supportCriticEnabled | quote }}
  {{- end }}
  {{- if .Values.rag.supportCriticMaxClaims }}
  DOCBRAIN_SUPPORT_CRITIC_MAX_CLAIMS: {{ .Values.rag.supportCriticMaxClaims | quote }}
  {{- end }}
  IMAGE_TIMEOUT_SECS: {{ .Values.imageExtraction.timeoutSecs | default 30 | quote }}
  IMAGE_LLM_TIMEOUT_SECS: {{ .Values.imageExtraction.llmTimeoutSecs | default 120 | quote }}
  IMAGE_MAX_PER_PAGE: {{ .Values.imageExtraction.maxPerPage | default 20 | quote }}
  IMAGE_MIN_SIZE_BYTES: {{ .Values.imageExtraction.minSizeBytes | default 5120 | quote }}
  IMAGE_MAX_SIZE_BYTES: {{ .Values.imageExtraction.maxSizeBytes | default 10485760 | quote }}
  LOGIN_SESSION_TTL_HOURS: {{ .Values.auth.sessionTtlHours | default 720 | quote }}
  # Idle timeout: API keys whose last_used_at is older than this are rejected.
  # 0 = disabled (default). Recommended 24 for production deployments.
  IDLE_TIMEOUT_HOURS: {{ .Values.auth.idleTimeoutHours | default 0 | quote }}
  # Per-IP cap on public auth attempts (Auth#4/#16). Higher than per-email
  # because corporate NATs share IPs.
  IP_LOGIN_MAX_FAILURES: {{ .Values.auth.ipLoginMaxFailures | default 100 | quote }}
  IP_LOGIN_LOCKOUT_WINDOW_SECS: {{ .Values.auth.ipLoginLockoutWindowSecs | default 600 | quote }}
  # Trusted-proxy-hops for IP attribution. MUST be set to the number of
  # proxies/load-balancers in front of DocBrain or the per-IP rate limit will
  # key on the proxy's IP and lock out everyone behind it. Set to 1 for a
  # single nginx/ALB hop, 2 for nginx+CDN, etc. Leave at 0 only when running
  # without any reverse proxy.
  TRUSTED_PROXY_HOPS: {{ .Values.auth.trustedProxyHops | default 0 | quote }}
  {{- if .Values.auth.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ .Values.auth.corsAllowedOrigins | quote }}
  {{- end }}
  DOCBRAIN_SELF_INGEST: {{ .Values.selfIngest.enabled | default true | quote }}
  DOCBRAIN_DOCS_PATH: {{ .Values.selfIngest.docsPath | default "/app/docs" | quote }}
  # Learning pipeline — server-side config
  {{- if .Values.learning.enabled }}
  LEARNING_ENABLED: "true"
  LEARNING_TRAINER_URL: {{ .Values.learning.training.trainerUrl | quote }}
  LEARNING_BASE_MODEL_ID: {{ .Values.learning.training.baseModelId | default "sentence-transformers/all-MiniLM-L6-v2" | quote }}
  LEARNING_STORAGE_BACKEND: {{ .Values.learning.storage.backend | quote }}
  LEARNING_MIN_TRIPLETS: {{ .Values.learning.training.minTriplets | quote }}
  LEARNING_CIRCUIT_BREAKER_THRESHOLD: {{ .Values.learning.safety.circuitBreakerThreshold | quote }}
  LEARNING_MAX_SINGLE_USER_FRACTION: {{ .Values.learning.safety.maxSingleUserFraction | quote }}
  LEARNING_POISON_DETECTION: {{ .Values.learning.safety.poisonDetectionEnabled | quote }}
  {{- if eq .Values.learning.storage.backend "local" }}
  # WARNING: LEARNING_LOCAL_PATH and TRAINER_LOCAL_MODEL_ROOT must point to the
  # same shared volume. For Kubernetes, use S3/GCS/Azure instead of "local".
  LEARNING_LOCAL_PATH: {{ .Values.learning.storage.localModelRoot | quote }}
  {{- end }}
  {{- if eq .Values.learning.storage.backend "s3" }}
  LEARNING_S3_BUCKET: {{ .Values.learning.storage.s3Bucket | quote }}
  LEARNING_S3_PREFIX: {{ .Values.learning.storage.s3Prefix | quote }}
  LEARNING_S3_REGION: {{ .Values.learning.storage.s3Region | quote }}
  {{- end }}
  {{- if eq .Values.learning.storage.backend "gcs" }}
  LEARNING_GCS_BUCKET: {{ .Values.learning.storage.gcsBucket | quote }}
  LEARNING_GCS_PREFIX: {{ .Values.learning.storage.gcsPrefix | quote }}
  {{- end }}
  {{- if eq .Values.learning.storage.backend "azure" }}
  LEARNING_AZURE_CONTAINER: {{ .Values.learning.storage.azureContainer | quote }}
  {{- end }}
  {{- else }}
  LEARNING_ENABLED: "false"
  {{- end }}
  # MCP tool platform — answer-time external tool dispatch.
  {{- if .Values.mcpTools.enabled }}
  MCP_TOOLS_ENABLED: "true"
  MCP_MANIFEST_DIR: "/etc/docbrain/mcp-manifests"
  # Plan A — signed remote registry: non-sensitive endpoints + cache path.
  # MCP_REGISTRY_PUBKEY lives in the Secret alongside MCP_OAUTH_ENCRYPTION_KEY.
  # When mcpTools.registry.pubkey is empty the three /admin/mcp/registry*
  # endpoints return 503; the server boots normally either way.
  MCP_REGISTRY_URL: {{ .Values.mcpTools.registry.url | default "https://registry.docbrain-ai.com/v1/index.json" | quote }}
  MCP_REGISTRY_CACHE_PATH: {{ .Values.mcpTools.registry.cachePath | default "/var/lib/docbrain/registry-cache/index.json" | quote }}
  # Plan A — kubectl-render hints for /admin/mcp/secrets/audit/{id}. Optional;
  # the audit endpoint embeds <set DOCBRAIN_K8S_*> placeholders when unset.
  DOCBRAIN_K8S_SECRET_NAME: {{ .Values.mcpTools.k8s.secretName | default "" | quote }}
  DOCBRAIN_K8S_NAMESPACE: {{ .Values.mcpTools.k8s.namespace | default "" | quote }}
  # OAuth callback + web-UI redirect base. Atlassian (and any IdP) sends the
  # user's browser back to {publicBaseUrl}/api/v1/oauth/mcp/callback/<manifest>;
  # the callback handler then redirects to {webBaseUrl}/integrations?connected=<id>.
  # MUST be set when MCP OAuth is in use behind an ingress — defaults to
  # localhost otherwise, which makes Atlassian-redirect callbacks unreachable.
  {{- if .Values.server.publicBaseUrl }}
  DOCBRAIN_PUBLIC_BASE_URL: {{ .Values.server.publicBaseUrl | quote }}
  {{- end }}
  {{- if .Values.server.webBaseUrl }}
  DOCBRAIN_WEB_BASE_URL: {{ .Values.server.webBaseUrl | quote }}
  {{- end }}
  DOCBRAIN_SERVER_PORT: {{ .Values.server.port | quote }}
  {{- else }}
  MCP_TOOLS_ENABLED: "false"
  {{- end }}
  # MCP tool-result redactor policy. Controls how DocBrain handles
  # privacy-classified content returned by MCP tools (today: Slack DMs).
  # Defaults to `strict` — DM-bearing entries are stripped from tool
  # results before they reach the synthesis prompt, episode cache, or
  # memory consolidation. See docs/security/slack-dm-policy.md for the
  # threat model. Operators who fork the Slack manifest to re-add the
  # `search:read.im` / `search:read.mpim` OAuth scopes AND want DM
  # content materialised into the DocBrain corpus must flip this to
  # `allow` explicitly. `warn` logs but does not redact (staging /
  # debugging use only — production deployments should not run with
  # `warn`).
  DOCBRAIN_DM_PERSIST_POLICY: {{ .Values.mcpTools.dmPersistPolicy | default "strict" | quote }}
  # DOCBRAIN_DM_REDACTOR_DEBUG_PROBE — diagnostic-only. When `true`,
  # the redactor logs a WARN per slack-manifest dispatch dumping the
  # first ~500 chars of the parsed JSON shape and the post-walker
  # redaction report. DM content can land in logs when this is on.
  # Default `false`. Turn on transiently to diagnose detection misses
  # against a new or changed upstream MCP envelope shape, then turn
  # back off.
  DOCBRAIN_DM_REDACTOR_DEBUG_PROBE: {{ .Values.mcpTools.dmRedactorDebugProbe | default false | quote }}
  # DOCBRAIN_OAUTH_EXCHANGE_DEBUG_PROBE — diagnostic-only. When `true`,
  # OAuth token-exchange decode failures emit a WARN with the first
  # ~800 chars of the upstream IdP's raw response body. Used to diagnose
  # response-shape mismatches when adding a new OAuth manifest. The
  # probe can leak partial credentials in error-response shapes; turn
  # on transiently, capture the IdP response, then turn off. Default
  # `false`.
  DOCBRAIN_OAUTH_EXCHANGE_DEBUG_PROBE: {{ .Values.mcpTools.oauthExchangeDebugProbe | default false | quote }}
  {{- range $key, $val := .Values.server.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
