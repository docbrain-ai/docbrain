apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "docbrain.fullname" . }}-ingest
  labels:
    {{- include "docbrain.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  schedule: {{ .Values.ingest.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Issue #7 (jobs): Automatically delete completed jobs after 1 hour so they don't
      # accumulate and fill up the namespace. Requires Kubernetes 1.21+ (TTLAfterFinished GA).
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "docbrain.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: ingest
          annotations:
            # Issue #10: Restart pods when config changes
            {{- include "docbrain.configChecksum" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          # Issue #9: Wait for dependencies before running ingest
          initContainers:
            {{- if .Values.postgresql.internal }}
            - name: wait-for-postgres
              image: busybox
              command:
                - sh
                - -c
                - |
                  until nc -z {{ include "docbrain.fullname" . }}-postgres 5432; do
                    echo "waiting for postgres..."; sleep 2;
                  done
            {{- end }}
            {{- if .Values.opensearch.internal }}
            - name: wait-for-opensearch
              image: busybox
              command:
                - sh
                - -c
                - |
                  until nc -z {{ include "docbrain.fullname" . }}-opensearch 9200; do
                    echo "waiting for opensearch..."; sleep 2;
                  done
            {{- end }}
          containers:
            - name: ingest
              image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
              imagePullPolicy: {{ .Values.server.image.pullPolicy }}
              # Issue #8: exec-form command — the container process IS docbrain-ingest.
              # A shell wrapper would mask non-zero exit codes from Kubernetes restart logic.
              command: ["docbrain-ingest"]
              envFrom:
                - configMapRef:
                    name: {{ include "docbrain.fullname" . }}-config
                - secretRef:
                    name: {{ include "docbrain.secretName" . }}
              env:
                - name: DATABASE_URL
                  value: {{ include "docbrain.databaseUrl" . | quote }}
              {{- if and (contains "local" .Values.ingest.sources) .Values.ingest.localDocsPath }}
              volumeMounts:
                - name: docs
                  mountPath: {{ .Values.ingest.localDocsPath }}
                  readOnly: true
              {{- end }}
          {{- if and (contains "local" .Values.ingest.sources) .Values.ingest.localDocsPath }}
          volumes:
            - name: docs
              persistentVolumeClaim:
                claimName: {{ include "docbrain.fullname" . }}-docs
          {{- end }}
