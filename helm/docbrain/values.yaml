# DocBrain Helm Chart Values

# -- LLM provider: bedrock | anthropic | openai | ollama
llm:
  provider: anthropic
  modelId: claude-sonnet-4-5-20250929
  # anthropicApiKey: ""   # set via --set or secret
  # openaiApiKey: ""
  # ollamaBaseUrl: "http://ollama:11434"

# -- Embedding provider: bedrock | openai | ollama
embedding:
  provider: openai
  modelId: text-embedding-3-small
  # openaiApiKey: ""     # defaults to llm.openaiApiKey if not set

# -- Ingestion source: confluence | local | github
ingest:
  sources: local  # comma-separated: local, confluence, github, github_pr, slack_thread, jira, etc.
  schedule: "0 */6 * * *"   # every 6 hours
  localDocsPath: /data/docs
  # confluence:
  #   baseUrl: ""
  #   email: ""
  #   apiToken: ""
  #   spaceKeys: ""
  #   apiVersion: v2          # v2 for Cloud (default), v1 for self-hosted Data Center
  #   pageIds: ""             # comma-separated page IDs (+ all descendants); from any space
  # github:
  #   repoUrl: ""
  #   token: ""
  #   branch: main

# -- DocBrain API Server
server:
  image:
    repository: ghcr.io/docbrain/docbrain
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # CORS origins (comma-separated). Required for browser clients.
  # Example: corsAllowedOrigins: "https://docbrain.mycompany.com"
  corsAllowedOrigins: ""
  # Session lifetime for web logins (hours). Default: 720 (30 days)
  loginSessionTtlHours: "720"
  # Additional arbitrary env vars passed through to the server ConfigMap
  env: {}

# -- DocBrain Web UI
web:
  enabled: true
  image:
    repository: ghcr.io/docbrain/docbrain-web
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- PostgreSQL
postgresql:
  internal: true
  image: postgres:17-alpine
  storage: 10Gi
  # password: ""          # auto-generated if not set; stored in the Secret
  # externalUrl: ""       # if internal=false

# -- OpenSearch
opensearch:
  internal: true
  image: opensearchproject/opensearch:2.19.0
  storage: 20Gi
  # externalUrl: ""

# -- Redis
redis:
  internal: true
  image: redis:7-alpine
  storage: 1Gi
  # externalUrl: ""

# -- Documentation Autopilot (AI-driven gap analysis + draft generation)
autopilot:
  enabled: false
  gapAnalysisIntervalHours: "24"

# -- Freshness scoring scheduler
freshness:
  schedulerIntervalHours: "24"

# -- Memory consolidation
memory:
  consolidationIntervalHours: "6"

# ── SSO / OAuth providers ────────────────────────────────────────────────
# See docs/rbac.md for full setup guide.

# -- GitHub OAuth login (docbrain login --github)
# Create an OAuth App at https://github.com/settings/developers
# Callback URL: https://<your-domain>/api/v1/auth/github/callback
githubOAuth:
  enabled: false
  # clientId: ""        # set via --set githubOAuth.clientId=... or existingSecret
  # clientSecret: ""    # stored in the Helm Secret
  # redirectUri: ""     # must match the callback URL registered in GitHub

# -- GitLab OIDC login (docbrain login --gitlab)
# Enable OIDC in your GitLab application:
#   Admin → Applications → Add → enable openid, profile, email, groups scopes
# Callback URL: https://<your-domain>/api/v1/auth/gitlab/callback
gitlabOAuth:
  enabled: false
  # instanceUrl: "https://gitlab.com"   # or your self-hosted URL
  # clientId: ""
  # clientSecret: ""    # stored in the Helm Secret
  # redirectUri: ""

# -- Generic OIDC login (docbrain login --oidc)
# Works with Azure AD, Okta, Google Workspace, Keycloak, etc.
# Callback URL: https://<your-domain>/api/v1/auth/oidc/callback
oidc:
  enabled: false
  # issuerUrl: ""       # e.g. https://login.microsoftonline.com/<tenant>/v2.0
  # clientId: ""
  # clientSecret: ""    # stored in the Helm Secret
  # redirectUri: ""
  # webUiUrl: ""        # your DocBrain web UI URL (redirect destination after login)

# -- RBAC / SSO access control
# Controls who is allowed to log in and what role they receive.
# If allowedGroups and allowedDomains are both empty, all authenticated users are permitted.
# See docs/rbac.md for full details.
rbac:
  # Default role for new SSO users: viewer (default) | editor | admin
  defaultRole: "viewer"
  # Email domain that always gets admin role (e.g. "acme.com")
  adminDomain: ""
  # Comma-separated emails that always get admin role
  adminEmails: ""
  # Comma-separated IdP group / GitHub org names that map to admin role
  adminGroups: ""
  # Comma-separated IdP group / GitHub org names that map to editor role
  editorGroups: ""
  # ACCESS GATE — only members of these groups may log in at all.
  # Comma-separated IdP group names (OIDC/GitLab) or GitHub org names.
  # Leave empty to allow all authenticated users (default, backward-compatible).
  # Example: "platform-team,sre-team"
  allowedGroups: ""
  # ACCESS GATE — only users with these email domains may log in.
  # Comma-separated. Leave empty to allow all email domains (default).
  # Example: "acme.com,acme.org"
  allowedDomains: ""

# -- Ingress
ingress:
  enabled: false
  className: nginx
  host: docbrain.local
  tls: false
  # tlsSecretName: docbrain-tls

# -- Secret (created from values, or use existing)
# If existingSecret is set, the chart will NOT create a Secret and will use this one instead.
# The existing secret must contain all required keys (POSTGRES_PASSWORD, BOOTSTRAP_ADMIN_KEY, etc.)
existingSecret: ""
