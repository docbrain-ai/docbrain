# DocBrain Helm Chart Values

# -- LLM provider: bedrock | anthropic | openai | ollama | groq | openrouter | together | deepseek | mistral | xai | gemini | azure_openai | cohere
llm:
  provider: anthropic
  modelId: claude-sonnet-4-5-20250929
  # fastModelId: ""        # fast/cheap model for side-calls (intent classify, query rewrite, entity extraction)
  #                        # Bedrock: us.anthropic.claude-haiku-4-5-20251001-v1:0
  #                        # Anthropic: claude-haiku-4-5-20251001
  #                        # OpenAI: gpt-4o-mini  |  Groq: llama-3.1-8b-instant
  #                        # DeepSeek: deepseek-chat  |  Mistral: mistral-small-latest
  #                        # Falls back to modelId if not set
  # ingestModelId: ""      # model used ONLY during ingest for image extraction
  #                        # IMPORTANT: set this to a cheaper model when using Opus 4 + thinkingBudget
  #                        # otherwise image extraction will trigger throttling errors on every page
  #                        # Falls back to modelId if not set
  # thinkingBudget: 0      # extended thinking token budget (Anthropic/Bedrock only, 0 = disabled)
  #                        # does NOT apply to fastModelId or ingestModelId
  #                        # NOTE: ignored by NEWER Bedrock Claude (Opus 4.7+/4.8) — those use
  #                        # adaptive thinking; tune `effort` below instead. Still applies to
  #                        # older models (Sonnet/Haiku) that use the classic budget.
  # effort: high           # reasoning effort for NEWER Bedrock Claude (Opus 4.7+/4.8) on the
  #                        # draft/critic/answer paths: low|medium|high|xhigh|max (default high).
  #                        # Higher = deeper reasoning but more latency+cost. 'high' is the
  #                        # product default — for grounded docs, source coverage (not raw
  #                        # reasoning depth) is the quality ceiling. (DOCBRAIN_LLM_EFFORT)
  #                        # No effect on classic-thinking models (Sonnet/Haiku).
  # draftModelId: ""       # model for autopilot draft generation (two-phase reasoning + writing)
  #                        # Falls back to modelId if not set. Use a high-capability model here.
  # draftProvider: ""      # provider for draft generation. Falls back to llm.provider if not set.
  #                        # Allows cross-provider drafting (e.g. Gemini for Q&A, Anthropic for drafts)

  # -- Anthropic (provider: anthropic)
  # anthropicApiKey: ""    # set via --set or secret; ANTHROPIC_API_KEY

  # -- OpenAI and OpenAI-compatible (provider: openai)
  # openaiApiKey: ""       # OPENAI_API_KEY
  # openaiBaseUrl: ""      # override for OpenAI-compatible endpoints (e.g. LiteLLM proxy)

  # -- Groq — fast inference (provider: groq, default model: llama-3.3-70b-versatile)
  # groqApiKey: ""         # GROQ_API_KEY

  # -- OpenRouter — unified API across providers (provider: openrouter, default model: openai/gpt-4o)
  # openrouterApiKey: ""   # OPENROUTER_API_KEY

  # -- Together AI — open model hosting (provider: together, default: meta-llama/Llama-3.3-70B-Instruct-Turbo)
  # togetherApiKey: ""     # TOGETHER_API_KEY

  # -- DeepSeek (provider: deepseek, default model: deepseek-chat)
  # deepseekApiKey: ""     # DEEPSEEK_API_KEY

  # -- Mistral (provider: mistral, default model: mistral-small-latest)
  # mistralApiKey: ""      # MISTRAL_API_KEY

  # -- xAI / Grok (provider: xai, default model: grok-3)
  # xaiApiKey: ""          # XAI_API_KEY

  # -- Google Gemini (provider: gemini, default model: gemini-2.5-flash)
  # geminiApiKey: ""       # GEMINI_API_KEY

  # -- Azure OpenAI (provider: azure_openai, modelId = deployment name e.g. "gpt-4o")
  # azureOpenaiApiKey: ""     # AZURE_OPENAI_API_KEY
  # azureOpenaiEndpoint: ""   # AZURE_OPENAI_ENDPOINT e.g. https://my-resource.openai.azure.com
  # azureOpenaiApiVersion: "" # AZURE_OPENAI_API_VERSION default: 2024-02-01

  # -- Cohere (provider: cohere, default model: command-r-plus)
  # cohereApiKey: ""       # COHERE_API_KEY

  # -- Vertex AI — GCP-hosted models (provider: vertex_ai, default model: google/gemini-2.5-flash-001)
  # vertexProject: ""     # VERTEX_PROJECT — GCP project ID (required)
  # vertexRegion: ""      # VERTEX_REGION — GCP region (default: us-central1)
  # Auth: set GOOGLE_APPLICATION_CREDENTIALS in server.env or use Workload Identity
  # Example models: google/gemini-2.5-flash-001, meta/llama-3.3-70b-instruct-maas

  # -- Ollama — local models (provider: ollama, default model: llama3.1)
  # ollamaBaseUrl: "http://ollama:11434"
  # ollamaTimeoutSecs: 300  # HTTP timeout (seconds); increase for large models (e.g. 70B). Default 120.

# -- Embedding provider: bedrock | openai | ollama
embedding:
  provider: openai
  modelId: text-embedding-3-small
  # openaiApiKey: ""     # defaults to llm.openaiApiKey if not set

# -- Ingestion source: confluence | local | github
ingest:
  sources: local  # comma-separated: local, confluence, github, github_pr, slack_thread, jira, etc.
  schedule: "0 */6 * * *"   # every 6 hours
  localDocsPath: /data/docs
  # confluence:
  #   baseUrl: ""
  #   email: ""
  #   apiToken: ""
  #   spaceKeys: ""
  #   apiVersion: v2          # v2 for Cloud (default), v1 for self-hosted Data Center
  #   pageIds: ""             # comma-separated page IDs (+ all descendants); from any space
  # github:
  #   repoUrl: ""
  #   token: ""
  #   branch: main

# -- GitLab MR real-time capture webhook
# Enables POST /api/v1/gitlab/events for `@docbrain capture` on merge requests.
# See docs/gitlab-capture.md for GitLab-side webhook setup instructions.
gitlabCapture:
  enabled: false
  # webhookSecret: ""    # REQUIRED: X-Gitlab-Token secret configured in GitLab — stored in Secret
  #                      # Generate with: openssl rand -hex 32
  # token: ""            # REQUIRED: GitLab PAT with api scope (fetch MR notes + post replies) — stored in Secret
  # baseUrl: ""          # GITLAB_CAPTURE_BASE_URL — default: https://gitlab.com; override for self-hosted
  # tlsInsecure: false   # GITLAB_CAPTURE_TLS_INSECURE — set true for self-hosted GitLab with self-signed certs
  # allowedUsers: ""     # GITLAB_CAPTURE_ALLOWED_USERS — comma-separated usernames; empty = all
  # allowedProjects: ""  # GITLAB_CAPTURE_ALLOWED_PROJECTS — comma-separated group/project paths; empty = all

# -- Confluence real-time webhook sync
# Enables POST /confluence/events for instant page indexing on create/update/delete.
# See docs/confluence-webhook.md for Confluence-side setup instructions.
confluenceWebhook:
  enabled: false
  # webhookSecret: ""   # REQUIRED: shared secret configured in Confluence — stored in Secret
                        # Generate with: openssl rand -hex 32
  # baseUrl: ""         # CONFLUENCE_BASE_URL — required if ingest.confluence is not configured
  # email: ""           # CONFLUENCE_USER_EMAIL (Cloud only; not needed for Data Center)
  # apiToken: ""        # CONFLUENCE_API_TOKEN — stored in Secret; required if ingest.confluence not set
  # apiVersion: v2      # v2 for Confluence Cloud (default), v1 for self-hosted Data Center

# -- DocBrain API Server
server:
  image:
    repository: ghcr.io/docbrain-ai/docbrain
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # env is a catch-all map: every key/value flows through to the
  # server container as an environment variable via the helm
  # configmap (templates/configmap.yaml:277).
  #
  # #86 Confidence-retry fallback. Default OFF. When enabled, /ask
  # responses with very-low confidence AND unused tools in the
  # catalog re-run once with the picker in widen-mode. Doubles
  # worst-case latency on misses. To enable, uncomment:
  #   env:
  #     RAG_CONFIDENCE_RETRY_ENABLED: "true"
  #     RAG_CONFIDENCE_RETRY_THRESHOLD: "0.25"           # 0.0–1.0
  #     RAG_CONFIDENCE_RETRY_LATENCY_BUDGET_MS: "12000"  # 1000–60000
  #
  # Agentic tool loop. Default OFF. Generalizes the confidence-retry
  # into a bounded MULTI-round tool loop with per-surface round and
  # wall-clock budgets. When RAG_AGENTIC_LOOP_ENABLED is "true" the
  # loop SUBSUMES the confidence-retry above (loop runs instead of the
  # single retry). To enable, uncomment:
  #   env:
  #     RAG_AGENTIC_LOOP_ENABLED: "true"
  #     RAG_AGENTIC_LOOP_MAX_ROUNDS_SLACK: "5"            # 1–10
  #     RAG_AGENTIC_LOOP_MAX_ROUNDS_WEB: "4"              # 1–10
  #     RAG_AGENTIC_LOOP_BUDGET_MS_SLACK: "60000"         # 1000–120000
  #     RAG_AGENTIC_LOOP_BUDGET_MS_WEB: "30000"           # 1000–120000
  #     RAG_AGENTIC_LOOP_CONFIDENCE_THRESHOLD: "0.7"      # 0.0–1.0; unset →
  #                                                       # falls back to
  #                                                       # RAG_CONFIDENCE_RETRY_THRESHOLD
  #
  #
  # Prompt budgets. Both are BYTE ceilings on prompt sections, while the
  # real limit is your model's TOKEN window — a provider truncates an
  # over-long prompt silently rather than erroring, so an unbudgeted
  # section is fetched and then lost with no trace.
  #
  # RAG_LIVE_DATA_BUDGET_BYTES is an AGGREGATE bound: every tool block is
  # concatenated into one prompt, and while each tool's own output is
  # capped separately (DOCBRAIN_MCP_DEFAULT_TOOL_OUTPUT_CAP_BYTES), the
  # sum of several is otherwise unbounded. Measured 2026-09-04, a single
  # tool returning 103,479 bytes reached the prompt as 8,475.
  # To change, uncomment:
  #   env:
  #     RAG_CONTEXT_WINDOW_BUDGET_BYTES: "65536"   # expanded document context
  #     RAG_LIVE_DATA_BUDGET_BYTES: "32768"        # all tool blocks combined
  # Subscription certificate. Default unset (Community tier). Points at a
  # certificate file mounted from a Helm-managed Secret — GitOps-friendly,
  # since the path itself is safe to commit even though the file's contents
  # are not. Takes precedence over any certificate uploaded through the
  # admin UI. To enable, uncomment (and mount the Secret at this path):
  #   env:
  #     DOCBRAIN_LICENSE_FILE: "/etc/docbrain/license.jws"
  env: {}

# -- DocBrain Web UI
# First-boot admin key, rendered into a dedicated Secret by
# templates/initial-admin-secret.yaml. That template was referencing
# `.Values.bootstrapKey.enabled` while this file defined no `bootstrapKey`
# block, so `helm lint` and `helm install` failed on the default values with
# `nil pointer evaluating interface {}.enabled`.
#
# `true` matches the template's documented lifecycle (a key is generated on
# install and preserved across upgrades) and docs/kubernetes.md, which presents
# `bootstrapKey.enabled=false` as the opt-OUT used to delete the Secret and
# have the server revoke the key.
bootstrapKey:
  enabled: true

# Kubernetes ServiceAccount for the server and ingest pods.
#
# Four templates reference this block (server/web deployments, the ingest
# CronJob, and the serviceAccountName helper), but it was absent from this
# file, so `helm lint` and `helm install` failed on the default values with
# `nil pointer evaluating interface {}.create`.
#
# `create: false` is the conservative default and matches the documented
# opt-in flow: set `create: true` plus an IRSA role annotation when the pod
# needs a cloud identity (e.g. Bedrock `bedrock:InvokeModel`). With `false`
# the pods use the namespace's `default` ServiceAccount, which is the
# effective behaviour for every chart consumer who supplied their own values.
serviceAccount:
  create: false
  # Leave empty to derive the name from the release; only used when create=true.
  name: ""
  annotations: {}

web:
  enabled: true
  image:
    repository: ghcr.io/docbrain-ai/docbrain-web
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # The frontend resolves the backend URL via window.location.origin (same-origin).
  # The ingress above routes /api/* to the backend — no extra config needed.
  # NEXT_PUBLIC_* env vars are baked at build time and cannot be overridden at runtime.

# -- PostgreSQL
postgresql:
  internal: true
  image: postgres:17-alpine
  storage: 10Gi
  # externalUrl: ""    # if internal=false

# -- Redis
redis:
  internal: true
  image: redis:7-alpine
  storage: 1Gi
  # externalUrl: ""

# -- Ingress
ingress:
  enabled: false
  className: nginx
  host: docbrain.local
  tls: false
  # tlsSecretName: docbrain-tls
  # annotations: {}    # extra annotations merged into both Ingress objects
  # -- Proxy read timeout (seconds) for the API ingress. The generate path runs
  # gather → (live-tool dispatch) → reasoning → writing → freshness critic, which
  # takes minutes for a tool-heavy / broad multi-source ask; 120 was too tight
  # (the slowest enriched generations 502'd). Drives the nginx proxy-read-timeout;
  # set the ALB idle_timeout to the SAME value via `annotations` so the lower of
  # the two can't silently win, e.g.:
  #   annotations:
  #     alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
  # Raise to 900+ when live tools / agentic generation are enabled (more round-trips).
  # 2026-06-23: raised 600→900 because the `--target` AUGMENT path (enrich-aware merge,
  # commit 7cb26d2) does agentic gather + per-section enrich + merge LLM, which exceeds
  # 600s for a multi-section doc → the ingress killed the request and nothing persisted.
  # NOTE (follow-up): the deeper fix is to stop the redundant SECOND agentic gather on
  # the merge path (the draft already exists) — this 900 is the unblock, not the root fix.
  proxyReadTimeout: 900

# -- Documentation Autopilot (AI-driven gap analysis + draft generation)
# Enabled by default. Set enabled: false to opt out.
autopilot:
  enabled: true
  lookbackDays: 30
  maxClusters: 50
  maxEpisodes: 500
  gapAnalysisIntervalHours: 6
  # Auto-draft: automatically generate drafts for qualifying gaps (no human trigger)
  # Manual by default. Set autoDraft: true to enable.
  autoDraft: false
  # Minimum gap severity for auto-drafting: critical | high | medium | low
  autoDraftSeverity: critical
  # Severity scoring scale factors — tune for your org's signal volume.
  # criticalUsers: how many unique users needed for breadth score to reach 1.0 (default: 5)
  # criticalSignals: how many negative signals needed for volume score to reach 1.0 (default: 15)
  # Composite score thresholds — gaps scoring above these values get assigned that severity.
  criticalUsers: 5
  criticalSignals: 15
  thresholdCritical: 0.75
  thresholdHigh: 0.55
  thresholdMedium: 0.35

  # Forecast Trend v2 — five-state honest reporting (improving / stable /
  # worsening / insufficient_signal / no_gaps_open). See
  # docs/configuration.md § "Forecast Trend methodology".
  trendV2Enabled: true              # Switch to v2 (recommended). v1 reported definitive verdicts on thin data.
  trendMinEvents: 5                 # Minimum gap events (new + resolved) across the 4-week window before a verdict is reported.
  trendImprovingThreshold: 0.75     # ratio (resolved/new) ≥ this → "improving"
  trendWorseningThreshold: 0.40     # ratio < this → "worsening"; between thresholds → "stable"

  # Staleness warn window (days) for a generation's grounding sources. Older
  # DocBrain-ingest date -> STALE in the trust headline; within -> FRESH; unknown
  # date -> UNKNOWN (distinct from fresh). Env: DOCBRAIN_GENERATE_SOURCE_STALENESS_WARN_DAYS.
  sourceStalenessWarnDays: 365

  # Retrieval-parity: max per-section /ask retrievals a single `generate` run fires.
  # The doc is decomposed into sections and the /ask engine is driven once per section
  # to gather grounded, high-tier, on-topic content; sections past the cap are reported
  # not-asked. Clamped 0..=24; 0 disables the section-ask strategy (legacy gather only).
  # Env: DOCBRAIN_GENERATE_MAX_SECTION_ASKS.
  maxSectionAsks: 8

# -- Draft Publishing — closes the feedback loop by publishing AI drafts to Confluence
# When configured, the Publish button (and auto-draft if enabled) will create Confluence pages
# and mark the originating gap cluster as resolved.
draftPublish:
  # Target system: "confluence" | "none"
  target: none
  # Confluence space key to create pages in (e.g. "ENG", "DOCS")
  # confluenceSpaceKey: ""
  # Optional parent page ID — new pages become children of this page
  # confluenceParentPageId: ""
  # Re-ingest the published page on next ingest cycle so DocBrain learns from it immediately
  autoIngestAfterPublish: true

# -- Freshness scoring scheduler
freshness:
  schedulerIntervalHours: 24
  # Max docs to run contradiction LLM checks per freshness pass. Higher = more cost/latency.
  contradictionChecksPerPass: 10
  # Include recent event-based docs (Slack, PRs, Jira) in contradiction pass alongside stalest docs.
  contradictionIncludeRecentEventDocs: true
  # Only event-based docs edited within this many days are eligible for contradiction checks.
  contradictionEventDocMaxAgeDays: 90
  # Engagement signal v2 — Wilson-score lower bound on distinct-user-gated,
  # recency-windowed feedback. When `engagementV2Enabled: true`, the
  # per-doc engagement score requires:
  #   • engagementMinRetrievers distinct users to have retrieved the doc
  #     (default 3) within engagementWindowDays (default 180),
  #   • engagementMinVoters distinct users to have given thumbs-up/down
  #     feedback (default 3), and
  #   • each user counts as at most one vote per doc (anti-brigade).
  # Score is the Wilson lower bound at 95% confidence on the up-vote ratio
  # across distinct users. Health becomes bidirectional — when activity
  # stops, votes fall out of the window and the doc returns to
  # "Insufficient signals".
  # When `false` (default), the legacy v1 engagement path runs verbatim
  # — operators can flip back on any deployment without code changes.
  engagementV2Enabled: false
  engagementMinRetrievers: 3
  engagementMinVoters: 3
  engagementWindowDays: 180

# -- Learning Velocity — org-level documentation health metrics
# Tracks gap resolution rate, knowledge half-life, tribal knowledge %, and ROI.
# Snapshots are taken daily during memory consolidation.
velocity:
  # v1 inputs (still applied when roiV2Enabled=false)
  minutesSavedPerQuery: 15   # Estimated engineer time saved per answered query (minutes)
  hourlyRate: 75             # Hourly engineer cost (USD) for ROI calculation

  # v2 inputs — defensible methodology for executive reporting.
  # See docs/configuration.md § "Documentation ROI methodology".
  roiV2Enabled: true         # Switch to v2 formula (distinct-user gated, admin-excluded, vote-capped, range)
  roiMinutesSavedLow: 5      # Low end of per-query time-saved range (minutes)
  roiMinutesSavedHigh: 25    # High end of per-query time-saved range (minutes)
  roiMinDistinctUsers: 3     # Minimum distinct non-admin users with positive feedback before ROI is reported (otherwise "Insufficient signal")
  roiExcludeAdmin: true      # Exclude admin votes from ROI math (recommended — operators inflate their own number)
  roiMaxVotesPerUser: 10     # Per-user vote cap inside the window (prevents one power-user from dominating the org-wide number)

  # Tribal Knowledge v2 — same defensive methodology applied to the
  # tribal-knowledge percentage. See docs/configuration.md §
  # "Tribal Knowledge methodology".
  tribalV2Enabled: true              # Switch to v2 formula (domain_team_scores substrate, configurable threshold, insufficient-signal gate)
  tribalMaxExpertsPerDomain: 2       # Domains with ≤ this many distinct experts are "tribal" (default 2; raise for larger orgs)
  tribalMinDomainsWithSignal: 3      # Minimum distinct domains with positive feedback before the percentage is reported
  maintenanceTrendMinSnapshots: 4    # Minimum snapshots with flow signal before Maintenance Trend reports a verdict

  # Net knowledge velocity — bulk re-ingest exclusion. A re-ingest sweep
  # (e.g. 60k docs touched in one day) must not inflate the velocity
  # headline or flip the trend to "accelerating".
  bulkUpdateMultiple: 10.0           # A week's updates above this multiple of the rolling norm are treated as a bulk sweep and capped (order-of-magnitude jump = sweep signature)
  substantiveUpdateCeiling: 2000     # Absolute ceiling on a single week's substantive updates, guarding the all-bulk-history case where the rolling median is itself inflated

# -- Knowledge Stream — proactive push intelligence
# Detects and pushes: incident warnings, knowledge decay risks,
# expertise gaps, and context-aware doc updates.
stream:
  enabled: false               # Opt-in; set true to enable proactive alerting
  intervalMinutes: 30          # How often to scan for events (minutes)
  incidentWarningMinUsers: 2   # Min unique users in 2h window to trigger incident warning
  # alertChannel: ""           # Slack channel for critical alerts (optional)
  expertiseGapDays: 90         # Days without expert activity before gap alert

# -- Memory consolidation scheduler
consolidation:
  intervalHours: 6

# -- RAG (Retrieval-Augmented Generation) cache
rag:
  # -- Verify mechanically-checkable claims (file paths) in an answer against the
  # file listings recorded at ingest, before returning it. Deterministic — no LLM
  # call. Inert until a source records a listing, so enabling it costs nothing on
  # a deployment with no git sources connected.
  claimVerification: true
  cacheTtlHours: 24
  cacheThreshold: "0.95"
  # -- Tool-output caps (the truncation chain). All THREE must rise together —
  # raising one alone has no effect because the smallest still truncates. The
  # two outputCap values also gate the manifest validator (which runs in a
  # crate that does not read this config) via the DOCBRAIN_MCP_* env vars these
  # map to. Defaults let a high-volume search (43-63KB raw) keep ~32KB instead
  # of being truncated. evidenceBufferCapBytes is the SHARED per-round budget;
  # size it at 2x the per-tool cap so one maxed source leaves headroom.
  # Commented = use the binary defaults (262144 / 262144 / 524288). Raised
  # through 32768→65536→262144 because slack.slack_search_public_and_private
  # returns 100-145KB raw (live-measured) — every cap below that truncated it,
  # and structural compaction of the response was abandoned (shape too variable
  # to fit reliably). 256KB per-tool lets the raw slack search result through
  # whole. Cost: a maxed slack result adds up to 256KB to the grounding prompt.
  # mcpOutputCeilingBytes: 262144         # DOCBRAIN_MCP_OUTPUT_CEILING_BYTES
  # mcpDefaultToolOutputCapBytes: 262144  # DOCBRAIN_MCP_DEFAULT_TOOL_OUTPUT_CAP_BYTES
  # evidenceBufferCapBytes: 524288        # DOCBRAIN_EVIDENCE_BUFFER_CAP_BYTES
  # mcpJqlRecencyBoundDays: 180           # DOCBRAIN_MCP_JQL_RECENCY_BOUND_DAYS — recency
                                          # window appended to unbounded full-text Jira
                                          # searches so they hit the date index (avoids 10s
                                          # timeouts). Commented = binary default (180).
  # -- Sufficiency critic. A scope-relative answer-quality gate after synthesis:
  # judges sub-part coverage grounded in retrieved sources; insufficient → ONE
  # recovery round → re-judge; still short → an honest, specific gap. ON BY
  # DEFAULT (the critic is the product). Kill-switch disables without a code
  # rollback; fail-OPEN on any critic error. Commented = binary defaults.
  # sufficiencyCriticEnabled: true              # DOCBRAIN_SUFFICIENCY_CRITIC_ENABLED
  # sufficiencyCriticMaxRecoveryRounds: 1       # DOCBRAIN_SUFFICIENCY_CRITIC_MAX_RECOVERY_ROUNDS (0..=2)
  # sufficiencyCriticSkipAboveConfidence: 0.85  # DOCBRAIN_SUFFICIENCY_CRITIC_SKIP_ABOVE_CONFIDENCE
  # sufficiencyCriticMinCoverage: 0.9           # DOCBRAIN_SUFFICIENCY_CRITIC_MIN_COVERAGE
  # sufficiencyCriticMinRecoveryBudgetMs: 20000 # DOCBRAIN_SUFFICIENCY_CRITIC_MIN_RECOVERY_BUDGET_MS — min wall-clock headroom (ms) to allow a recovery round; below this the critic ships an honest gap instead of a round the cliff would kill. Set 0 to disable.
  # Freshness Critic — the doc-generation reviewer. Flags only evidence-contradicted
  # claims (conservative-KEEP). ON by default; fail-OPEN; bounds cap cost per draft.
  # freshnessCriticEnabled: true                # DOCBRAIN_FRESHNESS_CRITIC_ENABLED (disable only with false/0/no/off)
  # freshnessCriticMaxClaims: 60                # DOCBRAIN_FRESHNESS_CRITIC_MAX_CLAIMS (over-cap claims reported unchecked, never dropped)
  # freshnessCriticBatchSize: 12               # DOCBRAIN_FRESHNESS_CRITIC_BATCH_SIZE (claims per batched judgment LLM call)
  # freshnessCriticEvidencePerClaim: 5         # DOCBRAIN_FRESHNESS_CRITIC_EVIDENCE_PER_CLAIM (evidence snippets retrieved per claim)
  # freshnessCriticMinBudgetMs: 20000          # DOCBRAIN_FRESHNESS_CRITIC_MIN_BUDGET_MS (min wall-clock headroom to RUN the critic; 0 disables the guard)
  # Support Critic (grounding) — flags claims NO supplied source supports (fabrication)
  # + NEEDS-INPUT markers the sources actually cover (inverted self-flag). ADVISORY,
  # never blocks; fail-OPEN. ON by default.
  # supportCriticEnabled: true                 # DOCBRAIN_SUPPORT_CRITIC_ENABLED (disable only with false/0/no/off)
  # supportCriticMaxClaims: 40                 # DOCBRAIN_SUPPORT_CRITIC_MAX_CLAIMS (hard cap on claims grounding-checked per draft; range 1..=200)
  # supportCriticNoFabEnforce: true            # DOCBRAIN_SUPPORT_CRITIC_NOFAB_ENFORCE (ON by default: degrade ungrounded FRESH sections to NEEDS INPUT in place so fabrication can't reach the reader; disable only with false/0/no/off)
  # Regenerate loop (Reviewer Part 2) — consumes the freshness flags and regenerates
  # until they clear. UI = human-in-loop (maxRevisions); CLI/generate = auto-review
  # (maxRounds). Feedback shapes the WRITING prompt only — never clears a flag. The
  # round cap is the hard backstop; never loops forever, never silently ships flags.
  # regenLoopEnabled: true                      # DOCBRAIN_REGEN_LOOP_ENABLED (disable only with false/0/no/off)
  # regenLoopMaxRounds: 3                       # DOCBRAIN_REGEN_LOOP_MAX_ROUNDS (CLI/generate auto-review cap; range 1..=20)
  # regenLoopMaxRevisions: 10                   # DOCBRAIN_REGEN_LOOP_MAX_REVISIONS (UI human-in-loop cap per draft; range 1..=100)
  # regenLoopMinBudgetMs: 20000                 # DOCBRAIN_REGEN_LOOP_MIN_BUDGET_MS (min wall-clock headroom to START a round; 0 disables the guard)
  # Generation hollow-doc guard (DELTA #9): refuse (422) a draft ONLY when it has no
  # seed, no High-tier authoritative grounding, AND no Low-tier live grounding either,
  # AND is mostly NEEDS-INPUT placeholders (>= this % of `##` sections). A no-seed/
  # no-High draft WITH live/Low grounding ships unverified (barred from auto-publish).
  # Applies to short docs too (min-sections floor removed). Keys on output shape + tier.
  # generateHollowRatioPct: 50                 # DOCBRAIN_GENERATE_HOLLOW_RATIO_PCT (refuse when >= this % of sections are NEEDS-INPUT)
  # In-place reconcile: when a section of an existing page is flagged stale, replace
  # ONLY that section in place instead of appending — no duplicate-but-newer content.
  # Kill-switch defaults ON (publish version-check + lint floor + fail-open-to-append).
  # reconcileEnabled: true                      # DOCBRAIN_RECONCILE_ENABLED (disable only with false/0/no/off)
  # reconcileMaxSections: 5                     # DOCBRAIN_RECONCILE_MAX_SECTIONS (max sections reconciled per draft; range 1..=50)
  # Merged-doc update: when generating against an existing target doc, return the FULL
  # merged document — unchanged sections preserved byte-exact, changed sections rewritten,
  # additions surfaced — plus a per-section change manifest, so the output can replace the
  # whole doc with confidence about what changed. Kill-switch defaults ON (unchanged
  # sections are byte-exact, an unsafe splice bails, and nothing is ever published).
  # mergeEnabled: true                          # DOCBRAIN_MERGE_ENABLED (disable only with false/0/no/off)
  # mergeMaxSections: 60                        # DOCBRAIN_MERGE_MAX_SECTIONS (max existing sections fed to the merge pass; range 1..=500)
  # mergeMaxTokens: 4096                         # DOCBRAIN_MERGE_MAX_TOKENS (max output tokens for the merge decision; range 512..=32768)
  # emptyResultFloorBytes: 256                  # DOCBRAIN_EMPTY_RESULT_FLOOR_BYTES — below
                                                # this, a search tool's ok-but-empty result
                                                # triggers ONE broaden-retry. Default 256.
  # -- Experimental retrieval ladder (Plan D). Off by default. When enabled,
  # answers are synthesised twice (indexed vs indexed+live-tool) and an LLM
  # judge picks the winner; low-confidence answers get knowledge-graph expert
  # routing. Costs an extra synthesis + judge call and disables token streaming.
  retrievalLadder:
    enabled: false
    # graphAppendThreshold: 0.5     # below this confidence, append graph experts
    # judgeTimeoutMs: 1500          # hard timeout for the judge LLM call
    # judgeModelId: ""              # empty = use the configured fast model

  # Multi-source answer fusion. When preferFused is true, answers combine ALL
  # relevant sources (indexed docs + every fired live tool) into ONE grounded
  # response instead of the retrievalLadder picking a single winner. Default
  # off during rollout; flip per deployment once validated.
  fusion:
    preferFused: false

# -- Standing premise monitor ("living claims"). Re-verifies file-path premises
# in captured knowledge fragments against connected sources' file listings
# every 300 seconds (plus an immediate check on fragment-index events).
# Deterministic — no LLM call. `uncheckable` (no connected source can currently
# speak to a premise) is never treated as `broken`; only a decisive absence is.
premises:
  monitorEnabled: true

# -- OpenSearch index names (change if sharing a cluster with other apps)
opensearch:
  internal: true
  image: opensearchproject/opensearch:2.19.0
  storage: 20Gi
  chunksIndex: docbrain-chunks
  episodesIndex: docbrain-episodes
  # externalUrl: ""

# -- Confluence image extraction from docs
imageExtraction:
  enabled: true
  timeoutSecs: 30
  llmTimeoutSecs: 120
  maxPerPage: 20
  minSizeBytes: 5120
  maxSizeBytes: 10485760

# -- Authentication
auth:
  # Session API key TTL in hours after email/password login. 0 = no expiry.
  sessionTtlHours: 720
  # CORS allowed origins (comma-separated). Defaults to web UI origin only.
  # Example: "https://docbrain.mycompany.com"
  corsAllowedOrigins: ""

# -- Self-ingest of DocBrain's own documentation (so it can answer config questions)
selfIngest:
  enabled: true
  docsPath: /app/docs

# ── SSO / OAuth providers ────────────────────────────────────────────────
# See docs/rbac.md for full setup guide.

# REQUIRED when any SSO provider is enabled.
# The backend redirects the browser here after OAuth completes.
# Set to your public web UI URL, e.g. https://docbrain.mycompany.com
# This can also be set per-provider below (per-provider takes precedence).
sso:
  webUiUrl: ""

# -- GitHub OAuth login (docbrain login --github)
# Create an OAuth App at https://github.com/settings/developers
# Callback URL: https://<your-domain>/api/v1/auth/github/callback
githubOAuth:
  enabled: false
  # clientId: ""        # set via --set githubOAuth.clientId=... or existingSecret
  # clientSecret: ""    # stored in the Helm Secret
  # redirectUri: ""     # must match the callback URL registered in GitHub
  # webUiUrl: ""        # REQUIRED in prod: your DocBrain web UI URL (e.g. https://docbrain.mycompany.com)
  #                     # The backend redirects here after OAuth completes.

# -- GitLab OIDC login (docbrain login --gitlab)
# Enable OIDC in your GitLab application:
#   Admin → Applications → Add → enable openid, profile, email, groups scopes
# Callback URL: https://<your-domain>/api/v1/auth/gitlab/callback
gitlabOAuth:
  enabled: false
  # instanceUrl: "https://gitlab.com"   # or your self-hosted URL
  # clientId: ""
  # clientSecret: ""    # stored in the Helm Secret
  # redirectUri: ""
  # webUiUrl: ""        # REQUIRED in prod: your DocBrain web UI URL (e.g. https://docbrain.mycompany.com)
  #                     # The backend redirects here after OAuth completes.

# -- Generic OIDC login (docbrain login --oidc)
# Works with Azure AD, Okta, Google Workspace, Keycloak, etc.
# Callback URL: https://<your-domain>/api/v1/auth/oidc/callback
oidc:
  enabled: false
  # issuerUrl: ""       # e.g. https://login.microsoftonline.com/<tenant>/v2.0
  # clientId: ""
  # clientSecret: ""    # stored in the Helm Secret
  # redirectUri: ""
  # webUiUrl: ""        # REQUIRED in prod: your DocBrain web UI URL (e.g. https://docbrain.mycompany.com)
  #                     # The backend redirects here after OAuth completes.

# -- Public base URL of the DocBrain WEB UI (DOCBRAIN_WEB_BASE_URL).
# Drives the MCP-OAuth landing redirect AND the "view in browser" deep link the CLI
# prints after a generate (and the shareable per-doc link). Set to the user-facing
# web origin — NOT the API host if they differ. Unset → no link is offered (never
# guessed/hardcoded). Trailing slash is trimmed server-side.
# webBaseUrl: "https://docbrain.mycompany.com"

# -- Source-System ACL Mirroring (RFC-001)
# Controls query-time enforcement of per-document ACLs derived from source
# systems (Confluence restrictions, Slack channel membership, GitHub repo
# access, Jira issue security levels, etc.).
#
# Default mode is `off` → preserves pre-RFC-001 behaviour exactly.
# Operators flip to `warn` first to validate ACL coverage on a real corpus
# (logs would-have-denied chunk_ids without changing user-visible results),
# then to `enforce` once per-connector AclProvider impls have populated the
# chunk index with `acl_principals` data.
#
# See docs/rfcs/RFC-001-source-system-acl-mirroring.md for the design.
acl:
  # off | warn | enforce
  mode: "off"
  # deny | allow — what to do with chunks lacking acl_principals data when
  # mode=enforce. Default deny is fail-closed.
  unknownPolicy: "deny"
  # OpenSearch top_k multiplier when ACL filter is active. 1.0 = no overfetch.
  recallOverfetch: 1.0
  # Drop persisted user principals older than this. 0 = no fence.
  userPrincipalMaxAgeSecs: 3600

  # -- Denial UX (RFC-002)
  # Controls how the system communicates a denial back to the user.
  # See https://github.com/docbrain-ai/docbrain/blob/main/docs/rfcs/RFC-002-acl-denial-ux.md
  denial:
    # Global default mode. silent | disclosed_no_count | disclosed
    #   silent              — no leak ('I don't have information'). Required for MNPI.
    #   disclosed_no_count  — DEFAULT. Tells the user the filter is on, no specifics leak.
    #   disclosed           — full transparency: includes count + referral string.
    mode: "disclosed_no_count"
    # Operator-provided referral string. Substituted into messages where
    # <referral> placeholder appears.
    referral: "your administrator"
    # Audit log — when true, every full or partial denial is persisted to
    # acl_audit_log table. Required for HIPAA / FedRAMP / SOC2.
    audit: false
    # When true, audit_log persists raw query text. Default false (queries
    # are SHA256-hashed). Operators in regulated contexts should keep this
    # off — queries can themselves be MNPI ("what's the Q3 earnings number?").
    auditRawQuery: false

  # -- Per-source ingest policy (M1.4)
  # Controls what each connector does when ingesting documents:
  #   off        — don't extract ACL data; chunks have empty acl_principals
  #                (treated by query-time filter per acl.unknownPolicy)
  #   public     — synthesise Public sentinel; any authenticated user reads
  #   admin_only — synthesise admin role; only Admin role can read
  #   mirror     — call source-system API to extract real per-doc ACL
  sources:
    confluence:
      # Source-level mode applied to all spaces unless overridden below.
      mode: "off"
      # Per-space overrides (case-insensitive). Map space key → mode string.
      # Example:
      #   spaceOverrides:
      #     ENG: public
      #     HR: admin_only
      spaceOverrides: {}
    # GitHub (M1.5.1): repo visibility-derived ACL.
    #   public repo  → World sentinel
    #   internal     → Group(github, '<org>:members')
    #   private      → enumerated User + Team principals
    github:
      mode: "off"
    # Slack (M1.5.2): channel-membership ACL.
    #   public channel  → workspace-wide group principal
    #   private channel → enumerated User principals
    #   shared / DMs    → admin-only fallback
    slack:
      mode: "off"
    # Jira (M1.5.3): issue security level + project fallback.
    #   security level set → Role(jira, '<project>:security:<level>')
    #   no security        → Project(jira, '<project>')
    jira:
      mode: "off"

# -- RBAC / SSO access control
# Controls who is allowed to log in and what role they receive.
# If allowedGroups and allowedDomains are both empty, all authenticated users are permitted.
rbac:
  # Default role for new SSO users: viewer (default) | editor | admin
  defaultRole: "viewer"
  # Email domain that always gets admin role (e.g. "acme.com")
  adminDomain: ""
  # Comma-separated emails that always get admin role
  adminEmails: ""
  # Comma-separated IdP group / GitHub org names that map to admin role
  adminGroups: ""
  # Comma-separated IdP group / GitHub org names that map to editor role
  editorGroups: ""
  # ACCESS GATE — only members of these groups may log in at all.
  allowedGroups: ""
  # ACCESS GATE — only users with these email domains may log in.
  allowedDomains: ""

# -- Secret (created from values, or use existing)
existingSecret: ""

# ── MCP tool platform (Plan 4) ────────────────────────────────────────────
# Enables answer-time tool dispatch through external MCP servers
# (Jira, GitHub, Sentry, etc.). Off by default — flip enabled=true once
# the per-tool manifest credentials below are populated.
#
# Manifest YAML files are shipped from helm/docbrain/files/mcp-manifests/
# (single source of truth: config/mcp-manifests/ in the repo). Drop a new
# YAML file in that directory to register an additional tool; the
# configmap-mcp-manifests.yaml template picks it up automatically via
# .Files.Glob.
mcpTools:
  enabled: false

  # -- Max concurrent gateway dispatches in a single fan-out pass
  # (clamped 1..=64 in code). Bounds how many tool calls are in flight at
  # once so an always-on full-catalog fan-out under many concurrent users
  # can't become a spawn storm. The total wall-clock budget is a separate,
  # fixed bound. Default 8.
  fanoutMaxConcurrent: 8

  # -- Max TOTAL chars of live-tool evidence admitted into a single
  # generate fan-out (clamped 1000..=200000 in code). Bounds the always-on
  # per-tool live evidence (delta #5) so a verbose catalog can't stuff the
  # writing prompt; whole lowest-priority chunks past the budget are dropped
  # at chunk boundaries (never truncated mid-chunk). Applies only to live
  # chunks; corpus chunks keep their own budget. Default 24000.
  fanoutMaxAdmittedChars: 24000

  # -- Per-connector cooldown TTL in seconds (0 disables; clamped 0..=600 in
  # code). On a 429 / timeout / transient failure, a connector is skipped from
  # dispatch for this TTL ACROSS requests so the always-on full-catalog fan-out
  # can't re-hammer a flaky / rate-limited connector on every generate +
  # regenerate. Keyed ONLY on the connector's OWN recent failures and cleared
  # the moment it succeeds (a recovered connector is never suppressed). Default 30.
  fanoutCooldownSecs: 30

  # -- DM redactor policy (Slack today; designed for any privacy-classified
  # MCP source). Controls whether tool-result entries identified as DMs
  # (`is_im: true`, `is_mpim: true`, or channel.id starting with `D`) are
  # stripped before they flow into the synthesis prompt, episode cache,
  # and memory consolidation.
  #
  # Why this matters: DocBrain persists tool results into
  # `episodes.cached_sources_json` and `episodes.answer_text`, which then
  # feed memory consolidation, expert routing, and the knowledge stream.
  # Slack's per-user OAuth token boundary prevents A from reading B's
  # DMs, but it does NOT prevent A's own DMs from being materialised
  # into the DocBrain corpus where downstream features can re-surface
  # them.
  #
  # Values:
  #   strict (default) — DM entries are replaced with a sentinel before
  #                      ANY downstream sees them. Safe default for
  #                      every deployment.
  #   warn             — log a warning per dispatch but pass DM content
  #                      through unredacted. Staging / debugging only.
  #   allow            — disable the redactor entirely. Explicit
  #                      foot-gun for operators who fork the Slack
  #                      manifest, re-add `search:read.im`/`search:read.mpim`
  #                      scopes, AND want DM content in their corpus.
  #
  # The OSS default Slack manifest does NOT request DM scopes, so a
  # default-configured deployment is safe even without this redactor.
  # The policy guards the case where a customer's manifest fork DOES
  # request them.
  dmPersistPolicy: "strict"

  # -- Diagnostic probe for the DM redactor. When true, the redactor
  # logs a WARN per slack dispatch with the first ~500 chars of the
  # parsed JSON envelope and the redaction report. DM content can
  # land in logs when this is on — turn on transiently to diagnose
  # detection misses against a new upstream MCP envelope shape, then
  # turn off. Default false.
  dmRedactorDebugProbe: false

  # -- Diagnostic probe for OAuth token-exchange decode failures.
  # When true, token-exchange decode failures emit a WARN with the
  # first ~800 chars of the upstream IdP's raw response body. Useful
  # for diagnosing response-shape mismatches when adding a new OAuth
  # manifest. Can leak partial credentials in error-response shapes —
  # turn on transiently to capture the upstream response, then turn
  # off. Default false.
  oauthExchangeDebugProbe: false

  # OAuth provider credentials. Each entry maps to a manifest's
  # auth.oauth.client_id_secret_ref / client_secret_ref.
  oauth:
    atlassian:
      clientId: ""
      clientSecret: ""
    # Slack OAuth app — per-user connect on /integrations against Slack's hosted
    # MCP server (mcp.slack.com). Each user's search runs as themselves. Needs
    # the granular search:read.* scopes (configured in the slack manifest).
    slack:
      clientId: ""
      clientSecret: ""

  # Service-account credentials. Per-manifest secret_refs map to keys here.
  serviceAccount:
    jira:
      apiToken: ""
      # Atlassian workspace cloud ID — substituted into the manifest's
      # server.endpoint URL at dispatch time (${JIRA_CLOUD_ID}).
      cloudId: ""
      # Used by the jira_rest manifest's shim for direct REST API calls.
      # Shared with ingest / enrichment when those features are enabled.
      baseUrl: ""
      userEmail: ""
    rootly:
      # ROOTLY_API_TOKEN — org-level Rootly token the on-call shim reads from
      # its env and forwards to Rootly's REST API as a Bearer header.
      # Powers the rootly manifest (get_oncall / list_overrides). Read-only.
      apiToken: ""
      # ROOTLY_BASE_URL — override the default https://api.rootly.com only for
      # self-hosted Rootly. Leave empty to use the public API.
      baseUrl: ""
  # 256-bit master key for at-rest encryption of mcp_oauth_tokens.
  # Generate with: openssl rand -hex 32
  # MUST be set whenever any manifest declares oauth in auth.modes.
  encryptionKey: ""

  # Shared secret for the internal MCP shim (jira_rest manifest). The
  # orchestrator → shim hop uses this as a bearer token. Set explicitly
  # in production so the value is stable across pod restarts — leaving
  # it empty causes the server to auto-generate per boot, which
  # invalidates any in-flight MCP session on rolling deploys.
  # Generate with: openssl rand -hex 32
  internalShimSecret: ""

  # ── Plan A: signed remote registry ────────────────────────────────────
  # When `registry.pubkey` is set, enables /api/v1/admin/mcp/registry,
  # /api/v1/admin/mcp/registry/{id}/manifest, and
  # /api/v1/admin/mcp/install-from-registry. Without it those endpoints
  # return 503 and the server boots normally — admins can still install
  # manifests via the existing paste/URL flow.
  registry:
    # Base64-encoded 32-byte Ed25519 public key for verifying the signed
    # registry index and per-manifest signatures. Leave empty to disable
    # the registry endpoints. No default.
    pubkey: ""
    # Registry index URL.
    url: "https://registry.docbrain-ai.com/v1/index.json"
    # On-disk cache path for the registry index. Acts as the Tier 2
    # fallback when the network fetch fails.
    cachePath: "/var/lib/docbrain/registry-cache/index.json"

  # ── Plan A: kubectl-command rendering for /admin/mcp/secrets/audit ────
  # Used to render the `kubectl create secret … --from-literal=…` command
  # returned by /api/v1/admin/mcp/secrets/audit/{id}. When either field
  # is empty the rendered command embeds <set DOCBRAIN_K8S_*> placeholders
  # so the admin sees what to configure. Optional — the audit endpoint
  # still works without them; only the rendered command quality differs.
  k8s:
    secretName: ""
    namespace: ""

# ── Learning pipeline (opt-in, Tier 2 feature) ─────────────────────────────
learning:
  enabled: false
  storage:
    backend: "local"          # local | s3 | gcs | azure
    localModelRoot: "/data/models"
    s3Bucket: ""
    s3Prefix: "docbrain/models"
    s3Region: "us-east-1"
    gcsBucket: ""
    gcsPrefix: "docbrain/models"
    azureContainer: ""
    azureConnectionString: ""
  training:
    trainerUrl: "http://docbrain-trainer:8765"
    minTriplets: 200
    # Base HuggingFace model for fine-tuning (LEARNING_BASE_MODEL_ID on server,
    # TRAINER_BASE_MODEL_NAME on trainer — both must match).
    # Any sentence-transformers model works; smaller models train faster on CPU.
    baseModelId: "sentence-transformers/all-MiniLM-L6-v2"
  safety:
    circuitBreakerThreshold: 0.05
    maxSingleUserFraction: 0.80
    poisonDetectionEnabled: true

# ── Trainer sidecar (only deployed when learning.enabled = true) ───────────
trainer:
  enabled: false
  image:
    repository: ghcr.io/docbrain-ai/docbrain-trainer
    tag: latest
    pullPolicy: IfNotPresent
  # Base model for fine-tuning — overrides learning.training.baseModelId if set explicitly.
  # Set both to the same value. The chart uses learning.training.baseModelId as the default
  # so you only need to set one. Leave empty to inherit from learning.training.baseModelId.
  baseModelName: ""
  epochs: 3
  batchSize: 16
  maxSeqLength: 256
  warmupSteps: 100
  quantizeOnnx: false
  onnxOpset: 17
  replicaCount: 1
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "8Gi"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  service:
    port: 8765
  nodeSelector: {}
  tolerations: []
  affinity: {}
