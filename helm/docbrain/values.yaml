# DocBrain Helm Chart Values

# -- LLM provider: bedrock | anthropic | openai | ollama | groq | openrouter | together | deepseek | mistral | xai | gemini | azure_openai | vertex_ai | cohere
llm:
  provider: anthropic
  modelId: claude-sonnet-4-5-20250929
  # fastModelId: ""        # fast/cheap model for side-calls (intent classify, query rewrite, entity extraction)
  #                        # Bedrock: us.anthropic.claude-haiku-4-5-20251001-v1:0
  #                        # Anthropic: claude-haiku-4-5-20251001
  #                        # OpenAI: gpt-4o-mini  |  Groq: llama-3.1-8b-instant
  #                        # DeepSeek: deepseek-chat  |  Mistral: mistral-small-latest
  #                        # Falls back to modelId if not set
  # ingestModelId: ""      # model used ONLY during ingest for image extraction
  #                        # IMPORTANT: set this to a cheaper model when using Opus 4 + thinkingBudget
  #                        # otherwise image extraction will trigger throttling errors on every page
  #                        # Falls back to modelId if not set
  # draftModelId: ""       # model for autopilot draft generation (two-phase reasoning + writing)
  #                        # Falls back to modelId if not set. Use a high-capability model here.
  # draftProvider: ""      # provider for draft generation. Falls back to llm.provider if not set.
  #                        # Allows cross-provider drafting (e.g. Gemini for Q&A, Anthropic for drafts)
  # thinkingBudget: 0      # extended thinking token budget (Anthropic/Bedrock only, 0 = disabled)
  #                        # does NOT apply to fastModelId or ingestModelId

  # -- Anthropic (provider: anthropic)
  # anthropicApiKey: ""    # set via --set or secret; ANTHROPIC_API_KEY

  # -- OpenAI and OpenAI-compatible (provider: openai)
  # openaiApiKey: ""       # OPENAI_API_KEY
  # openaiBaseUrl: ""      # override for OpenAI-compatible endpoints (e.g. LiteLLM proxy)

  # -- Groq — fast inference (provider: groq, default model: llama-3.3-70b-versatile)
  # groqApiKey: ""         # GROQ_API_KEY

  # -- OpenRouter — unified API across providers (provider: openrouter, default model: openai/gpt-4o)
  # openrouterApiKey: ""   # OPENROUTER_API_KEY

  # -- Together AI — open model hosting (provider: together, default: meta-llama/Llama-3.3-70B-Instruct-Turbo)
  # togetherApiKey: ""     # TOGETHER_API_KEY

  # -- DeepSeek (provider: deepseek, default model: deepseek-chat)
  # deepseekApiKey: ""     # DEEPSEEK_API_KEY

  # -- Mistral (provider: mistral, default model: mistral-small-latest)
  # mistralApiKey: ""      # MISTRAL_API_KEY

  # -- xAI / Grok (provider: xai, default model: grok-3)
  # xaiApiKey: ""          # XAI_API_KEY

  # -- Google Gemini (provider: gemini, default model: gemini-2.5-flash)
  # geminiApiKey: ""       # GEMINI_API_KEY

  # -- Azure OpenAI (provider: azure_openai, modelId = deployment name e.g. "gpt-4o")
  # azureOpenaiApiKey: ""     # AZURE_OPENAI_API_KEY
  # azureOpenaiEndpoint: ""   # AZURE_OPENAI_ENDPOINT e.g. https://my-resource.openai.azure.com
  # azureOpenaiApiVersion: "" # AZURE_OPENAI_API_VERSION default: 2024-02-01

  # -- Vertex AI — GCP-hosted models (provider: vertex_ai, default model: google/gemini-2.5-flash-001)
  # vertexProject: ""     # VERTEX_PROJECT — GCP project ID (required)
  # vertexRegion: ""      # VERTEX_REGION — GCP region (default: us-central1)
  # Auth: set GOOGLE_APPLICATION_CREDENTIALS in server.env or use Workload Identity (GKE)
  # Example models: google/gemini-2.5-flash-001, meta/llama-3.3-70b-instruct-maas

  # -- Cohere (provider: cohere, default model: command-r-plus)
  # cohereApiKey: ""       # COHERE_API_KEY

  # -- Ollama — local models (provider: ollama, default model: llama3.1)
  # ollamaBaseUrl: "http://ollama:11434"
  # ollamaTimeoutSecs: 300  # HTTP timeout (seconds); increase for large models (e.g. 70B). Default 120.

# -- Embedding provider: bedrock | openai | ollama
embedding:
  provider: openai
  modelId: text-embedding-3-small
  # openaiApiKey: ""     # defaults to llm.openaiApiKey if not set

# -- Retrieval pipeline tuning (optional)
#
# DocBrain runs queries through a five-stage retrieval pipeline when a
# reranker is configured. Defaults are chosen from the canonical RRF
# paper / standard practice; tune only when you have latency/quality
# data to justify a change.
#
# See https://github.com/docbrain-ai/docbrain/blob/main/docs/configuration.md#retrieval-pipeline
# for the full field reference.
rag:
  # topK: 10                    # final chunks sent to the LLM
  # bm25Boost: 1.0              # BM25 vs vector weight in hybrid
  # candidatePoolSize: 200      # pool size fed to reranker
  # rrfK: 60                    # Reciprocal Rank Fusion damping constant
  # maxPerSource: 3             # per-source cap in final top-k
  # maxPerDocument: 2           # per-document cap in final top-k
  #
  # ── Grounding floors — calibrated for a real cross-encoder reranker ──
  #
  # These four values are the single biggest quality lever in DocBrain.
  # They all gate on the reranker's calibrated [0, 1] relevance score,
  # and the recommended defaults below match where Cohere Rerank v3.5
  # (and similarly tuned cross-encoders like Voyage rerank-2 and Jina
  # reranker-v2) separate "actually answers the question" from "shares
  # a few keywords but is not on-topic".
  #
  # Lowering them improves RECALL (more answers get surfaced) at the
  # cost of PRECISION (more noisy citations, more hallucination risk
  # from weakly-grounded evidence). Raising them improves precision
  # at the cost of recall (more "insufficient information" answers).
  #
  # If `rerank.provider = "none"` these floors gate on raw BM25/vector
  # scores which are NOT calibrated to [0,1] — in that mode, prefer
  # `0.0` and rely on `top_k` to bound results instead. See
  # docs/rerank-providers.md § "Tuning the grounding floors" for the
  # full explanation.
  #
  minRelevanceScore: 0.40       # retrieval floor — chunks below this are dropped from diversity selection entirely. Lowering lets weaker evidence reach the LLM and raises hallucination risk.
  displayFloor: 0.50            # display floor — chunks below this are never shown as a source even if the LLM used them. Lowering shows more citations per answer but includes tangentially-related docs that erode user trust.
  confidenceGate: 0.40          # confidence gate — when the answer's overall confidence is below this, DocBrain hides all sources (the answer is shown as "based on general knowledge"). Lowering shows sources on lower-confidence answers; raising forces the UI to go source-less more often.
  strongAnswerFloor: 0.55       # strong-answer floor — top-1 rerank score required before the answer is emitted without a "low confidence" disclaimer. Below minRelevanceScore the query short-circuits to "insufficient information" and never calls the LLM at all.
  # freshnessWindowDays: 7      # freshness retriever window (0 to disable)
  # freshnessPreDiversity: true # apply freshness BEFORE diversity (recommended)
  # rerankTitleEnrich: true     # pass title+heading+space to reranker (recommended)
  # entityCacheTtlSecs: 300     # entity → space cache TTL
  # maxRewrites: 2              # query rewrites per ask (0 to disable)
  # maxChunksPerDoc: 2          # Phase 2 chunk-flood fix — per-retriever cap
  # compoundDecompose: true     # Phase 5 — split compound questions into sub-intents
  # traceDetail: false          # log per-chunk rerank scores in final top-k

# -- Semantic reranker (stage 3 of the retrieval pipeline)
#
# `provider: none` (default) disables the five-stage pipeline and runs
# the legacy single-hybrid-search path. Rollback = flip back to `none`.
#
# DocBrain supports every major hosted rerank API through a single
# dialect-driven HTTP client. Built-in dialects: bedrock, cohere, voyage,
# jina, mixedbread, pinecone, ollama. Plus a `custom` dialect that can
# wire any new rerank API from values alone — no rebuild required.
#
# See docs/rerank-providers.md for the provider matrix and examples.
rerank:
  provider: none                # none | bedrock | cohere | voyage | jina | mixedbread | pinecone | ollama | custom
  # modelId: rerank-v3.5        # provider default applies when unset
  # topN: 200                   # candidates scored per query (match rag.candidatePoolSize)
  # batchSize: 100              # docs per reranker API call
  # timeoutSecs: 10             # per-request timeout (hot-path, keep tight)
  #
  # Hosted provider credentials — set via Kubernetes secrets in production.
  # cohereApiKey: ""            # required when provider=cohere
  # voyageApiKey: ""            # required when provider=voyage
  # jinaApiKey: ""              # required when provider=jina
  # mixedbreadApiKey: ""        # required when provider=mixedbread
  # pineconeApiKey: ""          # required when provider=pinecone (sent as Api-Key header)
  # ollamaBaseUrl: ""           # defaults to llm.ollamaBaseUrl
  #
  # Custom dialect — wire any Cohere-family rerank API without rebuilding.
  # Defaults match Cohere's request/response shape; override any JSON key
  # that differs. The API key is read from the env var named by
  # customApiKeyEnv — the secret is never stored in values.yaml.
  # customBaseUrl: "https://rerank.mycorp.internal/v1/rerank"
  # customApiKeyEnv: "MYCORP_RERANK_KEY"
  # customAuthStyle: "bearer_token"     # or: custom_header
  # customAuthHeaderName: "Api-Key"     # only when customAuthStyle=custom_header
  # customDocumentsField: "documents"
  # customTopNField: "top_n"
  # customResultsField: "results"
  # customScoreField: "relevance_score"

# -- Ingestion configuration
#
# Detailed ingestion sources (github, gitlab, slack, jira, linear, pagerduty,
# opsgenie, zendesk, intercom, ms_teams) live under the nested `sources:`
# block in config/default.yaml and config/production.yaml baked into the
# container image. Customers override them by mounting a ConfigMap containing
# a local.yaml file, or by setting scalar secret env vars via a Secret.
#
# See https://github.com/docbrain-ai/docbrain/blob/main/docs/configuration.md
# for the full nested shape and the selector grammar.
ingest:
  schedule: "0 */6 * * *"   # every 6 hours
  # localDocsPath is only used when local ingest is explicitly enabled via
  # `ingest.sources.local.*`. Leave unset unless you're mounting a docs
  # volume. Setting it by default would silently enable local ingest against
  # a non-existent path via the LOCAL_DOCS_PATH env_override in config.rs.
  # localDocsPath: /data/docs
  # Size of the PersistentVolumeClaim created for local docs when
  # sources.local.path is set in config YAML.
  docsStorage: 5Gi
  # storageClassName: ""   # leave empty to use the cluster default StorageClass
  # Run ingest once at server startup before the first scheduled CronJob run.
  # Ensures data is indexed immediately after install or upgrade. Default: true.
  runOnStartup: true

  # -- Image extraction during Confluence ingest.
  # When true, embedded images on pages are described via the configured LLM
  # (vision-capable model required: Bedrock Claude, Anthropic Claude, or
  # OpenAI GPT-4-vision) and the descriptions are spliced into the chunked
  # markdown so retrieval can hit on diagrams, screenshots, and architecture
  # sketches.
  #
  # Default: false. Off because:
  #   1. It costs LLM calls per image — operators should opt in deliberately.
  #   2. Some deployments use non-vision LLMs (small Ollama models) where
  #      this would error on every image.
  #
  # Set to true only when your LLM is vision-capable AND you have budget
  # for the additional per-image inference calls.
  imageExtractionEnabled: false

  # Legacy flat Confluence block (kept until Confluence is nested under sources).
  # confluence:
  #   baseUrl: ""
  #   email: ""
  #   apiToken: ""
  #   spaceKeys: ""
  #   apiVersion: v2          # v2 for Cloud (default), v1 for self-hosted Data Center
  #   pageIds: ""             # comma-separated page IDs (+ all descendants); from any space
  #   pageLimit: 0            # max pages per space; 0 = unlimited (fetch all subpages)

  # ── Nested ingestion sources ───────────────────────────────────────────
  #
  # This `sources:` subtree is rendered verbatim into a ConfigMap mounted at
  # `/app/config/local.yaml` inside the server and ingest containers. The
  # DocBrain config loader reads `local.yaml` last, so its values override
  # anything baked into `default.yaml` / `production.yaml`.
  #
  # Enablement is structural: include a sub-source block (e.g. `github.code`
  # or `jira`) to enable it. Every list-of-targets field (repos, projects,
  # channels, teams, …) must be non-empty — an empty list is a startup error.
  #
  # Secrets should come from Kubernetes secrets via env vars (see `sources`
  # section in .env.example / docs/configuration.md for the variable names).
  # Use ${VAR} substitution in this block to reference env vars at load time.
  #
  # Example — enable GitHub PR ingest for a fixed repo list:
  #
  # sources:
  #   github:
  #     token: ${GITHUB_TOKEN}
  #     pull_requests:
  #       repos:
  #         - acme/platform
  #         - acme/docs
  #       lookback_days: 365
  #       min_comments: 1
  #   slack:
  #     token: ${SLACK_INGEST_TOKEN}
  #     threads:
  #       channels:
  #         - "#incident-response"
  #         - "#eng-platform"
  #       min_replies: 3
  #       lookback_days: 90
  #
  # When `sources` is empty (the default), no extra ConfigMap is created and
  # only the baked-in defaults run (self-ingest and any env-var-only shape).
  sources: {}

# -- Draft Publishing (multi-target)
# Publish AI-generated drafts to Confluence, GitHub (PR), or GitLab (MR).
# Per-space routing is managed via the API: /api/v1/publish-targets
draftPublish:
  target: "none"           # "confluence" | "github" | "gitlab" | "none"
  autoIngestAfterPublish: true
  # -- GitHub publishing (when target=github)
  github:
    # token: ""            # GITHUB_PUBLISH_TOKEN — GitHub PAT with repo scope (stored in Secret)
    # repo: ""             # GITHUB_PUBLISH_REPO — owner/repo e.g. acme/docs
    branch: "main"
    docsPath: "docs"
    prLabels: "docbrain,auto-generated"
    createPr: true
    # apiUrl: ""           # GITHUB_PUBLISH_API_URL — override for GitHub Enterprise
  # -- GitLab publishing (when target=gitlab)
  gitlab:
    # token: ""            # GITLAB_PUBLISH_TOKEN — GitLab PAT with api scope (stored in Secret)
    # projectId: ""        # GITLAB_PUBLISH_PROJECT_ID — numeric project ID
    # baseUrl: ""          # GITLAB_PUBLISH_BASE_URL — default: https://gitlab.com
    branch: "main"
    docsPath: "docs"
    mrLabels: "docbrain,auto-generated"
    createMr: true

# -- GitLab MR real-time capture webhook
# Enables POST /api/v1/gitlab/events for `@docbrain capture` on merge requests.
# See docs/gitlab-capture.md for GitLab-side webhook setup instructions.
gitlabCapture:
  enabled: false
  # webhookSecret: ""    # REQUIRED: X-Gitlab-Token secret configured in GitLab — stored in Secret
  #                      # Generate with: openssl rand -hex 32
  # token: ""            # REQUIRED: GitLab PAT with api scope (fetch MR notes + post replies) — stored in Secret
  # baseUrl: ""          # GITLAB_CAPTURE_BASE_URL — default: https://gitlab.com; override for self-hosted
  # tlsInsecure: false   # GITLAB_CAPTURE_TLS_INSECURE — set true for self-hosted GitLab with self-signed certs
  # allowedUsers: ""     # GITLAB_CAPTURE_ALLOWED_USERS — comma-separated usernames; empty = all
  # allowedProjects: ""  # GITLAB_CAPTURE_ALLOWED_PROJECTS — comma-separated group/project paths; empty = all

# -- Confluence real-time webhook sync
# Enables POST /confluence/events for instant page indexing on create/update/delete.
# See docs/confluence-webhook.md for Confluence-side setup instructions.
confluenceWebhook:
  enabled: false
  # webhookSecret: ""   # REQUIRED: shared secret configured in Confluence — stored in Secret
                        # Generate with: openssl rand -hex 32
  # baseUrl: ""         # CONFLUENCE_BASE_URL — required if ingest.confluence is not configured
  # email: ""           # CONFLUENCE_USER_EMAIL (Cloud only; not needed for Data Center)
  # apiToken: ""        # CONFLUENCE_API_TOKEN — stored in Secret; required if ingest.confluence not set
  # apiVersion: v2      # v2 for Confluence Cloud (default), v1 for self-hosted Data Center

# -- DocBrain API Server
server:
  image:
    repository: ghcr.io/docbrain-ai/docbrain
    # Defaults to Chart.AppVersion (e.g. "1.2.0") when left empty.
    # Override for a specific release: tag: "v1.1.0"
    # Or for the latest unstable build: tag: "edge"
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # CORS origins (comma-separated). Required for browser clients.
  # Example: corsAllowedOrigins: "https://docbrain.mycompany.com"
  corsAllowedOrigins: ""
  # Session lifetime for web logins (hours). Default: 720 (30 days)
  loginSessionTtlHours: "720"
  # Additional arbitrary env vars passed through to the server ConfigMap
  env: {}
  # Additional arbitrary key-value pairs added to the server Secret (e.g. for Vault references)
  secrets: {}
  # Extra pod annotations — injected into the server pod template (e.g. Vault Agent annotations)
  vaultAnnotations: {}

# -- DocBrain Web UI
web:
  enabled: true
  image:
    repository: ghcr.io/docbrain-ai/docbrain-web
    # Defaults to Chart.AppVersion when left empty (same version as the server).
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3001
  # The frontend resolves the backend URL via window.location.origin (same-origin).
  # The ingress above routes /api/* to the backend — no extra config needed.
  # NEXT_PUBLIC_* env vars are baked at build time and cannot be overridden at runtime.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- PostgreSQL
postgresql:
  internal: true
  image: postgres:17-alpine
  storage: 10Gi
  # storageClassName: ""  # leave empty to use cluster default StorageClass
  # password: ""          # auto-generated if not set; stored in the Secret
  # externalUrl: ""       # if internal=false

# -- OpenSearch
opensearch:
  internal: true
  image: opensearchproject/opensearch:2.19.0
  storage: 20Gi
  # storageClassName: ""  # leave empty to use cluster default StorageClass
  # externalUrl: ""

# -- Redis
redis:
  internal: true
  image: redis:7-alpine
  storage: 1Gi
  # storageClassName: ""  # leave empty to use cluster default StorageClass
  # externalUrl: ""

# -- Event Bus (internal pub/sub — always enabled)
eventBus:
  capacity: 4096              # Broadcast channel buffer size (max: 65536)
  retentionDays: 90           # Days to keep events in event_log table

# -- Knowledge Fragments (confidence-based knowledge capture)
fragments:
  autoIndexThreshold: 0.7     # Min confidence to auto-index fragments into search
  reviewThreshold: 0.4        # Min confidence for review queue; below = discard
  maxContentLength: 10000     # Max fragment content length in characters
  distillation:
    enabled: true               # Enable/disable conversation auto-distillation
    maxConcurrent: 3            # Max concurrent LLM distillation calls
    maxContentChars: 8000       # Max conversation chars sent to LLM
    maxFragments: 5             # Max fragments per conversation
  clustering:
    enabled: true               # Enable/disable semantic clustering endpoint
    clusterThreshold: 0.80      # Cosine similarity threshold for grouping fragments
    minClusterSize: 3           # Min fragments per cluster
    minSourceDiversity: 2       # Min distinct source types for composability
    maxFragmentsPerRun: 2000    # Max fragments loaded per clustering run

# -- CI/CD Pipeline Capture (automated knowledge extraction from PRs and deployments)
ci:
  enabled: true                 # Enable/disable CI capture endpoints

# -- Documentation Autopilot (AI-driven gap analysis + draft generation)
# Enabled by default. Set enabled: false to opt out.
autopilot:
  enabled: true
  gapAnalysisIntervalHours: "6"
  # Auto-draft: automatically generate drafts for qualifying gaps (no human trigger).
  # Manual by default. Set autoDraft: true to enable.
  autoDraft: false
  # Minimum gap severity for auto-drafting: critical | high | medium | low
  autoDraftSeverity: critical
  # Severity scale factors — tune for your org's signal volume.
  criticalUsers: 5        # env: AUTOPILOT_CRITICAL_USERS
  criticalSignals: 15     # env: AUTOPILOT_CRITICAL_SIGNALS
  thresholdCritical: 0.75 # env: AUTOPILOT_CRITICAL_THRESHOLD
  thresholdHigh: 0.55     # env: AUTOPILOT_HIGH_THRESHOLD
  thresholdMedium: 0.35   # env: AUTOPILOT_MEDIUM_THRESHOLD

# -- Draft Publishing — closes the feedback loop by publishing AI drafts to Confluence
# When configured, the Publish button (and auto-draft if enabled) will create Confluence pages
# and mark the originating gap cluster as resolved.
draftPublish:
  # Target system: "confluence" | "none"
  target: none
  # confluenceSpaceKey: ""       # Confluence space key for new pages (e.g. "ENG")
  # confluenceParentPageId: ""   # Optional parent page ID — new pages become children
  # Re-ingest the published page so DocBrain learns from it immediately
  autoIngestAfterPublish: true

# -- Freshness scoring scheduler
freshness:
  schedulerIntervalHours: "24"
  # Max docs to run contradiction LLM checks per freshness pass. Higher = more cost/latency.
  contradictionChecksPerPass: "10"
  # Include recent event-based docs (Slack, PRs, Jira) in contradiction pass alongside stalest docs.
  contradictionIncludeRecentEventDocs: true
  # Only event-based docs edited within this many days are eligible for contradiction checks.
  contradictionEventDocMaxAgeDays: 90

  # -- Lifecycle exclusion rules — exclude docs from freshness scoring based
  # on source-system metadata (Confluence labels, page status, title patterns).
  #
  # When set, overrides the defaults baked into the container image
  # (config/default.yaml) via a mounted local.yaml overlay. NO image rebuild
  # required — change values.yaml and run `helm upgrade`.
  #
  # Common use case: "skip every doc tagged 'retrospective' in Confluence"
  # → add `retrospective` to archived_labels below, helm upgrade, then click
  # "Reclassify lifecycle" in the UI (or POST /api/v1/freshness/backfill-lifecycle).
  #
  # Defaults shipped in the image:
  #   archived_labels: [archived, historical, obsolete, deprecated, frozen, reference]
  #   archived_page_statuses: [archived, trashed]
  #   archived_title_patterns: ['^Archived ', '^\[ARCHIVED\]', '\(archived\)$']
  #
  # Manual overrides via PATCH /api/v1/documents/{id}/lifecycle are sticky
  # — they survive future syncs even if the source-system label changes.
  #
  # exclusionRules:
  #   archived_labels:
  #     - archived
  #     - historical
  #     - retrospective    # exclude retros from scoring
  #   archived_page_statuses:
  #     - archived
  #     - trashed
  #   archived_title_patterns:
  #     - '^Archived '
  #     - '^\[ARCHIVED\]'

  # -- Event-based source types — sources whose docs are permanent historical
  # records (incident threads, merged PRs, support tickets). For these,
  # time_decay = 100 (don't penalise age) and LLM/link/contradiction passes
  # are skipped. Use to register custom permanent-record source types.
  #
  # Defaults shipped in the image:
  #   slack_thread, github_pr, github, gitlab_mr, jira, linear, pagerduty,
  #   opsgenie, zendesk, intercom, fireflies
  #
  # eventBasedSpaces:
  #   - slack_thread
  #   - github_pr
  #   - jira
  #   - my_custom_incident_source

# -- Semantic quality scoring (LLM-assessed)
semanticQuality:
  enabled: true
  intervalHours: "24"
  budget: "50"
  structuralThreshold: "40.0"

# -- Memory consolidation
memory:
  consolidationIntervalHours: "6"

# ── SSO / OAuth providers ────────────────────────────────────────────────
# See docs/rbac.md for full setup guide.

# REQUIRED when any SSO provider is enabled.
# The backend redirects the browser here after OAuth completes.
# Set to your public web UI URL, e.g. https://docbrain.mycompany.com
# This can also be set per-provider below (per-provider takes precedence).
sso:
  webUiUrl: ""

# -- GitHub OAuth login (docbrain login --github)
# Create an OAuth App at https://github.com/settings/developers
# Callback URL: https://<your-domain>/api/v1/auth/github/callback
githubOAuth:
  enabled: false
  # clientId: ""        # set via --set githubOAuth.clientId=... or existingSecret
  # clientSecret: ""    # stored in the Helm Secret
  # redirectUri: ""     # must match the callback URL registered in GitHub
  # webUiUrl: ""        # REQUIRED in prod: your DocBrain web UI URL (e.g. https://docbrain.mycompany.com)
  #                     # The backend redirects here after OAuth completes.

# -- GitLab OIDC login (docbrain login --gitlab)
# Enable OIDC in your GitLab application:
#   Admin → Applications → Add → enable openid, profile, email, groups scopes
# Callback URL: https://<your-domain>/api/v1/auth/gitlab/callback
gitlabOAuth:
  enabled: false
  # instanceUrl: "https://gitlab.com"   # or your self-hosted URL
  # clientId: ""
  # clientSecret: ""    # stored in the Helm Secret
  # redirectUri: ""
  # webUiUrl: ""        # REQUIRED in prod: your DocBrain web UI URL (e.g. https://docbrain.mycompany.com)
  #                     # The backend redirects here after OAuth completes.

# -- Generic OIDC login (docbrain login --oidc)
# Works with Azure AD, Okta, Google Workspace, Keycloak, etc.
# Callback URL: https://<your-domain>/api/v1/auth/oidc/callback
oidc:
  enabled: false
  # issuerUrl: ""       # e.g. https://login.microsoftonline.com/<tenant>/v2.0
  # clientId: ""
  # clientSecret: ""    # stored in the Helm Secret
  # redirectUri: ""
  # webUiUrl: ""        # REQUIRED in prod: your DocBrain web UI URL (e.g. https://docbrain.mycompany.com)
  #                     # The backend redirects here after OAuth completes.

# -- Source-System ACL Mirroring (RFC-001)
# Controls query-time enforcement of per-document ACLs derived from source
# systems (Confluence restrictions, Slack channel membership, GitHub repo
# access, Jira issue security levels, etc.).
#
# Default mode is `off` → preserves pre-RFC-001 behaviour exactly.
# Operators flip to `warn` first to validate ACL coverage on a real corpus
# (logs would-have-denied chunk_ids without changing user-visible results),
# then to `enforce` once per-connector AclProvider impls have populated the
# chunk index with `acl_principals` data.
#
# See docs/rfcs/RFC-001-source-system-acl-mirroring.md for the design.
acl:
  # off | warn | enforce
  mode: "off"
  # deny | allow — what to do with chunks lacking acl_principals data when
  # mode=enforce. Default deny is fail-closed.
  unknownPolicy: "deny"
  # OpenSearch top_k multiplier when ACL filter is active. 1.0 = no overfetch.
  recallOverfetch: 1.0
  # Drop persisted user principals older than this. 0 = no fence.
  userPrincipalMaxAgeSecs: 3600

  # -- Denial UX (RFC-002)
  # Controls how the system communicates a denial back to the user.
  # See https://github.com/docbrain-ai/docbrain/blob/main/docs/rfcs/RFC-002-acl-denial-ux.md
  denial:
    # Global default mode. silent | disclosed_no_count | disclosed
    #   silent              — no leak ('I don't have information'). Required for MNPI.
    #   disclosed_no_count  — DEFAULT. Tells the user the filter is on, no specifics leak.
    #   disclosed           — full transparency: includes count + referral string.
    mode: "disclosed_no_count"
    # Operator-provided referral string. Substituted into messages where
    # <referral> placeholder appears.
    referral: "your administrator"
    # Audit log — when true, every full or partial denial is persisted to
    # acl_audit_log table. Required for HIPAA / FedRAMP / SOC2.
    audit: false
    # When true, audit_log persists raw query text. Default false (queries
    # are SHA256-hashed). Operators in regulated contexts should keep this
    # off — queries can themselves be MNPI ("what's the Q3 earnings number?").
    auditRawQuery: false

  # -- Per-source ingest policy (M1.4)
  # Controls what each connector does when ingesting documents:
  #   off        — don't extract ACL data; chunks have empty acl_principals
  #                (treated by query-time filter per acl.unknownPolicy)
  #   public     — synthesise Public sentinel; any authenticated user reads
  #   admin_only — synthesise admin role; only Admin role can read
  #   mirror     — call source-system API to extract real per-doc ACL
  sources:
    confluence:
      # Source-level mode applied to all spaces unless overridden below.
      mode: "off"
      # Per-space overrides (case-insensitive). Map space key → mode string.
      # Example:
      #   spaceOverrides:
      #     ENG: public
      #     HR: admin_only
      spaceOverrides: {}
    # GitHub (M1.5.1): repo visibility-derived ACL.
    #   public repo  → World sentinel
    #   internal     → Group(github, '<org>:members')
    #   private      → enumerated User + Team principals
    github:
      mode: "off"
    # Slack (M1.5.2): channel-membership ACL.
    #   public channel  → workspace-wide group principal
    #   private channel → enumerated User principals
    #   shared / DMs    → admin-only fallback
    slack:
      mode: "off"
    # Jira (M1.5.3): issue security level + project fallback.
    #   security level set → Role(jira, '<project>:security:<level>')
    #   no security        → Project(jira, '<project>')
    jira:
      mode: "off"

# -- RBAC / SSO access control
# Controls who is allowed to log in and what role they receive.
# If allowedGroups and allowedDomains are both empty, all authenticated users are permitted.
# See docs/rbac.md for full details.
rbac:
  # Default role for new SSO users: viewer (default) | editor | admin
  defaultRole: "viewer"
  # Email domain that always gets admin role (e.g. "acme.com")
  adminDomain: ""
  # Comma-separated emails that always get admin role
  adminEmails: ""
  # Comma-separated IdP group / GitHub org names that map to admin role
  adminGroups: ""
  # Comma-separated IdP group / GitHub org names that map to analyst role (reserved for future use).
  analystGroups: ""
  # Comma-separated IdP group / GitHub org names that map to editor role
  editorGroups: ""
  # ACCESS GATE — only members of these groups may log in at all.
  # Comma-separated IdP group names (OIDC/GitLab) or GitHub org names.
  # Leave empty to allow all authenticated users (default, backward-compatible).
  # Example: "platform-team,sre-team"
  allowedGroups: ""
  # ACCESS GATE — only users with these email domains may log in.
  # Comma-separated. Leave empty to allow all email domains (default).
  # Example: "acme.com,acme.org"
  allowedDomains: ""

# -- Ingress
ingress:
  enabled: false
  className: nginx
  host: docbrain.local
  tls: false
  # tlsSecretName: docbrain-tls

# -- Bootstrap admin key lifecycle
# The bootstrap key is generated once at helm install and stored in a separate
# {release}-initial-admin-secret. It is preserved across helm upgrades.
#
# To disable (revoke from DB + delete the Secret on next upgrade):
#   helm upgrade docbrain ./helm/docbrain --set bootstrapKey.enabled=false
#
# Retrieve:
#   kubectl get secret docbrain-initial-admin-secret \
#     -o jsonpath='{.data.BOOTSTRAP_ADMIN_KEY}' | base64 -d
bootstrapKey:
  enabled: true

# -- Service Account
# If create=true, a ServiceAccount is created and bound to all workloads (server, web, ingest).
# Useful for IRSA (AWS), Workload Identity (GCP), or any pod-level IAM binding.
serviceAccount:
  create: false
  # name: ""          # defaults to the release fullname when create=true
  # annotations: {}   # e.g. eks.amazonaws.com/role-arn: arn:aws:iam::...

# -- Secret (created from values, or use existing)
# If existingSecret is set, the chart will NOT create a Secret and will use this one instead.
# The existing secret must contain all required keys (POSTGRES_PASSWORD, etc.)
existingSecret: ""

# -- Documentation Analytics
# ROI calculation parameters for the documentation analytics score.
velocity:
  minutesSavedPerQuery: 15    # Estimated minutes saved per deflected query
  hourlyRate: 75              # Effective hourly rate (USD) for ROI

# -- Knowledge Stream
# Background task that emits proactive events (incidents, decay alerts, expertise gaps).
stream:
  enabled: false              # Set to true to enable stream emission
  intervalMinutes: 30         # How often the background task runs
  incidentWarningMinUsers: 3  # Min unique users hitting an unanswered question to emit warning
  decayThreshold: 0.5         # Freshness score below which a decay alert is emitted

# -- Governance SLA Checker
# Periodic background task that detects SLA breaches across gaps, drafts,
# and documents. SLA thresholds are managed via the API (per-space overridable).
governance:
  slaCheckerIntervalHours: 1           # How often the checker runs (hours)
  slaCheckerQueryTimeoutSecs: 30       # Per-entity-type query timeout (seconds)
  slaCheckerMaxCandidates: 5000        # Max candidate entities per type per run
  slaCheckerMaxEventsPerRun: 50        # Max SlaBreached events emitted per run

# -- External Connectors (HTTP Connector Protocol)
# Stateless HTTP servers that implement GET /health, POST /documents/list,
# POST /documents/fetch. DocBrain calls them on a cron schedule to ingest documents.
# Connectors are managed via the API (/api/v1/connectors).
connectors:
  enabled: true                       # Enable/disable the connector scheduler
  maxConcurrentSyncs: 3               # Max connectors syncing simultaneously (1-20)
  maxPagesPerSync: 200                # Max list pages fetched per sync
  maxDocumentsPerSync: 5000           # Max documents ingested per sync
  fetchBatchSize: 50                  # Documents fetched per batch (1-200)
  requestTimeoutSecs: 30              # HTTP timeout for connector requests (5-300)
  syncTimeoutSecs: 3600               # Overall sync timeout (60-7200)
  maxResponseBytes: 10485760          # Max response body size (10MB)
  circuitBreakerThreshold: 5          # Consecutive failures before auto-disable
  allowInternal: false                # Allow connector URLs on private/internal IPs

# -- Webhooks (outbound event delivery)
# Push DocBrain events to external systems via HTTPS webhooks.
# Subscriptions are managed via the API (/api/v1/webhooks). These values
# control delivery behavior — timeouts, retries, and circuit breaker.
webhooks:
  deliveryTimeoutSeconds: 10        # HTTP timeout per delivery attempt (1-60)
  maxRetries: 4                     # Max delivery attempts (1-10)
  circuitBreakerThreshold: 10       # Consecutive failures before auto-disable (3-100)
  allowInternal: false              # Allow delivery to private IPs (10.x, 172.16.x, 192.168.x)

# ── Embedding Fine-Tuning (opt-in, Tier 2) ─────────────────────────────────
# Disabled by default. See docs/learning.md for setup instructions.
learning:
  enabled: false
  storage:
    backend: "local"          # local | s3 | gcs | azure
    localModelRoot: "/data/models"
    s3Bucket: ""
    s3Prefix: "docbrain/models"
    s3Region: "us-east-1"
    gcsBucket: ""
    gcsPrefix: "docbrain/models"
    azureContainer: ""
    azureConnectionString: ""
  training:
    # trainerUrl is auto-computed from the release name — do not override here.
    # It resolves to http://<release>-trainer:8765 via the ConfigMap template.
    minTriplets: 200
  safety:
    circuitBreakerThreshold: 0.05
    maxSingleUserFraction: 0.80
    poisonDetectionEnabled: true

# ── Trainer sidecar ─────────────────────────────────────────────────────────
# Only deployed when learning.enabled = true.
# Requires at least 2 vCPU / 8 GB RAM for training runs. GPU optional.
#
# Security: set apiKey to a strong random secret shared with the DocBrain server.
# Generate with: openssl rand -hex 32
# The trainer Service is ClusterIP-only — it is never exposed outside the cluster.
trainer:
  enabled: false
  # Shared secret for trainer API authentication (X-Trainer-Key header).
  # Set via --set trainer.apiKey=<secret> or a Kubernetes Secret reference.
  # Leave empty to disable auth (development only).
  apiKey: ""
  image:
    repository: ghcr.io/docbrain-ai/docbrain-trainer
    # Defaults to Chart.AppVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent
  baseModelName: "sentence-transformers/all-MiniLM-L6-v2"
  epochs: 3
  batchSize: 16
  maxSeqLength: 256
  warmupSteps: 100
  quantizeOnnx: false
  onnxOpset: 17
  replicaCount: 1
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "8Gi"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  service:
    port: 8765
  nodeSelector: {}
  tolerations: []
  affinity: {}
