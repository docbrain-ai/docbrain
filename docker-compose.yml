# ═══════════════════════════════════════════════════════════════════════════
# DocBrain — Full Stack
#
# Usage:
#   cp .env.example .env        # add your LLM keys, Confluence token, etc.
#   docker compose up -d        # starts all services
#
# Configuration:
#   YAML defaults are baked into the Docker image (config/default.yaml +
#   config/production.yaml). You configure via .env for secrets and
#   deployment-specific values. Environment variables always win over YAML.
#
#   To use a custom config directory (e.g. Kubernetes ConfigMap):
#     environment:
#       DOCBRAIN_CONFIG_DIR: /etc/docbrain
#     volumes:
#       - /path/to/your/config:/etc/docbrain:ro
# ═══════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:17-alpine
    pull_policy: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-docbrain}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docbrain}"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    pull_policy: always
    environment:
      - discovery.type=single-node
      # WARNING: DISABLE_SECURITY_PLUGIN=true is for local development only.
      # For internet-facing or production deployments, remove this line and
      # configure OpenSearch TLS + authentication properly.
      # See: https://opensearch.org/docs/latest/security/
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    pull_policy: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    image: ghcr.io/docbrain-ai/docbrain:latest
    pull_policy: always
    platform: linux/amd64
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false     # create from .env.example first
    environment:
      # Config profile — matches config/production.yaml baked into the image
      APP_ENV: production
      # Infrastructure URLs — override .env values so containers talk to each other
      DATABASE_URL: postgresql://${POSTGRES_USER:-docbrain}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-docbrain}
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379
      SERVER_BIND: 0.0.0.0
      # CORS — set to your web UI domain in production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      # Auth session lifetime (30 days default)
      LOGIN_SESSION_TTL_HOURS: ${LOGIN_SESSION_TTL_HOURS:-720}
      # Scheduler intervals (can be overridden in .env)
      AUTOPILOT_GAP_ANALYSIS_INTERVAL_HOURS: ${AUTOPILOT_GAP_ANALYSIS_INTERVAL_HOURS:-6}
      FRESHNESS_SCHEDULER_INTERVAL_HOURS: ${FRESHNESS_SCHEDULER_INTERVAL_HOURS:-24}
      SEMANTIC_QUALITY_ENABLED: ${SEMANTIC_QUALITY_ENABLED:-true}
      SEMANTIC_QUALITY_INTERVAL_HOURS: ${SEMANTIC_QUALITY_INTERVAL_HOURS:-24}
      SEMANTIC_QUALITY_BUDGET: ${SEMANTIC_QUALITY_BUDGET:-50}
      CONSOLIDATION_INTERVAL_HOURS: ${CONSOLIDATION_INTERVAL_HOURS:-6}
      # Optional: uncomment to use a custom config directory
      # DOCBRAIN_CONFIG_DIR: /etc/docbrain
      # ── Governance SLA Checker ──
      SLA_CHECKER_INTERVAL_HOURS: ${SLA_CHECKER_INTERVAL_HOURS:-1}
      SLA_CHECKER_QUERY_TIMEOUT_SECS: ${SLA_CHECKER_QUERY_TIMEOUT_SECS:-30}
      SLA_CHECKER_MAX_CANDIDATES: ${SLA_CHECKER_MAX_CANDIDATES:-5000}
      SLA_CHECKER_MAX_EVENTS_PER_RUN: ${SLA_CHECKER_MAX_EVENTS_PER_RUN:-50}
      # ── External Connectors (HTTP Connector Protocol) ──
      CONNECTOR_ENABLED: ${CONNECTOR_ENABLED:-true}
      CONNECTOR_MAX_CONCURRENT_SYNCS: ${CONNECTOR_MAX_CONCURRENT_SYNCS:-3}
      CONNECTOR_FETCH_BATCH_SIZE: ${CONNECTOR_FETCH_BATCH_SIZE:-50}
      CONNECTOR_REQUEST_TIMEOUT_SECS: ${CONNECTOR_REQUEST_TIMEOUT_SECS:-30}
      CONNECTOR_SYNC_TIMEOUT_SECS: ${CONNECTOR_SYNC_TIMEOUT_SECS:-3600}
      CONNECTOR_CIRCUIT_BREAKER_THRESHOLD: ${CONNECTOR_CIRCUIT_BREAKER_THRESHOLD:-5}
      CONNECTOR_ALLOW_INTERNAL: ${CONNECTOR_ALLOW_INTERNAL:-false}
      # ── Webhooks (outbound event delivery) ──
      WEBHOOK_DELIVERY_TIMEOUT_SECONDS: ${WEBHOOK_DELIVERY_TIMEOUT_SECONDS:-10}
      WEBHOOK_MAX_RETRIES: ${WEBHOOK_MAX_RETRIES:-4}
      WEBHOOK_CIRCUIT_BREAKER_THRESHOLD: ${WEBHOOK_CIRCUIT_BREAKER_THRESHOLD:-10}
      ALLOW_INTERNAL_WEBHOOKS: ${ALLOW_INTERNAL_WEBHOOKS:-false}
      # ── Learning pipeline (Tier 2 — set in .env when trainer is enabled) ──
      # LEARNING_ENABLED: ${LEARNING_ENABLED:-false}
      # EMBED_PROVIDER: ${EMBED_PROVIDER:-bedrock}   # set to "local" to use fine-tuned models
      # LEARNING_TRAINER_URL: http://trainer:8765
      # LEARNING_BASE_MODEL_ID: ${LEARNING_BASE_MODEL_ID:-sentence-transformers/all-MiniLM-L6-v2}
      # LEARNING_LOCAL_PATH: /data/models  # must match TRAINER_LOCAL_MODEL_ROOT
      # LEARNING_STORAGE_BACKEND: ${LEARNING_STORAGE_BACKEND:-local}
    volumes:
      - ./examples/sample-docs:/data/docs:ro
      - ./docs:/app/docs:ro
      # Uncomment when trainer service is enabled (shared model volume):
      # - trainer_models:/data/models
    restart: unless-stopped

  web:
    image: ghcr.io/docbrain-ai/docbrain-web:latest
    pull_policy: always
    platform: linux/amd64
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      - server
    environment:
      NEXT_PUBLIC_DOCBRAIN_API_URL: http://localhost:${SERVER_PORT:-3000}
      PORT: 3001
    restart: unless-stopped

  # ── Embedding fine-tuning sidecar (Tier 2 — disabled by default) ──────────
  #
  # Uncomment to enable fine-tuning of the embedding model from user feedback.
  # Requires at least 2 vCPU / 8 GB RAM on the host. GPU optional.
  #
  # Steps to enable:
  #   1. Uncomment the trainer block below AND the trainer_models volume at the bottom.
  #   2. Set LEARNING_ENABLED=true in your .env.
  #   3. Set EMBED_PROVIDER=local in your .env (required to use fine-tuned models).
  #      If you use a cloud provider (bedrock, openai), models are trained but not served.
  #   4. Set TRAINER_API_KEY to a strong random secret (e.g. `openssl rand -hex 32`).
  #      The DocBrain server uses this key when calling the trainer sidecar.
  #      Never expose port 8765 publicly — keep it internal to the Docker network.
  #   5. IMPORTANT: LEARNING_LOCAL_PATH (server) and TRAINER_LOCAL_MODEL_ROOT (trainer)
  #      must point to the same shared volume (trainer_models:/data/models below).
  #      If they differ, promotions will silently fail to hot-swap the model.
  #
  # Base model selection:
  #   TRAINER_BASE_MODEL_NAME and LEARNING_BASE_MODEL_ID must match.
  #   Any sentence-transformers HuggingFace model works. Defaults to all-MiniLM-L6-v2.
  #   Change the default by setting both variables to the same model ID in your .env.
  #
  # See docs/learning.md for full setup and configuration reference.
  #
  # trainer:
  #   image: ghcr.io/docbrain-ai/docbrain-trainer:latest
  #   pull_policy: always
  #   # Do NOT publish port 8765 externally — the trainer API is internal only.
  #   # Remove the ports block if you don't need local debugging access.
  #   ports:
  #     - "127.0.0.1:8765:8765"   # loopback-only; remove in production
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-docbrain}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-docbrain}
  #     # Security — shared secret between the DocBrain server and this sidecar.
  #     # Generate with: openssl rand -hex 32
  #     TRAINER_API_KEY: ${TRAINER_API_KEY:?TRAINER_API_KEY must be set}
  #     # Base model — must match LEARNING_BASE_MODEL_ID on the server
  #     TRAINER_BASE_MODEL_NAME: ${TRAINER_BASE_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
  #     TRAINER_STORAGE_BACKEND: ${TRAINER_STORAGE_BACKEND:-local}
  #     # Path must match LEARNING_LOCAL_PATH on the server (both mount trainer_models volume below)
  #     TRAINER_LOCAL_MODEL_ROOT: /data/models
  #     TRAINER_EPOCHS: ${TRAINER_EPOCHS:-3}
  #     TRAINER_BATCH_SIZE: ${TRAINER_BATCH_SIZE:-16}
  #     TRAINER_MAX_SEQ_LENGTH: ${TRAINER_MAX_SEQ_LENGTH:-256}
  #     TRAINER_WARMUP_STEPS: ${TRAINER_WARMUP_STEPS:-100}
  #     TRAINER_QUANTIZE_ONNX: ${TRAINER_QUANTIZE_ONNX:-false}
  #     TRAINER_ONNX_OPSET: ${TRAINER_ONNX_OPSET:-17}
  #     TRAINER_MIN_TRIPLETS: ${TRAINER_MIN_TRIPLETS:-200}
  #     TRAINER_CIRCUIT_BREAKER_THRESHOLD: ${TRAINER_CIRCUIT_BREAKER_THRESHOLD:-0.05}
  #     TRAINER_MAX_SINGLE_USER_FRACTION: ${TRAINER_MAX_SINGLE_USER_FRACTION:-0.80}
  #     TRAINER_POISON_DETECTION_ENABLED: ${TRAINER_POISON_DETECTION_ENABLED:-true}
  #     # Object storage — configure one of: s3, gcs, azure, or leave as local
  #     # TRAINER_S3_BUCKET: ${TRAINER_S3_BUCKET:-}
  #     # TRAINER_S3_PREFIX: ${TRAINER_S3_PREFIX:-docbrain/models}
  #     # TRAINER_S3_REGION: ${TRAINER_S3_REGION:-us-east-1}
  #     # TRAINER_GCS_BUCKET: ${TRAINER_GCS_BUCKET:-}
  #     # TRAINER_GCS_PREFIX: ${TRAINER_GCS_PREFIX:-docbrain/models}
  #     # TRAINER_AZURE_CONTAINER: ${TRAINER_AZURE_CONTAINER:-}
  #     # TRAINER_AZURE_CONNECTION_STRING: ${TRAINER_AZURE_CONNECTION_STRING:-}
  #   volumes:
  #     - trainer_models:/data/models
  #   restart: unless-stopped

volumes:
  postgres_data:
  opensearch_data:
  redis_data:
  # trainer_models:     # Uncomment when trainer service is enabled
