# Seed batch — management-style questions for v1 ship gate.
#
# Each case is a (question, rubric) tuple. The shadow-run grader and v1
# ship gate evaluator ask DocBrain the question
# through the live pipeline (with MCP tools enabled), capture the
# answer, then grade it with the judge framework.
#
# Pass criteria for v1 ship gate:
#   pass_count >= baseline_pre_mcp (recorded in tests/qa-judges/runs/baseline-pre-mcp.json)
#
# Rubric authoring guidelines:
# - expected_facts: PROPOSITIONAL truths the answer should reflect. Phrase
#   them as standalone claims, not phrases that must literally appear.
#   "PLAT-35 is the blocker" — good. "PLAT-35" — bad.
# - forbidden_claims: things the answer must NOT assert. Catch known
#   regressions (e.g. an old wrong answer) and category-1 false positives.
# - Keep each fact/claim concise — judge model is Haiku 4.5 with limited
#   context for the verdict. ~80 characters max per item.
# - 2-5 expected_facts per case is the sweet spot. >5 is hard to grade.
#
# Operator note:
# This file ships with TWO starter cases scaffolded. The
# remaining 8 are marked TODO and must be authored against your operational
# reality before the shadow run can produce a meaningful baseline.
# Each TODO block has the structural skeleton — fill in question + facts +
# forbidden claims, then remove the TODO marker.

cases:
  - id: helm_migration_blocker
    question: "What is blocking the helm migration this week?"
    expected_facts:
      - "PLAT-35 is the current blocker"
      - "Alex is the assignee or owner of the blocking work"
    forbidden_claims:
      - "Jordan worked on the blocking ticket"
    judge_model: claude-haiku-4-5
    notes: |
      Live-tool dependency: jira.search or jira.get_issue must surface
      PLAT-35's current state. The pre-MCP path (JiraEnricher)
      handled this via ingest-time enrichment.

  - id: plat_35_status
    question: "What is the status of PLAT-35?"
    expected_facts:
      - "answer reflects the CURRENT Jira status (not stale ingest-time data)"
    forbidden_claims: []
    judge_model: claude-haiku-4-5
    notes: |
      Calibration target: this is the canonical test that proves the
      shadow run is reading live data, not the baked-in [Status: ...]
      annotation from the legacy JiraEnricher. If this answers "In
      Progress" when Jira says "Done", the live-tool path is broken.

