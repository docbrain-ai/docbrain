[package]
name = "docbrain-knowledge"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false
description = "The open evaluator of .knowledge/ records: parsing, check and record states, routing, the two-rule gate."

[lib]
name = "docbrain_knowledge"

[dependencies]
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
yaml-rust2 = { version = "=0.8.1", default-features = false }
toml_edit = { version = "=0.22.27", default-features = false, features = ["parse"] }
hcl-edit = "=0.10.0"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
base64 = "0.22"
tempfile = "3"
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
