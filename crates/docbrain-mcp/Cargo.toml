[package]
name = "docbrain-mcp"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
name = "docbrain_mcp"
path = "src/lib.rs"

[[bin]]
name = "docbrain-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
axum = "0.8"
# Scratch working directories for the --docbrain-env tests (#603).
tempfile = "3"
# The TLS stub of the CA-file sentinel (#603); already in the build through reqwest.
native-tls = "0.2"
