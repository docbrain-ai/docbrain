[package]
name = "docbrain-cli"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
dotenvy = "0.15"
serde_json = "1"
dirs = "5"
futures-util = "0.3"
rpassword = "7"
open = "5"

