# ═══════════════════════════════════════════════════════════════════════════
# DocBrain — Default Configuration
# ═══════════════════════════════════════════════════════════════════════════
# This file contains safe defaults for all settings.
# Override in config/development.yaml, config/production.yaml, or via
# environment variables (env vars always win).
#
# ${ENV_VAR} and ${ENV_VAR:-default} syntax is supported in all values.
# Sensitive values (API keys, passwords) should ALWAYS come from env vars.
# ═══════════════════════════════════════════════════════════════════════════

server:
  host: "127.0.0.1"   # Use 0.0.0.0 in Docker/production
  port: 3000
  cors_allowed_origins: "http://localhost:3001"
  max_query_length: 4000

database:
  # url: set DATABASE_URL env var (required — no default)
  max_connections: 10
  connect_timeout_secs: 10
  acquire_timeout_secs: 10
  idle_timeout_secs: 300

opensearch:
  url: "http://localhost:9200"
  # index: "docbrain-chunks"          # default applied in code
  # episode_index: "docbrain-episodes" # default applied in code

redis:
  url: "redis://127.0.0.1:6379"

llm:
  provider: "bedrock"   # bedrock | anthropic | openai | ollama
  # model_id: ~          # defaults to provider-appropriate model
  # fast_model_id: ~    # optional fast/cheap model for side-calls (Bedrock: claude-haiku, OpenAI: gpt-4o-mini)
  # ingest_model_id: ~   # cheaper model for ingest image extraction (falls back to model_id)
  # thinking_budget: ~   # extended thinking tokens, 0 = disabled
  ollama_base_url: "http://localhost:11434"
  # anthropic_api_key: ~  # set ANTHROPIC_API_KEY env var
  # openai_api_key: ~     # set OPENAI_API_KEY env var
  # openai_base_url: ~    # optional OpenAI-compatible base URL

embeddings:
  # provider: ~   # defaults to llm.provider
  # model_id: ~   # defaults to provider-appropriate model

rag:
  cache_threshold: 0.95   # Min cosine similarity for cache hit
  cache_ttl_hours: 24     # Cache max age in hours
  # search_min_score: ~   # Min relevance for search results (default: 0.0)

rbac:
  # Default role for new SSO users.
  # Role hierarchy: viewer (1) < editor (2) < analyst (3) < admin (4)
  defaultRole: "viewer"
  # Email domain that always gets admin role (e.g. "acme.com")
  # adminEmails: ~
  # Comma-separated IdP group names → analyst role (reserved for future use).
  # analystGroups: ~

# Where to publish AI-generated drafts (optional).
# When configured, the "Publish" button in the UI and auto-draft loop will push
# docs directly to the target system and trigger re-ingest automatically.
draft_publish:
  target: "none"           # "confluence" | "none"
  # confluence_space_key: ~      # Space key to create pages in (e.g. "SAAS")
  # confluence_parent_page_id: ~ # Optional parent page ID
  auto_ingest_after_publish: true   # Re-ingest the created page so DocBrain learns from it

autopilot:
  enabled: false          # Opt-in. Set AUTOPILOT_ENABLED=true to enable.
  cluster_threshold: 0.82
  min_cluster_size: 3
  min_unique_users: 2
  min_negative_ratio: 0.15
  lookback_days: 30
  max_clusters_per_run: 50
  max_episodes_per_run: 500
  gap_analysis_interval_hours: 6
  # Auto-draft: automatically generate drafts for qualifying gaps after each analysis run.
  # Manual by default — enable to let DocBrain draft docs without human trigger.
  auto_draft_enabled: false
  # Minimum severity to auto-draft: critical | high | medium | low
  auto_draft_severity: "critical"
  # Severity scoring thresholds — tune for your org's signal volume.
  # critical_users / critical_signals define the scale at which breadth/volume scores hit 1.0.
  # threshold_* define the composite score cutoffs for each severity band.
  critical_users: 5         # Unique users needed for full breadth score
  critical_signals: 15      # Negative signals needed for full volume score
  threshold_critical: 0.75  # Composite score >= this → "critical"
  threshold_high: 0.55      # Composite score >= this → "high"
  threshold_medium: 0.35    # Composite score >= this → "medium"

freshness:
  scheduler_interval_hours: 24
  contradiction_checks_per_pass: 10   # Max docs checked for contradictions per freshness run (LLM cost)
  contradiction_include_recent_event_docs: true   # Include recent Slack/PR/Jira docs in contradiction pass
  contradiction_event_doc_max_age_days: 90        # Only event-based docs edited within N days are eligible

memory:
  consolidation_interval_hours: 6

auth:
  session_ttl_hours: 720   # 30 days. Set to 0 for non-expiring sessions.

confluence:
  # base_url: ~         # set CONFLUENCE_BASE_URL env var
  # user_email: ~       # set CONFLUENCE_USER_EMAIL env var
  # api_token: ~        # set CONFLUENCE_API_TOKEN env var
  # space_keys: ~       # set CONFLUENCE_SPACE_KEYS env var
  # api_version: "v2"   # "v2" (Cloud) or "v1" (Data Center)
  # webhook_secret: ~   # set CONFLUENCE_WEBHOOK_SECRET env var
  # tls_verify: true    # set CONFLUENCE_TLS_VERIFY=false for self-signed certs

slack:
  # bot_token: ~                   # set SLACK_BOT_TOKEN env var
  # signing_secret: ~              # set SLACK_SIGNING_SECRET env var
  notification_interval_hours: 24
  # notification_space_filter: ~   # optional space filter for notifications

ingest:
  self_ingest: true
  image_extraction_enabled: true
  # ── Scheduled ingest sources (DISABLED by default) ──────────────────────
  # The docbrain-ingest binary is a standalone CLI, not a background job.
  # It does not run automatically unless you wire it to a cron job or
  # docker-compose scheduled service.
  #
  # To enable scheduled ingestion:
  #   1. Set ingest_sources to the sources you want:
  #        ingest_sources: confluence,github_pr,slack_thread
  #   2. Run docbrain-ingest on a schedule (cron, systemd timer, etc.):
  #        # example cron — run every 6 hours
  #        0 */6 * * * docker compose exec -T server docbrain-ingest
  #   3. Or trigger manually at any time:
  #        docker compose exec server docbrain-ingest
  #
  # ingest_sources: ~   # disabled — set to: local, confluence, github, github_pr, slack_thread, jira, ms_teams, etc.

# ── GitHub PR + Review Comments (batch ingest) ───────────────────────────────
github_pr:
  # token: ~             # secret — set in config/local.yaml or GITHUB_PR_TOKEN env var
  # repo: ~              # owner/repo format e.g. acme/platform
  lookback_days: 365
  min_comments: 1
  # labels: ~            # comma-separated label filter — empty = all PRs
  # api_url: ~           # override for GitHub Enterprise (default: https://api.github.com)

# ── GitHub Real-Time Capture ───────────────────────────────────────────────
# Enables `@docbrain capture` on GitHub PRs/issues.
# Both fields are required; if either is missing, the route is not registered.
github_capture:
  # webhook_secret: ~   # set GITHUB_WEBHOOK_SECRET env var
  # bot_token: ~        # set GITHUB_BOT_TOKEN env var (or GITHUB_PR_TOKEN as fallback)

# ── GitLab MR + Review Notes (batch ingest) ──────────────────────────────────
gitlab_mr:
  # token: ~             # secret — set in config/local.yaml or GITLAB_MR_TOKEN env var
  base_url: "https://gitlab.com"   # override for self-hosted
  # project_ids: ~       # comma-separated namespace/repo paths e.g. acme/platform,acme/backend
  lookback_days: 365
  min_notes: 1
  # labels: ~            # comma-separated label filter — empty = all MRs
  tls_verify: true       # set false for self-hosted with self-signed certs

# ── GitLab MR Real-Time Capture ───────────────────────────────────────────
# Enables `@docbrain capture` on GitLab MRs via POST /api/v1/gitlab/events.
# At least one of webhook_secret or token must be set; if neither is present,
# the route is not registered.
gitlab_capture:
  # webhook_secret: ~        # set GITLAB_CAPTURE_WEBHOOK_SECRET env var (X-Gitlab-Token validation)
  # token: ~                 # set GITLAB_CAPTURE_TOKEN env var (PAT with api scope — fetch notes + post replies)
  base_url: "https://gitlab.com"  # override for self-hosted: GITLAB_CAPTURE_BASE_URL
  # allowed_users: ~         # set GITLAB_CAPTURE_ALLOWED_USERS (comma-separated; empty = all)
  # allowed_projects: ~      # set GITLAB_CAPTURE_ALLOWED_PROJECTS (comma-separated group/project; empty = all)

# ── Slack Thread Ingest ───────────────────────────────────────────────────────
slack_ingest:
  # token: ~             # secret — set in config/local.yaml or SLACK_INGEST_TOKEN env var
  # channels: ~          # comma-separated channel IDs e.g. C01234,C56789
  min_replies: 3
  reactions: "white_check_mark,bookmark"
  lookback_days: 90

# ── Linear Issue Ingest ───────────────────────────────────────────────────────
linear:
  # api_key: ~          # secret — set in config/local.yaml or LINEAR_API_KEY env var
  # teams: ~            # comma-separated team keys e.g. ENG,OPS — empty = all teams
  lookback_days: 365
  states: "Done,Cancelled,Duplicate"

# ── Jira Issue Ingest ─────────────────────────────────────────────────────────
jira_ingest:
  # base_url: ~          # secret — set in config/local.yaml or JIRA_BASE_URL env var
  # user_email: ~        # secret — set in config/local.yaml or JIRA_USER_EMAIL env var
  # api_token: ~         # secret — set in config/local.yaml or JIRA_API_TOKEN env var
  # projects: ~          # comma-separated project keys e.g. ENG,OPS — empty = all
  # jql_filter: ~        # optional extra JQL clause
  lookback_days: 365
  issue_types: "Bug,Story,Task,Epic"

# ── PagerDuty Incident Ingest ─────────────────────────────────────────────────
pagerduty:
  # api_token: ~         # secret — set in config/local.yaml or PAGERDUTY_API_TOKEN env var
  lookback_days: 180
  min_duration_minutes: 5
  # services: ~          # comma-separated service IDs to filter — empty = all

# ── OpsGenie Alert Ingest ─────────────────────────────────────────────────────
opsgenie:
  # api_key: ~           # secret — set in config/local.yaml or OPSGENIE_API_KEY env var
  lookback_days: 180
  min_duration_minutes: 5
  # teams: ~             # comma-separated team names to filter — empty = all

# ── Zendesk Ticket Ingest ──────────────────────────────────────────────────────
zendesk:
  # subdomain: ~         # your-company (before .zendesk.com) — set ZENDESK_SUBDOMAIN
  # email: ~             # agent email for Basic Auth — set ZENDESK_EMAIL
  # api_token: ~         # secret — set in config/local.yaml or ZENDESK_API_TOKEN env var
  lookback_days: 180
  # min_rating: ~        # "good" | "bad" | empty (include all) — set ZENDESK_MIN_RATING

# ── Microsoft Teams Ingest ────────────────────────────────────────────────────
# Requires an Azure Entra (Azure AD) app registration with application
# permissions: Team.ReadBasic.All, Channel.ReadBasic.All, ChannelMessage.Read.All,
# Chat.Read.All (optional), Files.Read.All, OnlineMeetingTranscript.Read.All (optional).
# Tenant admin must grant consent for the app.
ms_teams:
  # tenant_id: ~        # secret — set MS_TEAMS_TENANT_ID env var
  # client_id: ~        # secret — set MS_TEAMS_CLIENT_ID env var
  # client_secret: ~    # secret — set MS_TEAMS_CLIENT_SECRET env var
  # teams: ~            # comma-separated team names/IDs to filter — empty = all
  lookback_days: 90
  include_chats: false         # 1:1/group chats — high volume, enable with care
  include_files: true          # channel files from SharePoint
  include_transcripts: true    # meeting transcripts (requires app access policy)
  min_replies: 2               # minimum replies for channel thread to be indexed

# ── Intercom Conversation Ingest ───────────────────────────────────────────────
intercom:
  # access_token: ~      # secret — set in config/local.yaml or INTERCOM_ACCESS_TOKEN env var
  lookback_days: 180
  min_messages: 2
  # tags: ~              # comma-separated tag names to filter — empty = all

# ── Documentation Analytics ──────────────────────────────────────────────────
# Tracks organizational documentation health — gap resolution rate, knowledge
# half-life, tribal knowledge %, and ROI of documentation investment.
# Snapshots are taken daily during memory consolidation.
velocity:
  minutes_saved_per_query: 15   # VELOCITY_MINUTES_SAVED_PER_QUERY — estimated eng time saved per answered query
  hourly_rate: 75               # VELOCITY_HOURLY_RATE — hourly engineer cost (USD) for ROI calculation

# ── Knowledge Stream (proactive push intelligence) ────────────────────────────
# Detects and pushes: incident early warnings, knowledge decay risks,
# expertise gaps, and context-aware doc updates.
# Disabled by default — enable when ready for proactive alerting.
stream:
  enabled: false                    # STREAM_ENABLED — opt-in
  interval_minutes: 30              # STREAM_INTERVAL_MINUTES — scan interval
  incident_warning_min_users: 2     # STREAM_INCIDENT_WARNING_MIN_USERS
  # alert_channel: ~                # STREAM_ALERT_CHANNEL — Slack channel for alerts (optional)
  expertise_gap_days: 90            # STREAM_EXPERTISE_GAP_DAYS — days inactive before gap alert

# ── Event Bus (internal pub/sub) ──────────────────────────────────────────
# Always enabled — foundational infrastructure for all subsystem communication.
# Events are broadcast to subscribers (logger, metrics, SSE) in real time.
event_bus:
  capacity: 4096                    # EVENT_BUS_CAPACITY — broadcast channel buffer size (max: 65536)
  retention_days: 90                # EVENT_LOG_RETENTION_DAYS — days to keep events in event_log table

# ── Knowledge Fragments ─────────────────────────────────────────────────────
# First-class knowledge units with provenance. Captured from PRs, commits,
# IDE annotations, conversations, CI/CD, and manual entry.
# Confidence-based routing: auto-index (≥ threshold), review queue, or discard.
fragments:
  auto_index_threshold: 0.7         # FRAGMENT_AUTO_INDEX_THRESHOLD — min confidence to auto-index into search
  review_threshold: 0.4             # FRAGMENT_REVIEW_THRESHOLD — min confidence for review queue (below = discard)
  max_content_length: 10000         # FRAGMENT_MAX_CONTENT_LENGTH — max fragment content in characters

# ── Webhooks ──────────────────────────────────────────────────────────────
# Outbound webhook subscriptions for integrating DocBrain events with
# external systems (Slack bots, CI/CD, PagerDuty, custom dashboards, etc.).
# All settings are env-var driven — uncomment the block below for reference.
# webhooks:
#   delivery_timeout_seconds: ${WEBHOOK_DELIVERY_TIMEOUT_SECONDS:-10}
#   max_retries: ${WEBHOOK_MAX_RETRIES:-4}
#   circuit_breaker_threshold: ${WEBHOOK_CIRCUIT_BREAKER_THRESHOLD:-10}
#   allow_internal: ${ALLOW_INTERNAL_WEBHOOKS:-false}
