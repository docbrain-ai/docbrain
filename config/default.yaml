# ═══════════════════════════════════════════════════════════════════════════
# DocBrain — Default Configuration
# ═══════════════════════════════════════════════════════════════════════════
# This file contains safe defaults for all settings.
# Override in config/development.yaml, config/production.yaml, or via
# environment variables (env vars always win).
#
# ${ENV_VAR} and ${ENV_VAR:-default} syntax is supported in all values.
# Sensitive values (API keys, passwords) should ALWAYS come from env vars.
# ═══════════════════════════════════════════════════════════════════════════

server:
  host: "127.0.0.1"   # Use 0.0.0.0 in Docker/production
  port: 3000
  cors_allowed_origins: "http://localhost:3001"
  max_query_length: 4000

database:
  # url: set DATABASE_URL env var (required — no default)
  max_connections: 10
  connect_timeout_secs: 10
  acquire_timeout_secs: 10
  idle_timeout_secs: 300

opensearch:
  url: "http://localhost:9200"
  # index: "docbrain-chunks"          # default applied in code
  # episode_index: "docbrain-episodes" # default applied in code

redis:
  url: "redis://127.0.0.1:6379"

llm:
  provider: "bedrock"   # bedrock | anthropic | openai | ollama
  # model_id: ~          # defaults to provider-appropriate model
  # fast_model_id: ~    # optional fast/cheap model for side-calls (Bedrock: claude-haiku, OpenAI: gpt-4o-mini)
  # ingest_model_id: ~   # cheaper model for ingest image extraction (falls back to model_id)
  # thinking_budget: ~   # extended thinking tokens, 0 = disabled
  ollama_base_url: "http://localhost:11434"
  # anthropic_api_key: ~  # set ANTHROPIC_API_KEY env var
  # openai_api_key: ~     # set OPENAI_API_KEY env var
  # openai_base_url: ~    # optional OpenAI-compatible base URL

embeddings:
  # provider: ~   # defaults to llm.provider
  # model_id: ~   # defaults to provider-appropriate model

rag:
  cache_threshold: 0.95   # Min cosine similarity for cache hit
  cache_ttl_hours: 24     # Cache max age in hours
  # search_min_score: ~   # Min relevance for search results (default: 0.0)

  # ── Staged retrieval pipeline tuning ─────────────────────────────────
  # Every field below has a sensible default baked into the code; uncomment
  # only to override. Also configurable via the environment variables listed
  # in .env.example and docs/configuration.md.
  #
  # top_k: 10                         # Chunks sent to the LLM
  # bm25_boost: 1.0                   # BM25 vs vector weight in hybrid
  # candidate_pool_size: 200          # Pool fed to the reranker
  # rrf_k: 60                         # RRF damping constant (canonical paper)
  # max_per_source: 3                 # Per-source cap in final top-k
  # max_per_document: 2               # Per-document cap in final top-k
  #
  # ── Grounding floors — calibrated for a real cross-encoder reranker ──
  #
  # These four values are the single biggest quality lever in the RAG
  # pipeline. They all gate on the reranker's calibrated [0, 1] score.
  # Recommended defaults below match where Cohere Rerank v3.5 and
  # similarly tuned cross-encoders separate "actually answers the
  # question" from "shares a few keywords but is not on-topic".
  #
  # Lowering → more recall, noisier citations, higher hallucination risk.
  # Raising  → more precision, more "insufficient information" answers.
  #
  # If `rerank.provider = "none"` these gate on raw BM25/vector scores
  # which are NOT calibrated — set them to 0.0 in that mode. See
  # docs/rerank-providers.md § "Tuning the grounding floors" for the
  # full explanation.
  min_relevance_score: 0.40           # Retrieval floor — chunks below this never reach diversity selection or the LLM. Lowering sends weaker evidence to the LLM (hallucination risk).
  display_floor: 0.50                 # Display floor — chunks below this are never shown as citations. Lowering surfaces more tangential sources (user trust cost).
  confidence_gate: 0.40                # Confidence gate — below this, sources are hidden and the answer is shown as "general knowledge". Lowering shows sources on lower-confidence answers.
  strong_answer_floor: 0.55           # Strong-answer floor — top-1 rerank score required before the answer is emitted without a "low confidence" disclaimer.
  # ── Tool-output caps (the truncation chain) ───────────────────────────
  # Three coordinated caps bound how much raw tool output reaches the
  # synthesis prompt. They MUST rise together — raising one alone has no
  # effect because the smallest still truncates. Defaults let a high-volume
  # search (which can return 43-63KB raw) keep ~32KB instead of being cut to
  # a fraction. The two mcp_* values are also read from the matching
  # DOCBRAIN_MCP_* env vars by the manifest validator, so override the env
  # var (not just this YAML) when tuning them.
  # mcp_output_ceiling_bytes: 32768          # Hard ceiling the manifest validator enforces on any per-tool cap
  # mcp_default_tool_output_cap_bytes: 32768 # Cap inherited by dynamically-discovered tools (must be ≤ ceiling)
  # evidence_buffer_cap_bytes: 65536         # SHARED per-loop-round evidence budget (2x the per-tool cap)
  # mcp_jql_recency_bound_days: 180          # Recency window appended to unbounded full-text Jira searches (avoids 10s timeouts)
  # freshness_window_days: 7          # Freshness retriever window (0 to disable)
  # entity_cache_ttl_secs: 300        # Entity → space cache TTL
  # max_rewrites: 2                   # Query rewrites per ask (0 to disable)
  # max_chunks_per_doc_in_retriever: 2  # Phase 2 chunk-flood fix — per-retriever cap
  # fresh_only_phrases:               # Time-sensitive question phrases — a match means
  #   - "on call"                     # the answer comes ONLY from this request's live
  #   - "current rotation"            # tool data; a prior answer is never reused (so a
  #   - "incident commander"          # rotation that changed since yesterday can't leak
  #                                   # a stale name). Empty list disables the gate.
  #
  # Compound query decomposition (Phase 5) is gated on RAG_COMPOUND_DECOMPOSE
  # (env only, default true). Not a RagConfig struct field because it's a
  # behavior flag, not a numeric tunable.

  # ── Confidence-retry fallback (intelligent tool fan-out on weak answers) ──
  #
  # When a /ask first pass returns very-low confidence AND the user has
  # unused MCP tools in their eligible catalog, optionally re-run once
  # with the picker in widen-mode (encouraging maximal tool selection).
  # The retry's tool set is a strict superset of the first pass — never
  # narrower. The retry's answer ALWAYS replaces the first-pass answer
  # when the gate triggers (we trust the broader sweep when confidence
  # was very low).
  #
  # Default OFF — opt in per deployment. When enabled, doubles
  # worst-case latency on the small fraction of queries that fall
  # below threshold AND have unused tools. High-confidence answers
  # are never retried.
  #
  # Configured via environment variables (NOT this YAML — env-only so
  # an ops change can flip it without a redeploy):
  #
  #   RAG_CONFIDENCE_RETRY_ENABLED            true | 1 | yes | on
  #   RAG_CONFIDENCE_RETRY_THRESHOLD          0.0–1.0 (default 0.25)
  #   RAG_CONFIDENCE_RETRY_LATENCY_BUDGET_MS  1000–60000 (default 12000)
  #
  # Gate logic (ALL must hold to trigger retry):
  #   1. Env flag is on
  #   2. First-pass confidence < threshold
  #   3. First-pass dispatched fewer tools than the eligible catalog
  #   4. First-pass elapsed_ms <= latency budget
  #
  # See docs/configuration.md § "Confidence-retry fallback" for tuning
  # guidance and observability.
  #
  # Agentic tool loop. Default OFF. Generalizes the confidence-retry
  # above into a bounded MULTI-round tool loop with per-surface round
  # and wall-clock budgets. When the master switch is on, the loop
  # SUBSUMES the confidence-retry (the loop runs instead of the single
  # retry). Same env-only, no-redeploy contract; unset → silent default,
  # set-but-invalid → warn + default:
  #   RAG_AGENTIC_LOOP_ENABLED               true | 1 | yes | on (default false)
  #   RAG_AGENTIC_LOOP_MAX_ROUNDS_SLACK      1–10 (default 5)
  #   RAG_AGENTIC_LOOP_MAX_ROUNDS_WEB        1–10 (default 4)
  #   RAG_AGENTIC_LOOP_BUDGET_MS_SLACK       1000–120000 (default 60000)
  #   RAG_AGENTIC_LOOP_BUDGET_MS_WEB         1000–120000 (default 30000)
  #   RAG_AGENTIC_LOOP_CONFIDENCE_THRESHOLD  0.0–1.0 (default 0.7; unset →
  #                                          falls back to RAG_CONFIDENCE_RETRY_THRESHOLD)

  # ── Feedback → source-suppression learning loop ─────────────────────────
  #
  # When a user marks a SPECIFIC source within an answer as not-relevant
  # (per-source thumbs-down on web/CLI/Slack), this down-ranks that document in
  # retrieval for SIMILAR future questions. "Similar" reuses the episodes
  # already recalled on the hot path (no extra embedding). Threshold-gated so a
  # single click can't unilaterally bury a document; a document is suppressed
  # when it crosses EITHER gate. Set both min_* to 0 to disable entirely.
  #
  #   RAG_SUPPRESSION_MIN_FEEDBACK_COUNT   total not-relevant events (default 2)
  #   RAG_SUPPRESSION_MIN_UNIQUE_USERS     distinct users (default 2)
  #   RAG_SUPPRESSION_RAG_PENALTY_FACTOR   score multiplier (default 0.1)
  suppression:
    min_feedback_count: 2
    min_unique_users: 2
    rag_penalty_factor: 0.1

# ── Reranker (stage 3 of the retrieval pipeline) ──────────────────────────
#
# The reranker takes the candidate pool from stage 2 and rescores each
# (query, chunk) pair with a cross-encoder, producing calibrated scores in
# [0, 1] that drive the downstream grounding floors.
#
# DocBrain ships with plug-and-play support for every major hosted rerank
# API through a single HTTP client parameterised by a "dialect". Built-in
# dialects: cohere, voyage, jina, mixedbread, pinecone. Unknown APIs can be
# wired via `provider: custom` with the custom_* fields below — no rebuild
# required.
#
# See docs/rerank-providers.md for the full provider matrix and the
# "how to add a new provider in 2 minutes" recipe.
rerank:
  provider: "none"        # none | bedrock | cohere | voyage | jina | mixedbread | pinecone | ollama | custom
  # model_id: ~           # Provider-specific default applies when unset.
  top_n: 200              # Max candidates handed to the reranker per call.
  batch_size: 100         # Split larger pools into batches of this size.
  timeout_secs: 10        # Per-request timeout on the critical path.
  #
  # Provider API keys (set via env vars in production — never commit secrets):
  # cohere_api_key: ~     # COHERE_RERANK_API_KEY
  # voyage_api_key: ~     # VOYAGE_API_KEY
  # jina_api_key: ~       # JINA_API_KEY
  # mixedbread_api_key: ~ # MIXEDBREAD_API_KEY
  # pinecone_api_key: ~   # PINECONE_API_KEY
  #
  # Ollama (local, no key):
  # ollama_base_url: "http://localhost:11434"  # RAG_RERANK_OLLAMA_BASE_URL
  #
  # ── provider: "custom" — plug-and-play for any Cohere-family rerank API ──
  # Set `provider: custom` and fill these fields to wire a new rerank
  # provider without a rebuild. Defaults match Cohere's request/response
  # shape; override any field whose JSON key differs.
  #
  # custom_base_url: "https://api.example.test/v1/rerank"   # RAG_RERANK_CUSTOM_BASE_URL   (required)
  # custom_api_key_env: "EXAMPLE_RERANK_API_KEY"            # RAG_RERANK_CUSTOM_API_KEY_ENV (required)
  # custom_auth_style: "bearer_token"                       # RAG_RERANK_CUSTOM_AUTH_STYLE  (or "custom_header")
  # custom_auth_header_name: "Api-Key"                      # RAG_RERANK_CUSTOM_AUTH_HEADER_NAME (only when custom_header)
  # custom_documents_field: "documents"                     # RAG_RERANK_CUSTOM_DOCUMENTS_FIELD
  # custom_top_n_field:    "top_n"                          # RAG_RERANK_CUSTOM_TOP_N_FIELD
  # custom_results_field:  "results"                        # RAG_RERANK_CUSTOM_RESULTS_FIELD
  # custom_score_field:    "relevance_score"                # RAG_RERANK_CUSTOM_SCORE_FIELD

rbac:
  # Default role for new SSO users.
  # Role hierarchy: viewer (1) < editor (2) < analyst (3) < admin (4)
  defaultRole: "viewer"
  # Email domain that always gets admin role (e.g. "acme.com")
  # adminEmails: ~
  # Comma-separated IdP group names → analyst role (reserved for future use).
  # analystGroups: ~

# Where to publish AI-generated drafts (optional).
# When configured, the "Publish" button in the UI and auto-draft loop will push
# docs directly to the target system and trigger re-ingest automatically.
# Supports multi-target publishing: Confluence (default), GitHub (PR-based), GitLab (MR-based).
# Per-space routing is managed via the publish_targets DB table (API: /api/v1/publish-targets).
draft_publish:
  target: "none"           # "confluence" | "github" | "gitlab" | "none"
  # confluence_space_key: ~      # Space key to create pages in (e.g. "SAAS")
  # confluence_parent_page_id: ~ # Optional parent page ID
  auto_ingest_after_publish: true   # Re-ingest the created page so DocBrain learns from it

# ── GitHub Draft Publishing (optional) ──────────────────────────────────────
# Publish AI-generated drafts as GitHub Pull Requests with markdown files.
# Set draft_publish.target to "github" or use per-space routing via the API.
github_publish:
  # token: ~               # secret — set GITHUB_PUBLISH_TOKEN env var (requires repo scope)
  # repo: ~                # owner/repo format e.g. acme/docs — set GITHUB_PUBLISH_REPO env var
  branch: "main"           # GITHUB_PUBLISH_BRANCH — target branch for PRs
  docs_path: "docs"        # GITHUB_PUBLISH_DOCS_PATH — directory in repo for doc files
  pr_labels: "docbrain,auto-generated"  # GITHUB_PUBLISH_PR_LABELS — comma-separated PR labels
  create_pr: true          # GITHUB_PUBLISH_CREATE_PR — create PR (true) or direct commit (false)
  # api_url: ~             # GITHUB_PUBLISH_API_URL — override for GitHub Enterprise

# ── GitLab Draft Publishing (optional) ──────────────────────────────────────
# Publish AI-generated drafts as GitLab Merge Requests with markdown files.
# Set draft_publish.target to "gitlab" or use per-space routing via the API.
gitlab_publish:
  # token: ~               # secret — set GITLAB_PUBLISH_TOKEN env var (requires api scope)
  # project_id: ~          # numeric project ID — set GITLAB_PUBLISH_PROJECT_ID env var
  # base_url: ~            # GITLAB_PUBLISH_BASE_URL — default: https://gitlab.com
  branch: "main"           # GITLAB_PUBLISH_BRANCH — target branch for MRs
  docs_path: "docs"        # GITLAB_PUBLISH_DOCS_PATH — directory in project for doc files
  mr_labels: "docbrain,auto-generated"  # GITLAB_PUBLISH_MR_LABELS — comma-separated MR labels
  create_mr: true          # GITLAB_PUBLISH_CREATE_MR — create MR (true) or direct commit (false)

autopilot:
  enabled: false          # Opt-in. Set AUTOPILOT_ENABLED=true to enable.
  cluster_threshold: 0.82
  min_cluster_size: 3
  min_unique_users: 2
  min_negative_ratio: 0.15
  lookback_days: 30
  max_clusters_per_run: 50
  max_episodes_per_run: 500
  gap_analysis_interval_hours: 6
  # Auto-draft: automatically generate drafts for qualifying gaps after each analysis run.
  # Manual by default — enable to let DocBrain draft docs without human trigger.
  auto_draft_enabled: false
  # Minimum severity to auto-draft: critical | high | medium | low
  auto_draft_severity: "critical"
  # Severity scoring thresholds — tune for your org's signal volume.
  # critical_users / critical_signals define the scale at which breadth/volume scores hit 1.0.
  # threshold_* define the composite score cutoffs for each severity band.
  critical_users: 5         # Unique users needed for full breadth score
  critical_signals: 15      # Negative signals needed for full volume score
  threshold_critical: 0.75  # Composite score >= this → "critical"
  threshold_high: 0.55      # Composite score >= this → "high"
  threshold_medium: 0.35    # Composite score >= this → "medium"

freshness:
  scheduler_interval_hours: 24
  contradiction_checks_per_pass: 10   # Max docs checked for contradictions per freshness run (LLM cost)
  contradiction_include_recent_event_docs: true   # Include recent Slack/PR/Jira docs in contradiction pass
  contradiction_event_doc_max_age_days: 90        # Only event-based docs edited within N days are eligible

  # ── Event-based source types ───────────────────────────────────────────
  # Sources whose docs are permanent historical records (incident threads,
  # merged PRs, support tickets). For these, time_decay is always 100 and
  # LLM/link/contradiction passes are skipped. Capture sources are NOT here
  # — design discussions DO go stale as systems evolve.
  event_based_spaces:
    - slack_thread
    - github_pr
    - github
    - gitlab_mr
    - jira
    - linear
    - pagerduty
    - opsgenie
    - zendesk
    - intercom
    - fireflies

  # ── Lifecycle exclusion rules ──────────────────────────────────────────
  # Docs matching any rule are auto-marked 'archived' at ingest and skipped
  # by the freshness scorer. Manual overrides via API are sticky.
  exclusion_rules:
    archived_labels:
      - archived
      - historical
      - obsolete
      - deprecated
      - frozen
      - reference
    archived_page_statuses:    # Confluence Cloud page status
      - archived
      - trashed
    archived_title_patterns:   # regex; catches un-labeled legacy docs
      - '^Archived '
      - '^\[ARCHIVED\]'
      - '\(archived\)$'

# ── Semantic Quality Scoring ───────────────────────────────────────────────
# LLM-assessed quality on four dimensions: accuracy, completeness, clarity,
# actionability. Runs as a background sweep on structurally-scored documents.
semantic_quality:
  enabled: ${SEMANTIC_QUALITY_ENABLED:-true}
  interval_hours: ${SEMANTIC_QUALITY_INTERVAL_HOURS:-24}
  budget_per_sweep: ${SEMANTIC_QUALITY_BUDGET:-50}
  structural_threshold: ${SEMANTIC_QUALITY_STRUCTURAL_THRESHOLD:-40.0}

memory:
  consolidation_interval_hours: 6

auth:
  session_ttl_hours: 720   # 30 days. Set to 0 for non-expiring sessions.

confluence:
  # base_url: ~         # set CONFLUENCE_BASE_URL env var
  # user_email: ~       # set CONFLUENCE_USER_EMAIL env var
  # api_token: ~        # set CONFLUENCE_API_TOKEN env var
  # space_keys: ~       # set CONFLUENCE_SPACE_KEYS env var
  # api_version: "v2"   # "v2" (Cloud) or "v1" (Data Center)
  # webhook_secret: ~   # set CONFLUENCE_WEBHOOK_SECRET env var
  # tls_verify: true    # set CONFLUENCE_TLS_VERIFY=false for self-signed certs

slack:
  # bot_token: ~                   # set SLACK_BOT_TOKEN env var
  # signing_secret: ~              # set SLACK_SIGNING_SECRET env var
  notification_interval_hours: 24
  # notification_space_filter: ~   # optional space filter for notifications

ingest:
  self_ingest: true
  image_extraction_enabled: true

# ═══════════════════════════════════════════════════════════════════════════
# Ingestion sources — nested umbrella configuration
# ═══════════════════════════════════════════════════════════════════════════
#
# Each provider lives under `sources.<provider>`. A sub-source is enabled when
# its block is present in YAML; there is no separate INGEST_SOURCES env var.
#
# Resource lists (repos, projects, channels, teams, …) are ALWAYS explicit.
# An empty list is a startup error — DocBrain never falls back to "ingest
# everything the token can see." See docs/configuration.md for the full
# selector grammar (exact / wildcard / branch-pinning rules).
#
# Ingest runs via the docbrain-ingest CLI — trigger on a cron or on demand:
#   docker compose exec server docbrain-ingest
