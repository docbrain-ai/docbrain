# ═══════════════════════════════════════════════════════════════════════════
# DocBrain — Default Configuration
# ═══════════════════════════════════════════════════════════════════════════
# This file contains safe defaults for all settings.
# Override in config/development.yaml, config/production.yaml, or via
# environment variables (env vars always win).
#
# ${ENV_VAR} and ${ENV_VAR:-default} syntax is supported in all values.
# Sensitive values (API keys, passwords) should ALWAYS come from env vars.
# ═══════════════════════════════════════════════════════════════════════════

server:
  host: "127.0.0.1"   # Use 0.0.0.0 in Docker/production
  port: 3000
  cors_allowed_origins: "http://localhost:3001"
  max_query_length: 4000

database:
  # url: set DATABASE_URL env var (required — no default)
  max_connections: 10
  connect_timeout_secs: 10
  acquire_timeout_secs: 10
  idle_timeout_secs: 300

opensearch:
  url: "http://localhost:9200"
  # index: "docbrain-chunks"          # default applied in code
  # episode_index: "docbrain-episodes" # default applied in code

redis:
  url: "redis://127.0.0.1:6379"

llm:
  provider: "bedrock"   # bedrock | anthropic | openai | ollama
  # model_id: ~          # defaults to provider-appropriate model
  # haiku_model_id: ~    # optional fast/cheap model for side-calls
  # ingest_model_id: ~   # cheaper model for ingest image extraction (falls back to model_id)
  # thinking_budget: ~   # extended thinking tokens, 0 = disabled
  ollama_base_url: "http://localhost:11434"
  # anthropic_api_key: ~  # set ANTHROPIC_API_KEY env var
  # openai_api_key: ~     # set OPENAI_API_KEY env var
  # openai_base_url: ~    # optional OpenAI-compatible base URL

embeddings:
  # provider: ~   # defaults to llm.provider
  # model_id: ~   # defaults to provider-appropriate model

rag:
  cache_threshold: 0.95   # Min cosine similarity for cache hit
  cache_ttl_hours: 24     # Cache max age in hours
  # search_min_score: ~   # Min relevance for search results (default: 0.0)

autopilot:
  enabled: false          # Opt-in. Set AUTOPILOT_ENABLED=true to enable.
  cluster_threshold: 0.82
  min_cluster_size: 3
  min_unique_users: 2
  min_negative_ratio: 0.15
  lookback_days: 30
  max_clusters_per_run: 50
  max_episodes_per_run: 500
  gap_analysis_interval_hours: 6
  # Auto-draft: automatically generate drafts for qualifying gaps after each analysis run.
  # Manual by default — enable to let DocBrain draft docs without human trigger.
  auto_draft_enabled: false
  # Minimum severity to auto-draft: critical | high | medium | low
  auto_draft_severity: "critical"
  # Severity scoring thresholds — tune for your org's signal volume.
  # critical_users / critical_signals define the scale at which breadth/volume scores hit 1.0.
  # threshold_* define the composite score cutoffs for each severity band.
  critical_users: 5         # Unique users needed for full breadth score
  critical_signals: 15      # Negative signals needed for full volume score
  threshold_critical: 0.75  # Composite score >= this → "critical"
  threshold_high: 0.55      # Composite score >= this → "high"
  threshold_medium: 0.35    # Composite score >= this → "medium"

freshness:
  scheduler_interval_hours: 24

memory:
  consolidation_interval_hours: 6

auth:
  session_ttl_hours: 720   # 30 days. Set to 0 for non-expiring sessions.

confluence:
  # base_url: ~         # set CONFLUENCE_BASE_URL env var
  # user_email: ~       # set CONFLUENCE_USER_EMAIL env var
  # api_token: ~        # set CONFLUENCE_API_TOKEN env var
  # space_keys: ~       # set CONFLUENCE_SPACE_KEYS env var
  # api_version: "v2"   # "v2" (Cloud) or "v1" (Data Center)
  # webhook_secret: ~   # set CONFLUENCE_WEBHOOK_SECRET env var
  # tls_verify: true    # set CONFLUENCE_TLS_VERIFY=false for self-signed certs

slack:
  # bot_token: ~                   # set SLACK_BOT_TOKEN env var
  # signing_secret: ~              # set SLACK_SIGNING_SECRET env var
  notification_interval_hours: 24
  # notification_space_filter: ~   # optional space filter for notifications

ingest:
  self_ingest: true
  image_extraction_enabled: true
  # ingest_sources: local   # comma-separated: local, confluence, github, github_pr, gitlab_mr, slack_thread, jira

# ── GitHub PR + Review Comments (batch ingest) ───────────────────────────────
github_pr:
  # token: ~             # secret — set in config/local.yaml or GITHUB_PR_TOKEN env var
  # repo: ~              # owner/repo format e.g. acme/platform
  lookback_days: 365
  min_comments: 1
  # labels: ~            # comma-separated label filter — empty = all PRs
  # api_url: ~           # override for GitHub Enterprise (default: https://api.github.com)

# ── GitHub Webhook Capture (@docbrain on PRs/issues) ─────────────────────────
# Enables real-time capture and Q&A directly from GitHub PR/issue comments.
#
# Usage (in any PR or issue comment):
#   @docbrain capture          — ingests the full thread into the knowledge base
#   @docbrain <question>       — queries the knowledge base and posts the answer
#
# Required env vars:
#   GITHUB_WEBHOOK_SECRET      — HMAC-SHA256 secret set in GitHub webhook settings
#   GITHUB_BOT_TOKEN           — GitHub token with repo read + issues:write scope
#                                (GITHUB_PR_TOKEN is also accepted as a fallback)
#
# Optional env vars:
#   GITHUB_CAPTURE_ALLOWED_REPOS   — comma-separated allowlist e.g. acme/api,acme/web
#                                    (empty = accept all repos)
#   GITHUB_CAPTURE_ALLOWED_USERS   — comma-separated GitHub login allowlist
#                                    (empty = accept all users)
#
# Webhook setup: POST /github/events
#   Events to subscribe: issue_comment, pull_request_review_comment

# ── GitLab MR + Review Notes (batch ingest) ──────────────────────────────────
gitlab_mr:
  # token: ~             # secret — set in config/local.yaml or GITLAB_MR_TOKEN env var
  base_url: "https://gitlab.com"   # override for self-hosted
  # project_ids: ~       # comma-separated namespace/repo paths e.g. acme/platform,acme/backend
  lookback_days: 365
  min_notes: 1
  # labels: ~            # comma-separated label filter — empty = all MRs
  tls_verify: true       # set false for self-hosted with self-signed certs

# ── GitLab Webhook Capture (@docbrain on MRs) ────────────────────────────────
# Enables real-time capture and Q&A directly from GitLab MR note comments.
#
# Usage (in any MR note):
#   @docbrain capture          — ingests the full MR thread into the knowledge base
#   @docbrain <question>       — queries the knowledge base and posts the answer
#
# Required env vars (at least one must be set to enable the webhook):
#   GITLAB_CAPTURE_WEBHOOK_SECRET  — token sent in X-Gitlab-Token header
#   GITLAB_CAPTURE_TOKEN           — GitLab PAT with api scope (for fetching notes
#                                    and posting reply comments)
#
# Optional env vars:
#   GITLAB_CAPTURE_BASE_URL        — GitLab instance URL (default: https://gitlab.com)
#   GITLAB_CAPTURE_ALLOWED_USERS   — comma-separated username allowlist
#                                    (empty = accept all users)
#   GITLAB_CAPTURE_ALLOWED_PROJECTS — comma-separated project allowlist e.g. acme/api
#                                     (empty = accept all projects)
#
# Webhook setup: POST /api/v1/gitlab/events
#   Events to subscribe: Note events (MR only)

# ── Slack Thread Ingest ───────────────────────────────────────────────────────
slack_ingest:
  # token: ~             # secret — set in config/local.yaml or SLACK_INGEST_TOKEN env var
  # channels: ~          # comma-separated channel IDs e.g. C01234,C56789
  min_replies: 3
  reactions: "white_check_mark,bookmark"
  lookback_days: 90

# ── Linear Issue Ingest ───────────────────────────────────────────────────────
linear:
  # api_key: ~          # secret — set in config/local.yaml or LINEAR_API_KEY env var
  # teams: ~            # comma-separated team keys e.g. ENG,OPS — empty = all teams
  lookback_days: 365
  states: "Done,Cancelled,Duplicate"

# ── Jira Issue Ingest ─────────────────────────────────────────────────────────
jira_ingest:
  # base_url: ~          # secret — set in config/local.yaml or JIRA_BASE_URL env var
  # user_email: ~        # secret — set in config/local.yaml or JIRA_USER_EMAIL env var
  # api_token: ~         # secret — set in config/local.yaml or JIRA_API_TOKEN env var
  # projects: ~          # comma-separated project keys e.g. ENG,OPS — empty = all
  # jql_filter: ~        # optional extra JQL clause
  lookback_days: 365
  issue_types: "Bug,Story,Task,Epic"

# ── PagerDuty Incident Ingest ─────────────────────────────────────────────────
pagerduty:
  # api_token: ~         # secret — set in config/local.yaml or PAGERDUTY_API_TOKEN env var
  lookback_days: 180
  min_duration_minutes: 5
  # services: ~          # comma-separated service IDs to filter — empty = all

# ── OpsGenie Alert Ingest ─────────────────────────────────────────────────────
opsgenie:
  # api_key: ~           # secret — set in config/local.yaml or OPSGENIE_API_KEY env var
  lookback_days: 180
  min_duration_minutes: 5
  # teams: ~             # comma-separated team names to filter — empty = all

# ── Zendesk Ticket Ingest ──────────────────────────────────────────────────────
zendesk:
  # subdomain: ~         # your-company (before .zendesk.com) — set ZENDESK_SUBDOMAIN
  # email: ~             # agent email for Basic Auth — set ZENDESK_EMAIL
  # api_token: ~         # secret — set in config/local.yaml or ZENDESK_API_TOKEN env var
  lookback_days: 180
  # min_rating: ~        # "good" | "bad" | empty (include all) — set ZENDESK_MIN_RATING

# ── Intercom Conversation Ingest ───────────────────────────────────────────────
intercom:
  # access_token: ~      # secret — set in config/local.yaml or INTERCOM_ACCESS_TOKEN env var
  lookback_days: 180
  min_messages: 2
  # tags: ~              # comma-separated tag names to filter — empty = all
