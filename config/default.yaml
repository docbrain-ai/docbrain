# ── GitHub Real-Time Capture ───────────────────────────────────────────────
# Enables `@docbrain capture` on GitHub PRs/issues. Separate from ingestion.
github_capture:
  # webhook_secret: ~   # set GITHUB_WEBHOOK_SECRET env var
  # bot_token: ~        # set GITHUB_BOT_TOKEN env var

# ── GitLab MR Real-Time Capture ───────────────────────────────────────────
# Enables `@docbrain capture` on GitLab MRs. Separate from ingestion.
gitlab_capture:
  # webhook_secret: ~        # set GITLAB_CAPTURE_WEBHOOK_SECRET env var
  # token: ~                 # set GITLAB_CAPTURE_TOKEN env var
  base_url: "https://gitlab.com"
  # allowed_users: ~         # set GITLAB_CAPTURE_ALLOWED_USERS
  # allowed_projects: ~      # set GITLAB_CAPTURE_ALLOWED_PROJECTS

# ── Intercom Conversation Ingest ───────────────────────────────────────────────
intercom:
  # access_token: ~      # secret — set in config/local.yaml or INTERCOM_ACCESS_TOKEN env var
  lookback_days: 180
  min_messages: 2
  # tags: ~              # comma-separated tag names to filter — empty = all

# ── Documentation Analytics ──────────────────────────────────────────────────
# Tracks organizational documentation health — gap resolution rate, knowledge
# half-life, tribal knowledge %, and ROI of documentation investment.
# Snapshots are taken daily during memory consolidation.
velocity:
  minutes_saved_per_query: 15   # VELOCITY_MINUTES_SAVED_PER_QUERY — estimated eng time saved per answered query
  hourly_rate: 75               # VELOCITY_HOURLY_RATE — hourly engineer cost (USD) for ROI calculation

# ── Knowledge Stream (proactive push intelligence) ────────────────────────────
# Detects and pushes: incident early warnings, knowledge decay risks,
# expertise gaps, and context-aware doc updates.
# Disabled by default — enable when ready for proactive alerting.
stream:
  enabled: false                    # STREAM_ENABLED — opt-in
  interval_minutes: 30              # STREAM_INTERVAL_MINUTES — scan interval
  incident_warning_min_users: 2     # STREAM_INCIDENT_WARNING_MIN_USERS
  # alert_channel: ~                # STREAM_ALERT_CHANNEL — Slack channel for alerts (optional)
  expertise_gap_days: 90            # STREAM_EXPERTISE_GAP_DAYS — days inactive before gap alert

# ── Event Bus (internal pub/sub) ──────────────────────────────────────────
# Always enabled — foundational infrastructure for all subsystem communication.
# Events are broadcast to subscribers (logger, metrics, SSE) in real time.
event_bus:
  capacity: 4096                    # EVENT_BUS_CAPACITY — broadcast channel buffer size (max: 65536)
  retention_days: 90                # EVENT_LOG_RETENTION_DAYS — days to keep events in event_log table

# ── Knowledge Fragments ─────────────────────────────────────────────────────
# First-class knowledge units with provenance. Captured from PRs, commits,
# IDE annotations, conversations, CI/CD, and manual entry.
# Confidence-based routing: auto-index (≥ threshold), review queue, or discard.
fragments:
  auto_index_threshold: 0.7         # FRAGMENT_AUTO_INDEX_THRESHOLD — min confidence to auto-index into search
  review_threshold: 0.4             # FRAGMENT_REVIEW_THRESHOLD — min confidence for review queue (below = discard)
  max_content_length: 10000         # FRAGMENT_MAX_CONTENT_LENGTH — max fragment content in characters
  distillation:
    enabled: ${DISTILLATION_ENABLED:-true}                  # DISTILLATION_ENABLED — enable/disable conversation auto-distillation
    max_concurrent: ${DISTILLATION_MAX_CONCURRENT:-3}       # DISTILLATION_MAX_CONCURRENT — max concurrent LLM distillation calls
    max_content_chars: ${DISTILLATION_MAX_CONTENT_CHARS:-8000}  # DISTILLATION_MAX_CONTENT_CHARS — max conversation chars sent to LLM
    max_fragments: ${DISTILLATION_MAX_FRAGMENTS:-5}         # DISTILLATION_MAX_FRAGMENTS — max fragments per conversation
  clustering:
    enabled: ${FRAGMENT_CLUSTERING_ENABLED:-true}                          # FRAGMENT_CLUSTERING_ENABLED — enable/disable semantic clustering
    cluster_threshold: ${FRAGMENT_CLUSTER_THRESHOLD:-0.80}                 # FRAGMENT_CLUSTER_THRESHOLD — cosine similarity threshold for clustering
    min_cluster_size: ${FRAGMENT_MIN_CLUSTER_SIZE:-3}                      # FRAGMENT_MIN_CLUSTER_SIZE — min fragments per cluster
    min_source_diversity: ${FRAGMENT_MIN_SOURCE_DIVERSITY:-2}              # FRAGMENT_MIN_SOURCE_DIVERSITY — min distinct source types for composability
    max_fragments_per_run: ${FRAGMENT_MAX_PER_CLUSTERING_RUN:-2000}         # FRAGMENT_MAX_PER_CLUSTERING_RUN — max fragments loaded per clustering run

# ── Governance ───────────────────────────────────────────────────────────
# SLA thresholds live in the database (per-space overridable).
# These settings control the periodic SLA breach checker.
governance:
  sla_checker_interval_hours: ${SLA_CHECKER_INTERVAL_HOURS:-1}              # How often the checker runs (hours)
  sla_checker_query_timeout_secs: ${SLA_CHECKER_QUERY_TIMEOUT_SECS:-30}     # Per-entity-type query timeout (seconds)
  sla_checker_max_candidates: ${SLA_CHECKER_MAX_CANDIDATES:-5000}           # Max candidate entities per type
  sla_checker_max_events_per_run: ${SLA_CHECKER_MAX_EVENTS_PER_RUN:-50}     # Max SlaBreached events per run

# ── Expertise Ownership Gate ─────────────────────────────────────────────
# Thresholds the scorer applies before publishing a (subject, team) ownership
# attribution; all must hold or it abstains. Defaults are an abstain-heavy
# posture (high precision); tune post-launch from the governance dashboard.
# An absent section reproduces the conservative defaults exactly.
expertise_gate:
  v_min: ${EXPERTISE_GATE_V_MIN:-1.0}                 # Min decayed team_score (volume gate)
  n_min: ${EXPERTISE_GATE_N_MIN:-5}                   # Min raw signal_count (volume gate)
  m_askers: ${EXPERTISE_GATE_M_ASKERS:-2}             # Min distinct askers
  margin_frac: ${EXPERTISE_GATE_MARGIN_FRAC:-0.25}    # Min fraction leader must beat 2nd place
  diversity_min: ${EXPERTISE_GATE_DIVERSITY_MIN:-2}   # Min distinct signal_type count
  # UI accuracy gate — confident ownership is shown to users only when measured
  # accuracy clears the configured bar AND the gate is enabled AND there is
  # enough audited evidence; disabled by default so a new deployment abstains
  # until accuracy is proven from the /governance/accuracy risk-coverage curve.
  ui_gate_enabled: ${EXPERTISE_GATE_UI_ENABLED:-false}                       # Master switch; false = always abstain
  ui_confidently_wrong_bar: ${EXPERTISE_GATE_UI_CONFIDENTLY_WRONG_BAR:-0.0}  # Max audited confidently-wrong rate to show confident attributions
  ui_min_audit_samples: ${EXPERTISE_GATE_UI_MIN_AUDIT_SAMPLES:-30}           # Min audited labels before the gate can open

# ── Doc-improvement evidence loop ─────────────────────────────────────────────
# The autopilot improvement evidence chain reports how far each published fix got
# along the proven path (published -> content-changed -> re-ingest-confirmed ->
# human-approved -> measured-delta), each link at its true strength.
#
# reingest_confirm_timeout_hours is load-bearing: a published fix whose re-ingest
# has NOT been confirmed within this window is reported as "stale — published but
# never confirmed live" (something went wrong downstream) instead of the hopeful
# "published, not yet confirmed live" (the normal batch sync just hasn't run yet).
# Default 72h is long enough that a normal sync always lands first, so "stale"
# reliably signals a real failure, not a slow pipeline.
improvement:
  reingest_confirm_timeout_hours: ${IMPROVEMENT_REINGEST_CONFIRM_TIMEOUT_HOURS:-72}  # Hours before an unconfirmed published fix is flagged stale

# ── CI/CD Pipeline Capture ──────────────────────────────────────────────
# Automated knowledge extraction from merged PRs and deployments.
# Uses the fast/cheap LLM model for analysis.
ci:
  enabled: ${CI_ANALYZE_ENABLED:-true}  # CI_ANALYZE_ENABLED — enable/disable CI capture endpoints

# ── External Connectors ──────────────────────────────────────────────────
# Stateless HTTP servers that implement GET /health, POST /documents/list,
# POST /documents/fetch. DocBrain calls them on a cron schedule.
connectors:
  enabled: ${CONNECTOR_ENABLED:-true}                                 # Enable/disable the connector scheduler
  max_concurrent_syncs: ${CONNECTOR_MAX_CONCURRENT_SYNCS:-3}          # Max connectors syncing simultaneously
  max_pages_per_sync: ${CONNECTOR_MAX_PAGES_PER_SYNC:-200}            # Max list pages fetched per sync
  max_documents_per_sync: ${CONNECTOR_MAX_DOCUMENTS_PER_SYNC:-5000}   # Max documents ingested per sync
  fetch_batch_size: ${CONNECTOR_FETCH_BATCH_SIZE:-50}                 # Documents fetched per batch
  request_timeout_secs: ${CONNECTOR_REQUEST_TIMEOUT_SECS:-30}         # HTTP timeout for connector requests
  sync_timeout_secs: ${CONNECTOR_SYNC_TIMEOUT_SECS:-3600}             # Overall sync timeout
  max_response_bytes: ${CONNECTOR_MAX_RESPONSE_BYTES:-10485760}       # Max response body size (10MB)
  circuit_breaker_threshold: ${CONNECTOR_CIRCUIT_BREAKER_THRESHOLD:-5} # Consecutive failures before auto-disable
  allow_internal: ${CONNECTOR_ALLOW_INTERNAL:-false}                   # Allow connector URLs on private/internal IPs

# ── Webhooks ──────────────────────────────────────────────────────────────
# Outbound webhook subscriptions for integrating DocBrain events with
# external systems (Slack bots, CI/CD, PagerDuty, custom dashboards, etc.).
# All settings are env-var driven — uncomment the block below for reference.
# webhooks:
#   delivery_timeout_seconds: ${WEBHOOK_DELIVERY_TIMEOUT_SECONDS:-10}
#   max_retries: ${WEBHOOK_MAX_RETRIES:-4}
#   circuit_breaker_threshold: ${WEBHOOK_CIRCUIT_BREAKER_THRESHOLD:-10}
#   allow_internal: ${ALLOW_INTERNAL_WEBHOOKS:-false}

# ── Source-System ACL Mirroring (RFC-001) ────────────────────────────────
# Query-time enforcement of per-document ACLs derived from source systems
# (Confluence restrictions, Slack channel membership, GitHub repo access,
# Jira issue security levels, etc.).
#
# Default mode is `off` → preserves pre-RFC-001 behaviour exactly.
# Operators flip to `warn` first to validate ACL coverage on a real corpus
# (logs would-have-denied chunk_ids without changing user-visible results),
# then to `enforce` once per-connector AclProvider impls have populated
# the chunk index with `acl_principals` data.
#
# See docs/rfcs/RFC-001-source-system-acl-mirroring.md for the design.
acl:
  mode: "${ACL_MODE:-off}"                                            # off | warn | enforce
  unknown_policy: "${ACL_UNKNOWN_POLICY:-deny}"                       # deny | allow — for chunks lacking acl_principals data
  recall_overfetch: ${ACL_RECALL_OVERFETCH:-1.0}                      # OpenSearch top_k multiplier when filter is active (1.0 = no overfetch)
  user_principal_max_age_secs: ${ACL_USER_PRINCIPAL_MAX_AGE_SECS:-3600} # Drop user principals older than this. 0 = no fence.
  # Denial UX (RFC-002) — controls how denials are communicated to users.
  denial:
    mode: "${ACL_DENIAL_MODE:-disclosed_no_count}"                    # silent | disclosed_no_count | disclosed
    referral: "${ACL_DENIAL_REFERRAL:-your administrator}"            # operator-provided referral string surfaced in denial messages
    audit: ${ACL_DENIAL_AUDIT:-false}                                 # persist every denial to acl_audit_log (HIPAA/FedRAMP/SOC2)
    audit_raw_query: ${ACL_DENIAL_AUDIT_RAW_QUERY:-false}             # persist raw query text (default: SHA256-hashed)
  # bootstrap_principal_set: kept at the conservative default
  # ["public:system:public", "world:system:world"]. Operators who need
  # broader access for cron jobs should register a service-account user
  # rather than extend this list.
  #
  # Per-source policy (M1.4+ AclProvider impls consult this at ingest time):
  # sources:
  #   confluence:
  #     mode: mirror              # off | mirror | public | admin_only
  #     space_overrides:          # per-space override (case-insensitive)
  #       ENG: public
  #       HR: admin_only
  #   slack:
  #     mode: mirror
  #     channel_overrides:
  #       "#general": public
  #   github:
  #     mode: mirror
  #     visibility_policy:        # GitHub visibility-derived policy
  #       public: public
  #       internal: public        # GH Enterprise: internal == "all org members"
  #       private: mirror         # mirror collaborators + teams
  #     repo_overrides:
  #       "acme/secrets": admin_only
  #   jira:
  #     mode: mirror
  #     project_overrides: {}
  # Defaults to all sources at mode=off (opted-out of ACL system entirely).
