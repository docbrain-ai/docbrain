# ═══════════════════════════════════════════════════════════════════════════
# DocBrain — Default Configuration
# ═══════════════════════════════════════════════════════════════════════════
# This file contains safe defaults for all settings.
# Override in config/development.yaml, config/production.yaml, or via
# environment variables (env vars always win).
#
# ${ENV_VAR} and ${ENV_VAR:-default} syntax is supported in all values.
# Sensitive values (API keys, passwords) should ALWAYS come from env vars.
# ═══════════════════════════════════════════════════════════════════════════

server:
  host: "127.0.0.1"   # Use 0.0.0.0 in Docker/production
  port: 3000
  cors_allowed_origins: "http://localhost:3001"
  max_query_length: 4000

database:
  # url: set DATABASE_URL env var (required — no default)
  max_connections: 10
  connect_timeout_secs: 10
  acquire_timeout_secs: 10
  idle_timeout_secs: 300

opensearch:
  url: "http://localhost:9200"
  # index: "docbrain-chunks"          # default applied in code
  # episode_index: "docbrain-episodes" # default applied in code

redis:
  url: "redis://127.0.0.1:6379"

llm:
  provider: "bedrock"   # bedrock | anthropic | openai | ollama
  # model_id: ~          # defaults to provider-appropriate model
  # ingest_model_id: ~   # optional separate model for ingestion/summarization tasks
  # haiku_model_id: ~    # optional fast/cheap model for side-calls (image descriptions, etc.)
  # thinking_budget: ~   # extended thinking tokens, 0 = disabled
  ollama_base_url: "http://localhost:11434"
  # anthropic_api_key: ~  # set ANTHROPIC_API_KEY env var
  # openai_api_key: ~     # set OPENAI_API_KEY env var
  # openai_base_url: ~    # optional OpenAI-compatible base URL

embeddings:
  # provider: ~   # defaults to llm.provider
  # model_id: ~   # defaults to provider-appropriate model

rag:
  cache_threshold: 0.95   # Min cosine similarity for cache hit
  cache_ttl_hours: 24     # Cache max age in hours
  # search_min_score: ~   # Min relevance for search results (default: 0.0)

autopilot:
  enabled: false          # Opt-in. Set AUTOPILOT_ENABLED=true to enable.
  cluster_threshold: 0.82
  min_cluster_size: 3
  min_unique_users: 2
  min_negative_ratio: 0.15
  lookback_days: 30
  max_clusters_per_run: 50
  max_episodes_per_run: 500
  gap_analysis_interval_hours: 6

freshness:
  scheduler_interval_hours: 24

memory:
  consolidation_interval_hours: 6

auth:
  session_ttl_hours: 720   # 30 days. Set to 0 for non-expiring sessions.

confluence:
  # base_url: ~         # secret — set in config/local.yaml
  # user_email: ~       # secret — set in config/local.yaml
  # api_token: ~        # secret — set in config/local.yaml
  # space_keys: ~       # set in config/local.yaml
  # api_version: "v2"   # "v2" (Cloud) or "v1" (Data Center)
  # webhook_secret: ~   # secret — set CONFLUENCE_WEBHOOK_SECRET env var
  # tls_verify: true    # set to false for self-signed certs

slack:
  # bot_token: ~                   # secret — set SLACK_BOT_TOKEN env var
  # signing_secret: ~              # secret — set SLACK_SIGNING_SECRET env var
  notification_interval_hours: 24
  # notification_space_filter: ~   # optional space filter for notifications

ingest:
  self_ingest: true
  image_extraction_enabled: true
  # ingest_sources: local  # comma-separated: local, confluence, github, github_pr, gitlab_mr, slack_thread, jira

github_pr:
  # token: ~           # secret — set in config/local.yaml
  # repo: ~            # owner/repo e.g. acme/platform — set in config/local.yaml
  lookback_days: 365
  min_comments: 1
  # labels: ~          # comma-separated label filter (optional)
  # api_url: ~         # override for GitHub Enterprise (optional)

gitlab_mr:
  # token: ~           # secret — set in config/local.yaml
  base_url: "https://gitlab.com"
  # project_ids: ~     # comma-separated namespace/repo paths — set in config/local.yaml
  lookback_days: 365
  min_notes: 1
  # labels: ~          # comma-separated label filter (optional)
  tls_verify: true

slack_ingest:
  # token: ~           # secret — set in config/local.yaml
  # channels: ~        # comma-separated channel IDs — set in config/local.yaml
  min_replies: 3
  reactions: "white_check_mark,bookmark"
  lookback_days: 90

jira_ingest:
  # base_url: ~        # set in config/local.yaml
  # user_email: ~      # set in config/local.yaml
  # api_token: ~       # secret — set in config/local.yaml
  # projects: ~        # comma-separated project keys — set in config/local.yaml
  # jql_filter: ~      # optional additional JQL filter
  lookback_days: 365
  issue_types: "Bug,Story,Task,Epic"
