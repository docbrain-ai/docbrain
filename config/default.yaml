# ═══════════════════════════════════════════════════════════════════════════
# DocBrain — Default Configuration
# ═══════════════════════════════════════════════════════════════════════════
# This file contains safe defaults for all settings.
# Override in config/development.yaml, config/production.yaml, or via
# environment variables (env vars always win).
#
# ${ENV_VAR} and ${ENV_VAR:-default} syntax is supported in all values.
# Sensitive values (API keys, passwords) should ALWAYS come from env vars.
# ═══════════════════════════════════════════════════════════════════════════

server:
  host: "127.0.0.1"   # Use 0.0.0.0 in Docker/production
  port: 3000
  cors_allowed_origins: "http://localhost:3001"
  max_query_length: 4000

database:
  # url: set DATABASE_URL env var (required — no default)
  max_connections: 25
  connect_timeout_secs: 10
  acquire_timeout_secs: 10
  idle_timeout_secs: 300

opensearch:
  url: "http://localhost:9200"
  # index: "docbrain-chunks"          # default applied in code
  # episode_index: "docbrain-episodes" # default applied in code

redis:
  url: "redis://127.0.0.1:6379"

rbac:
  # Default role for new SSO users: viewer (default) | editor | admin
  defaultRole: "viewer"
  # Email domain that always gets admin role (e.g. "acme.com")
  # adminEmails: ~

llm:
  provider: "bedrock"   # bedrock | anthropic | openai | ollama
  # model_id: ~          # defaults to provider-appropriate model
  # fast_model_id: ~    # optional fast/cheap model for side-calls (Bedrock: claude-haiku, OpenAI: gpt-4o-mini)
  # ingest_model_id: ~   # cheaper model for ingest image extraction (falls back to model_id)
  # thinking_budget: ~   # extended thinking tokens, 0 = disabled
  ollama_base_url: "http://localhost:11434"
  # ollama_timeout_secs: 120   # HTTP timeout for Ollama (seconds). Increase to 300+ for large models (70B). Env: OLLAMA_TIMEOUT_SECS
  # timeout_secs: 120    # HTTP timeout (seconds) for anthropic/openai (+ compatible)/azure_openai/cohere. Ollama uses ollama_timeout_secs instead, unaffected by this. Env: LLM_TIMEOUT_SECS
  # anthropic_api_key: ~  # set ANTHROPIC_API_KEY env var
  # openai_api_key: ~     # set OPENAI_API_KEY env var
  # openai_base_url: ~    # optional OpenAI-compatible base URL

embeddings:
  # provider: ~   # defaults to llm.provider
  # model_id: ~   # defaults to provider-appropriate model

rag:
  claim_verification: true  # Check file paths an answer cites against ingest-recorded
                            # listings before returning it. No LLM call; inert until
                            # a source records a listing.
  cache_ttl_hours: 24     # Cache max age in hours; 0 turns the answer cache off.
                          # A cached answer is served only to the exact same question.
  # search_min_score: ~   # Min relevance for search results (default: 0.0)
  #
  # ── Staged retrieval pipeline tuning ─────────────────────────────────
  # Every field below has a sensible default baked into the code; uncomment
  # only to override. Also configurable via the environment variables listed
  # in .env.example and docs/configuration.md.
  #
  # top_k: 10                         # Chunks sent to the LLM
  # bm25_boost: 1.0                   # BM25 vs vector weight in hybrid
  # candidate_pool_size: 200          # Pool fed to the reranker
  # rrf_k: 60                         # RRF damping constant (canonical paper)
  # max_per_source: 3                 # Per-source cap in final top-k
  # max_per_document: 2               # Per-document cap in final top-k
  # freshness_window_days: 7          # Freshness retriever window (0 to disable)
  # entity_cache_ttl_secs: 300        # Entity → space cache TTL
  # max_rewrites: 2                   # Query rewrites per ask (0 to disable)
  # max_chunks_per_doc_in_retriever: 2  # Per-retriever cap on chunks from one document
  #
  # Compound query decomposition is gated on RAG_COMPOUND_DECOMPOSE
  # (env only, default true). Not a RagConfig field because it is a
  # behaviour flag, not a numeric tunable.

  # ── Grounding floors — calibrated for a cross-encoder reranker ──────
  #
  # These four values are the single biggest quality lever in the RAG
  # pipeline. They all gate on the reranker's calibrated [0, 1] score.
  # Recommended defaults below match where Cohere Rerank v3.5 and similar
  # cross-encoders separate "actually answers the question" from "shares
  # a few keywords but is not on-topic".
  #
  # Lowering → more recall, noisier citations, higher hallucination risk.
  # Raising  → more precision, more "insufficient information" answers.
  #
  # If `rerank.provider = "none"` these gate on raw BM25/vector scores
  # which are NOT calibrated — set them to 0.0 in that mode. See
  # docs/rerank-providers.md § "Tuning the grounding floors" for the
  # full explanation.
  min_relevance_score: 0.40   # Retrieval floor — chunks below this never reach the LLM. Lowering sends weaker evidence to the LLM (hallucination risk).
  display_floor: 0.50         # Display floor — chunks below this are never shown as citations. Lowering surfaces more tangential sources (user trust cost).
  confidence_gate: 0.40       # Confidence gate — below this, sources are hidden and the answer is shown as "general knowledge".
  strong_answer_floor: 0.55   # Strong-answer floor — top-1 rerank score required before the answer is emitted without a "low confidence" disclaimer.

  # ── Window-expanded synthesis context ────────────────────────────────
  #
  # Retrieval is chunk-granular because small chunks embed and rerank
  # better. Synthesis used to be chunk-granular too, which meant the LLM
  # saw only the matched fragments: measured on a 14,680-document corpus,
  # ten selected chunks carried 4,420 bytes while the runbook they came
  # from had 15 indexed chunks. An answer cannot contain what the context
  # never held — on any provider, local or hosted.
  #
  # These widen only what SYNTHESIS sees. Retrieval, ranking, source cards
  # and the grounding floors above are untouched.
  context_window_chunks: 3          # Sibling chunks fetched either side of each match. 0 disables expansion (synthesis sees only matched fragments). Raising it costs synthesis latency and context-window headroom.
  # Intent-aware: precision lookups (intent find, who_owns) always use radius 0,
  # whatever is set here — on "what is the URL for X" the neighbouring chunks are
  # competing values, and the model picks the wrong one (proven: 4.8KB of matched
  # chunks answered correctly, the same chunks expanded ±3 did not). Explanatory
  # intents (how_to, explain, troubleshoot) use the full radius. The effective radius
  # is in the stage="rag.staged.context_window" log line.
  context_window_budget_bytes: 65536  # Total budget across all expanded documents; overflow trimmed from the lowest-ranked end. A BYTE budget, but the real limit is the model's TOKEN window (~3.2 bytes/token measured). Lowering it to 32768 measurably cost answer quality, so it stays generous — if your model's window is smaller, lower it and check the stage="rag.staged.context_window" log line, since providers truncate silently.
  live_data_budget_bytes: 32768  # AGGREGATE ceiling on the LIVE DATA block — the concatenation of EVERY tool block spliced into one synthesis prompt. Each tool's own output is already capped separately (DOCBRAIN_MCP_DEFAULT_TOOL_OUTPUT_CAP_BYTES, default 32768), so this is what bounds several tools answering at once; nothing else does. Measured 2026-09-04: one Confluence tool returned 103,479 bytes and reached the prompt as 8,475 after per-tool capping and redaction, so a single tool rarely approaches this. Over budget the block is truncated with a marker and a warn log ("live tool output exceeds the synthesis budget") rather than being dropped silently by the provider, which does not error on an over-long prompt.

  # ── Tool-output caps (the truncation chain) ──────────────────────────
  #
  # Three coordinated caps bound how much raw tool output reaches the
  # synthesis prompt. They MUST rise together — raising one alone has no
  # effect because the smallest in the chain still truncates:
  #   1. mcp_output_ceiling_bytes        — hard upper bound the manifest
  #      validator enforces on any per-tool output cap.
  #   2. mcp_default_tool_output_cap_bytes — cap inherited by tools that are
  #      discovered dynamically and ship no per-tool cap (e.g. Slack search).
  #   3. evidence_buffer_cap_bytes       — SHARED budget across every tool in
  #      one loop round; the real bottleneck. Sized at 2x the per-tool cap so
  #      a maxed single-source result still leaves headroom for other sources.
  #
  # Defaults below let a high-volume search (which can return 43-63KB raw)
  # keep ~32KB instead of being truncated to a fraction. The two mcp_* values
  # are also read from the matching DOCBRAIN_MCP_* env vars by the manifest
  # validator (it lives in a crate that does not depend on this config), so
  # set the env var AND this value together when overriding.
  mcp_output_ceiling_bytes: 32768          # DOCBRAIN_MCP_OUTPUT_CEILING_BYTES
  mcp_default_tool_output_cap_bytes: 32768 # DOCBRAIN_MCP_DEFAULT_TOOL_OUTPUT_CAP_BYTES
  evidence_buffer_cap_bytes: 65536         # DOCBRAIN_EVIDENCE_BUFFER_CAP_BYTES
  # Recency window appended to an unbounded full-text Jira search (text ~ with no
  # time/project/key clause) so Jira hits the date index instead of scanning the
  # whole instance and timing out. Already-bounded queries are untouched.
  mcp_jql_recency_bound_days: 180          # DOCBRAIN_MCP_JQL_RECENCY_BOUND_DAYS

  # Sufficiency critic — a scope-relative answer-quality gate that runs after
  # synthesis. Judges whether the answer covers the question's sub-parts grounded
  # in retrieved sources; insufficient → ONE recovery round on the named gap →
  # re-judge; still short → an honest, specific gap. ON BY DEFAULT (the critic is
  # the product). Kill-switch disables WITHOUT a code rollback; fail-OPEN on any
  # critic error (ships the answer unchanged).
  sufficiency_critic_enabled: true              # DOCBRAIN_SUFFICIENCY_CRITIC_ENABLED
  sufficiency_critic_max_recovery_rounds: 1     # DOCBRAIN_SUFFICIENCY_CRITIC_MAX_RECOVERY_ROUNDS (0..=2)
  sufficiency_critic_skip_above_confidence: 0.85 # DOCBRAIN_SUFFICIENCY_CRITIC_SKIP_ABOVE_CONFIDENCE
  sufficiency_critic_min_coverage: 0.9          # DOCBRAIN_SUFFICIENCY_CRITIC_MIN_COVERAGE
  sufficiency_critic_min_recovery_budget_ms: 20000 # DOCBRAIN_SUFFICIENCY_CRITIC_MIN_RECOVERY_BUDGET_MS (min wall-clock headroom to allow a recovery round; 0 disables)
  # Hard cap on a whole /ask, in seconds. Every stage inside has its own budget and
  # none of them bounds the sum: one measured question ran 1077s (18 minutes) with
  # every stage within its limit. 600 is deliberately generous — the slowest honest
  # answer measured was 248s. Enforced inside the pipeline, so every surface (SSE,
  # JSON, Slack, webhooks, eval) is bound by it, and the agentic loop's own budget
  # is clamped to whatever is left of the turn. A stopped turn is not an error: it
  # returns the answer it had with a `deadline` note, and records the turn with
  # metadata.stopped.reason = "deadline". The agentic loop's last model call is
  # under this clock too, so a model hanging in synthesis ends the turn at the cap
  # rather than at cap + LLM_TIMEOUT_SECS. One limit on how exact it is: the cap is
  # per ask, so an N-section doc generate is bounded at N x this value.
  # 0 disables the cap.
  ask_wall_clock_secs: 600 # ASK_WALL_CLOCK_SECS

  # Freshness Critic — the doc-generation reviewer. Segments a generated draft
  # (and, for augments, the existing doc) into atomic claims, retrieves
  # ACL-filtered evidence per claim, and FLAGS only the claims the evidence
  # CONTRADICTS (conservative-KEEP: uncertainty never flags). ON BY DEFAULT;
  # kill-switch disables WITHOUT a code rollback; fail-OPEN on any critic error
  # (ships the draft unchanged). Bounds cap LLM + retrieval cost per draft.
  freshness_critic_enabled: true                # DOCBRAIN_FRESHNESS_CRITIC_ENABLED
  freshness_critic_max_claims: 60               # DOCBRAIN_FRESHNESS_CRITIC_MAX_CLAIMS (hard cap; over-cap claims reported unchecked, never dropped)
  freshness_critic_batch_size: 12               # DOCBRAIN_FRESHNESS_CRITIC_BATCH_SIZE (claims per batched judgment LLM call)
  freshness_critic_evidence_per_claim: 5        # DOCBRAIN_FRESHNESS_CRITIC_EVIDENCE_PER_CLAIM (evidence snippets retrieved per claim)
  freshness_critic_min_budget_ms: 20000         # DOCBRAIN_FRESHNESS_CRITIC_MIN_BUDGET_MS (min wall-clock headroom to RUN the critic; 0 disables the guard)
  # Support Critic (grounding): flags claims NO supplied source supports (fabrication)
  # + NEEDS-INPUT markers the sources actually cover (inverted self-flag). ADVISORY,
  # never blocks; fail-open. ON by default.
  support_critic_enabled: true                  # DOCBRAIN_SUPPORT_CRITIC_ENABLED (disable only with false/0/no/off)
  support_critic_max_claims: 40                 # DOCBRAIN_SUPPORT_CRITIC_MAX_CLAIMS (hard cap on claims grounding-checked per draft; range 1..=200)

  # Regenerate loop (Reviewer Part 2). Consumes the freshness critic's flags and
  # regenerates a draft until they clear. UI = human-in-loop (per click, capped
  # at max_revisions); CLI/generate = auto-review (capped at max_rounds).
  # Feedback shapes the WRITING prompt only — it can NEVER clear a contradicted
  # flag (the critic re-derives flags from evidence). The round cap is the hard
  # termination backstop; the loop never runs forever, never silently ships flags.
  regen_loop_enabled: true                      # DOCBRAIN_REGEN_LOOP_ENABLED (disable only with false/0/no/off)
  regen_loop_max_rounds: 3                       # DOCBRAIN_REGEN_LOOP_MAX_ROUNDS (CLI/generate auto-review cap; range 1..=20)
  regen_loop_max_revisions: 10                  # DOCBRAIN_REGEN_LOOP_MAX_REVISIONS (UI human-in-loop cap per draft; range 1..=100)
  regen_loop_min_budget_ms: 20000               # DOCBRAIN_REGEN_LOOP_MIN_BUDGET_MS (min wall-clock headroom to START a round; 0 disables the guard)

  # Generation hollow-doc guard (DELTA #9). Refuses (HTTP 422) a draft ONLY when it
  # has no inline seed, no High-tier authoritative corpus grounding, AND no Low-tier
  # live grounding either, AND is mostly unanswered `NEEDS INPUT:` placeholders
  # (>= this % of its `##` sections). A no-seed/no-High doc that DOES have live/Low
  # grounding ships UNVERIFIED (barred from auto-publish) rather than refusing. The
  # guard now applies to SHORT docs too (the old min-sections floor was removed);
  # the only floor left is `section_count > 0`. Keys on OUTPUT shape + grounding tier.
  generate_hollow_ratio_pct: 50                 # DOCBRAIN_GENERATE_HOLLOW_RATIO_PCT (refuse when >= this % of sections are NEEDS-INPUT; 50 = half the doc)

  # In-place reconcile of an outdated section. When the reviewer flags a section
  # of an existing page as stale, reconcile replaces ONLY that section in place
  # (in storage byte-space) instead of appending a fresh block, so the page does
  # not accumulate duplicate-but-newer content. Kill-switch defaults ON (the
  # publish-time version check, the lint floor, and fail-open-to-append keep it
  # survivable); max-sections bounds the per-draft LLM + splice cost.
  reconcile_enabled: true                       # DOCBRAIN_RECONCILE_ENABLED (disable only with false/0/no/off)
  reconcile_max_sections: 5                      # DOCBRAIN_RECONCILE_MAX_SECTIONS (max sections reconciled per draft; range 1..=50)

  # Byte floor below which a SEARCH tool's `ok` result counts as near-empty
  # (200-but-no-results). Below this, the loop forces ONE broaden-retry of the
  # same tool with a wider query (the 134-byte github "no results" trap).
  empty_result_floor_bytes: 256                 # DOCBRAIN_EMPTY_RESULT_FLOOR_BYTES

  # Time-sensitive (freshness-critical) question phrases. A question matching
  # any phrase (case-insensitive substring) must be answered from THIS request's
  # live tool data only — a prior episode's ANSWER is never fed back into the
  # synthesis prompt (otherwise "who is on call" could reuse yesterday's name
  # after the rotation changed). Episodic memory still informs retrieval; only
  # the prior-answer text is withheld. Empty list = no question is treated as
  # time-sensitive (prior behaviour). Stable questions (ownership, docs, how-to)
  # keep the prior-answer feed for its quality benefit.
  fresh_only_phrases:
    - "on call"
    - "on-call"
    - "oncall"
    - "who is paging"
    - "paging primary"
    - "paging secondary"
    - "current rotation"
    - "on call right now"
    - "on call today"
    - "who is on the pager"
    - "incident commander"

  # Retrieval ladder. Off by default; opt-in per deployment.
  # ── Retrieval ladder (pick the better of corpus-only vs live-tool answer) ──
  # Off by default. When a tool fires, the fused path puts corpus chunks AND
  # live tool output in ONE prompt — and live output can make an otherwise good
  # corpus answer worse. Measured 2026-09-04: a FluxCD question answered at
  # 0.90 confidence from the corpus alone dropped to 0.15 once a Confluence
  # tool returned results into the same prompt.
  #
  # Enabled, DocBrain synthesizes BOTH an indexed-only answer and a
  # live-tool answer, then an LLM judge keeps the better one — so live data can
  # only help. Cost is paid ONLY when a tool fires: a corpus-only question runs
  # a single synthesis exactly as before. The two syntheses run concurrently,
  # so the added wall-clock is roughly one judge call, not a second answer.
  #
  # judge_timeout_ms: if the judge does not answer in time, the higher
  # self-graded confidence wins — a safe degradation, not a failure. The old
  # 1500ms default was unreachable for a local model (a 14B judge call measured
  # 46-120s), so self-hosted deployments silently never ran the judge at all.
  # Raise it if you want the real judge on a local model; lower it to bound
  # added latency and accept the fallback.
  retrieval_ladder:
    enabled: false
    graph_append_threshold: 0.5   # below this confidence, append graph-derived related topics
    judge_timeout_ms: 10000
    # judge_model_id: null        # null = use the configured fast model

  # Confidence-retry fallback. Default OFF. When enabled, /ask
  # responses with very-low confidence AND unused tools in the
  # eligible catalog re-run once with the picker in widen-mode
  # (encourages maximal tool selection). The retry's tool set is a
  # strict superset of the first pass — never narrower.
  #
  # Read at runtime from environment variables (NOT this YAML — kept
  # as env-only so an ops change can flip it without a redeploy):
  #   RAG_CONFIDENCE_RETRY_ENABLED            true | 1 | yes | on
  #   RAG_CONFIDENCE_RETRY_THRESHOLD          0.0–1.0 (default 0.25)
  #   RAG_CONFIDENCE_RETRY_LATENCY_BUDGET_MS  1000–60000 (default 12000)
  #
  # Gate logic (all must hold to trigger retry):
  #   1. Env flag is on
  #   2. First-pass confidence < threshold
  #   3. First-pass dispatched fewer tools than the eligible catalog
  #   4. First-pass elapsed_ms <= latency budget
  #
  # See crates/docbrain-core/src/rag/retry.rs for the full decision
  # matrix (19 unit tests cover ~384 input combinations).
  #
  # Agentic tool loop. Default OFF. Generalizes the confidence-retry
  # above into a bounded MULTI-round tool loop with per-surface round
  # and wall-clock budgets. When the master switch is on, the loop
  # SUBSUMES the confidence-retry (the loop runs instead of the single
  # retry). Same env-only, no-redeploy contract; same validation style
  # (unset → silent default; set-but-invalid → warn + default):
  #   RAG_AGENTIC_LOOP_ENABLED               true | 1 | yes | on (default false)
  #   RAG_AGENTIC_LOOP_MAX_ROUNDS_SLACK      1–10 (default 5)
  #   RAG_AGENTIC_LOOP_MAX_ROUNDS_WEB        1–10 (default 4)
  #   RAG_AGENTIC_LOOP_BUDGET_MS_SLACK       1000–120000 (default 60000)
  #   RAG_AGENTIC_LOOP_BUDGET_MS_WEB         1000–120000 (default 30000)
  #   RAG_AGENTIC_LOOP_CONFIDENCE_THRESHOLD  0.0–1.0 (default 0.7; unset →
  #                                          falls back to RAG_CONFIDENCE_RETRY_THRESHOLD)
  #
  # See crates/docbrain-core/src/rag/agentic_loop.rs for the per-surface
  # budgets and the pure stop-or-continue decision table.
  #
  # There is deliberately NO key here for any of the settings above: they are read from
  # the environment and nothing reads them from this file. A `confidence_retry.docs_only`
  # sentinel used to sit at this spot purely to give the comment something to hang on, and
  # a key that configures nothing is indistinguishable from one that is quietly broken —
  # the same shape as the fourteen keys that named an environment variable and were read
  # by nobody until 2026-09-15. If one of these becomes file-configurable, give it a real
  # field in `RagConfig` and a test, as those fourteen now have.

  # ── Feedback → source-suppression learning loop ─────────────────────────
  #
  # When a human marks a SPECIFIC source within an answer as not-relevant
  # (per-source thumbs-down on web/CLI/Slack, captured in
  # episode_source_feedback), this down-ranks that document in retrieval for
  # SIMILAR future questions. "Similar" = the episodes already recalled on the
  # hot path. Threshold-gated so one click can't unilaterally bury a doc.
  #
  #   RAG_SUPPRESSION_MIN_FEEDBACK_COUNT   total not-relevant events (default 2)
  #   RAG_SUPPRESSION_MIN_UNIQUE_USERS     distinct users (default 2)
  #   RAG_SUPPRESSION_RAG_PENALTY_FACTOR   score multiplier (default 0.1)
  #
  # A doc is suppressed when it crosses EITHER gate. Set both min_* to 0 to
  # disable suppression entirely.
  suppression:
    min_feedback_count: 2
    min_unique_users: 2
    rag_penalty_factor: 0.1

# ── Reranker (stage 3 of the retrieval pipeline) ──────────────────────────
#
# The reranker takes the candidate pool from stage 2 and rescores each
# (query, chunk) pair with a cross-encoder, producing calibrated scores in
# [0, 1] that drive the downstream grounding floors.
#
# DocBrain ships with plug-and-play support for every major hosted rerank
# API through a single HTTP client parameterised by a "dialect". Built-in
# dialects: cohere, voyage, jina, mixedbread, pinecone. Unknown APIs can be
# wired via `provider: custom` with the custom_* fields below — no rebuild
# required.
#
# See docs/configuration.md and docs/rerank-providers.md for the full list
# of supported providers and their credentials.
rerank:
  provider: "none"        # none | bedrock | cohere | voyage | jina | mixedbread | pinecone | ollama | custom
  # model_id: ~           # Provider-specific default applies when unset.
  top_n: 200              # Max candidates handed to the reranker per call.
  batch_size: 100         # Split larger pools into batches of this size.
  timeout_secs: 10        # Per-request timeout on the critical path.
  #
  # Provider API keys (set via env vars in production — never commit secrets):
  # cohere_api_key: ~     # COHERE_RERANK_API_KEY
  # voyage_api_key: ~     # VOYAGE_API_KEY
  # jina_api_key: ~       # JINA_API_KEY
  # mixedbread_api_key: ~ # MIXEDBREAD_API_KEY
  # pinecone_api_key: ~   # PINECONE_API_KEY
  #
  # Ollama (local, no key):
  # ollama_base_url: "http://localhost:11434"  # RAG_RERANK_OLLAMA_BASE_URL
  #
  # ── provider: "custom" — plug-and-play for any Cohere-family rerank API ──
  # Set `provider: custom` and fill these fields to wire a new rerank
  # provider without a rebuild. Defaults match Cohere's request/response
  # shape; override any field whose JSON key differs.
  #
  # custom_base_url: "https://api.example.test/v1/rerank"   # RAG_RERANK_CUSTOM_BASE_URL   (required)
  # custom_api_key_env: "EXAMPLE_RERANK_API_KEY"            # RAG_RERANK_CUSTOM_API_KEY_ENV (required)
  # custom_auth_style: "bearer_token"                       # RAG_RERANK_CUSTOM_AUTH_STYLE  (or "custom_header")
  # custom_auth_header_name: "Api-Key"                      # RAG_RERANK_CUSTOM_AUTH_HEADER_NAME (only when custom_header)
  # custom_documents_field: "documents"                     # RAG_RERANK_CUSTOM_DOCUMENTS_FIELD
  # custom_top_n_field:    "top_n"                          # RAG_RERANK_CUSTOM_TOP_N_FIELD
  # custom_results_field:  "results"                        # RAG_RERANK_CUSTOM_RESULTS_FIELD
  # custom_score_field:    "relevance_score"                # RAG_RERANK_CUSTOM_SCORE_FIELD

autopilot:
  enabled: true           # Enabled by default. Set AUTOPILOT_ENABLED=false to opt out.
  cluster_threshold: 0.82
  min_cluster_size: 3
  min_unique_users: 2
  min_negative_ratio: 0.15
  lookback_days: 30
  max_clusters_per_run: 50
  max_episodes_per_run: 500
  gap_analysis_interval_hours: 6
  # Auto-draft: automatically generate drafts for qualifying gaps after each analysis run.
  # Manual by default — enable to let DocBrain draft docs without human trigger.
  auto_draft_enabled: false
  # Minimum severity to auto-draft: critical | high | medium | low
  auto_draft_severity: "critical"
  # Severity scoring thresholds — tune for your org's signal volume.
  # critical_users / critical_signals define the scale at which breadth/volume scores hit 1.0.
  # threshold_* define the composite score cutoffs for each severity band.
  critical_users: 5         # Unique users needed for full breadth score
  critical_signals: 15      # Negative signals needed for full volume score
  threshold_critical: 0.75  # Composite score >= this → "critical"
  threshold_high: 0.55      # Composite score >= this → "high"
  threshold_medium: 0.35    # Composite score >= this → "medium"
  # Corpus-probe relevance floor: min OpenSearch hybrid (BM25+kNN, unbounded)
  # probe score a candidate target doc must reach before autopilot auto-picks it
  # to AUGMENT for a poor_coverage gap. Below this → "needs human pick".
  target_min_score: 45.0
  # Retention window (days) for persisted ad-hoc `generate` runs in the web
  # History view (generated_documents, migration 149). Rows older than this are
  # purged daily, and the History list/detail also filter to this window. Bounds
  # the data-at-rest exposure of the persisted document body (owner-scoped).
  # Env: GENERATED_DOCS_RETENTION_DAYS. Set 0 to keep indefinitely.
  generated_docs_retention_days: 90
  # Staleness warn window (days) for a generation's GROUNDING sources. A grounding
  # source whose DocBrain-controlled ingest date is older than this is flagged
  # STALE in the trust headline ("grounded in a 2023 page"); within it, FRESH; an
  # unknown/unparseable date renders UNKNOWN (distinct from fresh, never assumed).
  # Env: DOCBRAIN_GENERATE_SOURCE_STALENESS_WARN_DAYS.
  source_staleness_warn_days: 365
  # ── Verification engine (generate) — defaults below preserve the built
  #    behavior. Cross-check disabled (or budget 0) and section-query LLM
  #    disabled both FAIL TOWARD HONESTY (no claim is ever flagged stale).
  # Enable the per-section retrieval-query LLM rewrite (T-QGEN). false → a
  # deterministic doc-meta-stripped fallback query is used instead.
  # Env: DOCBRAIN_GENERATE_VERIFY_SECTION_QUERY_LLM.
  verify_section_query_llm_enabled: true
  # Enable the per-claim LIVE cross-check. false (or budget 0) → claims are not
  # live-verified (NotFound, never Contradicted/stale).
  # Env: DOCBRAIN_GENERATE_VERIFY_CROSS_CHECK.
  verify_cross_check_enabled: true
  # Per-document wall-clock budget (seconds) for the cross-check. 0 disables it
  # (same honest path as verify_cross_check_enabled: false).
  # Env: DOCBRAIN_GENERATE_VERIFY_CROSS_CHECK_BUDGET_SECS.
  verify_cross_check_budget_secs: 120
  # top_k for the two corpus probes that confirm a false gap before NEEDS INPUT.
  # Floored at 1. Env: DOCBRAIN_GENERATE_VERIFY_BROAD_PROBE_TOP_K.
  verify_broad_probe_top_k: 12
  # Max review send-back rounds. HARD-clamped to 2 (the documented max).
  # Env: DOCBRAIN_GENERATE_VERIFY_REVIEW_MAX_ROUNDS.
  verify_review_max_rounds: 2

# Where to publish AI-generated drafts (optional).
# When configured, the "Publish" button in the UI and auto-draft loop will push
# docs directly to the target system and trigger re-ingest automatically.
# Supports multi-target publishing: Confluence (default), GitHub (PR-based), GitLab (MR-based).
# Per-space routing is managed via the publish_targets DB table (API: /api/v1/publish-targets).
draft_publish:
  target: "none"           # "confluence" | "github" | "gitlab" | "none"
  # confluence_space_key: ~      # Space key to create pages in (e.g. "SAAS")
  # confluence_parent_page_id: ~ # Optional parent page ID
  auto_ingest_after_publish: true   # Re-ingest the created page so DocBrain learns from it

# ── GitHub Draft Publishing (optional) ──────────────────────────────────────
# Publish AI-generated drafts as GitHub Pull Requests with markdown files.
# Set draft_publish.target to "github" or use per-space routing via the API.
github_publish:
  # token: ~               # secret — set GITHUB_PUBLISH_TOKEN env var (requires repo scope)
  # repo: ~                # owner/repo format e.g. acme/docs — set GITHUB_PUBLISH_REPO env var
  branch: "main"           # GITHUB_PUBLISH_BRANCH — target branch for PRs
  docs_path: "docs"        # GITHUB_PUBLISH_DOCS_PATH — directory in repo for doc files
  pr_labels: "docbrain,auto-generated"  # GITHUB_PUBLISH_PR_LABELS — comma-separated PR labels
  create_pr: true          # GITHUB_PUBLISH_CREATE_PR — create PR (true) or direct commit (false)
  # api_url: ~             # GITHUB_PUBLISH_API_URL — override for GitHub Enterprise

# ── GitLab Draft Publishing (optional) ──────────────────────────────────────
# Publish AI-generated drafts as GitLab Merge Requests with markdown files.
# Set draft_publish.target to "gitlab" or use per-space routing via the API.
gitlab_publish:
  # token: ~               # secret — set GITLAB_PUBLISH_TOKEN env var (requires api scope)
  # project_id: ~          # numeric project ID — set GITLAB_PUBLISH_PROJECT_ID env var
  # base_url: ~            # GITLAB_PUBLISH_BASE_URL — default: https://gitlab.com
  branch: "main"           # GITLAB_PUBLISH_BRANCH — target branch for MRs
  docs_path: "docs"        # GITLAB_PUBLISH_DOCS_PATH — directory in project for doc files
  mr_labels: "docbrain,auto-generated"  # GITLAB_PUBLISH_MR_LABELS — comma-separated MR labels
  create_mr: true          # GITLAB_PUBLISH_CREATE_MR — create MR (true) or direct commit (false)

freshness:
  scheduler_interval_hours: 24
  contradiction_checks_per_pass: 10   # Max docs checked for contradictions per freshness run (LLM cost)
  contradiction_include_recent_event_docs: true   # Include recent Slack/PR/Jira docs in contradiction pass
  contradiction_event_doc_max_age_days: 90        # Only event-based docs edited within N days are eligible

  # ── Event-based source types ───────────────────────────────────────────
  # Sources whose docs are permanent historical records (incident threads,
  # merged PRs, support tickets). For these:
  #   - time_decay is always 100 (don't penalise age)
  #   - LLM/link/contradiction passes are skipped
  # Capture sources (slack_capture, github_capture, gitlab_capture) are
  # intentionally NOT here — design discussions DO go stale as systems evolve.
  # Override to add your own permanent-record source types.
  event_based_spaces:
    - slack_thread
    - github_pr
    - github
    - gitlab_mr
    - jira
    - linear
    - pagerduty
    - opsgenie
    - zendesk
    - intercom
    - fireflies

  # ── Lifecycle exclusion rules ──────────────────────────────────────────
  # Docs matching any of these rules are auto-marked 'archived' at ingest
  # and excluded from freshness scoring. Mirrors how the existing
  # EVENT_BASED_SPACES const handles Slack/Jira/PR sources, but driven by
  # source-system metadata (Confluence page labels, page status, title).
  #
  # Admins can override per-doc via PATCH /api/v1/documents/:id/lifecycle —
  # manual overrides are sticky and survive future syncs.
  exclusion_rules:
    archived_labels:           # case-insensitive match against source labels
      - archived
      - historical
      - obsolete
      - deprecated
      - frozen
      - reference
    archived_page_statuses:    # Confluence Cloud page status field
      - archived
      - trashed
    archived_title_patterns:   # regex; safety net for un-labeled legacy docs
      - '^Archived '
      - '^\[ARCHIVED\]'
      - '\(archived\)$'

# ── Semantic Quality Scoring ───────────────────────────────────────────────
# LLM-assessed quality on four dimensions: accuracy, completeness, clarity,
# actionability. Runs as a background sweep on structurally-scored documents.
semantic_quality:
  enabled: ${SEMANTIC_QUALITY_ENABLED:-true}
  interval_hours: ${SEMANTIC_QUALITY_INTERVAL_HOURS:-24}
  budget_per_sweep: ${SEMANTIC_QUALITY_BUDGET:-50}
  structural_threshold: ${SEMANTIC_QUALITY_STRUCTURAL_THRESHOLD:-40.0}

memory:
  consolidation_interval_hours: 6

auth:
  session_ttl_hours: 720   # 30 days. Set to 0 for non-expiring sessions.

# ── MCP Tool Platform ─────────────────────────────────────────────
# Master switch for the live-tool orchestrator. When `enabled = false` (the
# default), the synthesis path is byte-identical to a build without the tool platform — no
# orchestrator round-trip, no fast-LLM dispatch call. Flip to `true` (or set
# MCP_TOOLS_ENABLED=true) once mcp_oauth is configured to enable live tool
# fan-out at answer time.
mcp_tools:
  enabled: false   # MCP_TOOLS_ENABLED
  # Max concurrent gateway dispatches in one fan-out pass (clamped 1..=64).
  # Bounds the always-on full-catalog fan-out so it can't become a spawn
  # storm under many concurrent users. Total wall-clock budget is separate.
  fanout_max_concurrent: 8   # MCP_TOOLS_FANOUT_MAX_CONCURRENT
  # Max TOTAL chars of live-tool evidence admitted into one generate
  # fan-out (clamped 1000..=200000). Bounds the always-on per-tool live
  # evidence so a verbose catalog can't stuff the writing prompt; whole
  # lowest-priority chunks past the budget are DROPPED at chunk boundaries
  # (never truncated mid-chunk). Applies only to live chunks.
  fanout_max_admitted_chars: 24000   # MCP_TOOLS_FANOUT_MAX_ADMITTED_CHARS
  # Per-connector cooldown TTL in seconds (0 disables, clamped 0..=600).
  # When a connector returns a 429 / timeout / transient failure, skip
  # dispatching it for this TTL ACROSS requests so the always-on full-catalog
  # fan-out can't re-hammer a flaky connector on every generate + regenerate.
  # Keyed on the connector's OWN recent failures; CLEARED the moment it
  # succeeds (a recovered connector is never suppressed).
  fanout_cooldown_secs: 30   # MCP_TOOLS_FANOUT_COOLDOWN_SECS

tier2:
  fetch_allowed_hosts: []     # empty = URL-based install disabled; paste-only
  max_manifest_bytes: 65536   # 64 KB hard cap for URL-fetched manifests

confluence:
  # base_url: ~         # set CONFLUENCE_BASE_URL env var
  # user_email: ~       # set CONFLUENCE_USER_EMAIL env var
  # api_token: ~        # set CONFLUENCE_API_TOKEN env var
  # space_keys: ~       # set CONFLUENCE_SPACE_KEYS env var
  # api_version: "v2"   # "v2" (Cloud) or "v1" (Data Center)
  # webhook_secret: ~   # set CONFLUENCE_WEBHOOK_SECRET env var
  # tls_verify: true    # set CONFLUENCE_TLS_VERIFY=false for self-signed certs

slack:
  # bot_token: ~                   # set SLACK_BOT_TOKEN env var
  # signing_secret: ~              # set SLACK_SIGNING_SECRET env var
  notification_interval_hours: 24
  # notification_space_filter: ~   # optional space filter for notifications

# ── GitHub Real-Time Capture ───────────────────────────────────────────────
# Enables `@docbrain capture` on GitHub PRs/issues.
# Both fields are required; if either is missing, the route is not registered.
github_capture:
  # webhook_secret: ~   # set GITHUB_WEBHOOK_SECRET env var
  # bot_token: ~        # set GITHUB_BOT_TOKEN env var (or GITHUB_PR_TOKEN as fallback)

# ── GitLab MR Real-Time Capture ───────────────────────────────────────────
# Enables `@docbrain capture` on GitLab MRs via POST /api/v1/gitlab/events.
# At least one of webhook_secret or token must be set; if neither is present,
# the route is not registered.
gitlab_capture:
  # webhook_secret: ~        # set GITLAB_CAPTURE_WEBHOOK_SECRET env var (X-Gitlab-Token validation)
  # token: ~                 # set GITLAB_CAPTURE_TOKEN env var (PAT with api scope — fetch notes + post replies)
  base_url: "https://gitlab.com"  # override for self-hosted: GITLAB_CAPTURE_BASE_URL
  # allowed_users: ~         # set GITLAB_CAPTURE_ALLOWED_USERS (comma-separated; empty = all)
  # allowed_projects: ~      # set GITLAB_CAPTURE_ALLOWED_PROJECTS (comma-separated group/project; empty = all)

ingest:
  self_ingest: true
  image_extraction_enabled: true

# ═══════════════════════════════════════════════════════════════════════════
# Ingestion sources — nested umbrella configuration
# ═══════════════════════════════════════════════════════════════════════════
#
# Each provider lives under `sources.<provider>`. A sub-source is enabled when
# its block is present in YAML; there is no separate INGEST_SOURCES env var.
#
# Resource lists (repos, projects, channels, teams, …) are ALWAYS explicit.
# An empty list is a startup error — DocBrain never falls back to "ingest
# everything the token can see." See docs/configuration.md for the full
# selector grammar (exact / wildcard / branch-pinning rules).
#
# To enable a source:
#   1. Uncomment its block (remove the leading `#` on the parent key).
#   2. Set its token / credentials via env var (recommended) or in
#      config/local.yaml (gitignored).
#   3. Populate the resource list with at least one entry.
#
# Ingest runs via the docbrain-ingest CLI — trigger on a cron or on demand:
#   docker compose exec server docbrain-ingest
sources:
  # ── Local filesystem ──────────────────────────────────────────────────────
  local:
    # path: /path/to/docs       # set LOCAL_DOCS_PATH env var

  # ── GitHub umbrella (code + pull requests) ────────────────────────────────
  # github:
  #   token: ${GITHUB_TOKEN}
  #   api_url: https://api.github.com      # override for GitHub Enterprise
  #   code:
  #     repos:
  #       - acme/platform                  # exact, default branch
  #       - acme/docs:develop              # exact, pinned branch
  #   pull_requests:
  #     repos:
  #       - acme/platform
  #     lookback_days: 365
  #     min_comments: 1
  #     labels: []                         # empty = all PRs; else filter

  # ── GitLab umbrella (merge requests) ──────────────────────────────────────
  # gitlab:
  #   token: ${GITLAB_TOKEN}
  #   base_url: https://gitlab.com         # override for self-hosted
  #   tls_verify: true
  #   merge_requests:
  #     projects:
  #       - acme/platform
  #       - acme/backend
  #     lookback_days: 365
  #     min_notes: 1
  #     labels: []

  # ── Slack umbrella (thread ingestion) ─────────────────────────────────────
  # slack:
  #   token: ${SLACK_INGEST_TOKEN}         # bot token with channels:history,
  #                                        # channels:read, users:read scopes
  #   threads:
  #     channels:
  #       - "#incident-response"
  #       - "#eng-platform"
  #     min_replies: 3
  #     reactions:
  #       - white_check_mark
  #       - bookmark
  #     lookback_days: 90

  # ── Jira (issues) ─────────────────────────────────────────────────────────
  # jira:
  #   base_url: https://acme.atlassian.net
  #   user_email: ${JIRA_USER_EMAIL}
  #   api_token: ${JIRA_API_TOKEN}
  #   projects:
  #     - ENG
  #     - PLAT
  #   # jql_filter: "resolution = Fixed"
  #   lookback_days: 365
  #   issue_types:
  #     - Bug
  #     - Story
  #     - Task
  #     - Epic

  # ── Linear (issues) ───────────────────────────────────────────────────────
  # linear:
  #   api_key: ${LINEAR_API_KEY}
  #   teams:
  #     - ENG
  #     - OPS
  #   lookback_days: 365
  #   states:
  #     - Done
  #     - Cancelled
  #     - Duplicate

  # ── PagerDuty (incidents) ─────────────────────────────────────────────────
  # pagerduty:
  #   api_token: ${PAGERDUTY_API_TOKEN}
  #   services:
  #     - PXXXXXX                          # required, at least one service ID
  #   lookback_days: 180
  #   min_duration_minutes: 5

  # ── OpsGenie (alerts) ─────────────────────────────────────────────────────
  # opsgenie:
  #   api_key: ${OPSGENIE_API_KEY}
  #   teams:
  #     - platform-oncall
  #   lookback_days: 180
  #   min_duration_minutes: 5

  # ── Zendesk (support tickets) ─────────────────────────────────────────────
  # zendesk:
  #   subdomain: acme                      # acme.zendesk.com
  #   email: ${ZENDESK_EMAIL}
  #   api_token: ${ZENDESK_API_TOKEN}
  #   lookback_days: 180
  #   # min_rating: good                   # "good" | "bad" | omit (all)

  # ── Intercom (conversations) ──────────────────────────────────────────────
  # intercom:
  #   access_token: ${INTERCOM_ACCESS_TOKEN}
  #   lookback_days: 180
  #   min_messages: 2
  #   tags: []                             # empty = all; else filter

  # ── Microsoft Teams ───────────────────────────────────────────────────────
  # Requires an Azure Entra app registration with the following application
  # permissions (admin consent required):
  #   Team.ReadBasic.All, Channel.ReadBasic.All, ChannelMessage.Read.All,
  #   Chat.Read.All (optional), Files.Read.All,
  #   OnlineMeetingTranscript.Read.All (optional).
  # ms_teams:
  #   tenant_id: ${MS_TEAMS_TENANT_ID}
  #   client_id: ${MS_TEAMS_CLIENT_ID}
  #   client_secret: ${MS_TEAMS_CLIENT_SECRET}
  #   teams:
  #     - platform-eng                     # required, at least one team
  #   lookback_days: 90
  #   include_chats: false                 # 1:1/group chats are high-volume
  #   include_files: true
  #   include_transcripts: true
  #   min_replies: 2

  # ── Rootly (on-call shim, NOT an ingest source) ───────────────────────────
  # The rootly MCP manifest is served by an internal shim, not an ingest
  # source — so it has NO block here. The shim reads its Rootly token directly
  # from the env var ROOTLY_API_TOKEN (and optional ROOTLY_BASE_URL, default
  # https://api.rootly.com), not from this file. See docs/configuration.md
  # → "Rootly on-call shim".

# ── Learning Velocity ────────────────────────────────────────────────────────
# Tracks organizational documentation health — gap resolution rate, knowledge
# half-life, tribal knowledge %, and ROI of documentation investment.
# Snapshots are taken daily during memory consolidation.
velocity:
  minutes_saved_per_query: 15   # VELOCITY_MINUTES_SAVED — estimated eng time saved per answered query
  hourly_rate: 75               # VELOCITY_HOURLY_RATE — hourly engineer cost (USD) for ROI calculation

# ── Knowledge Stream (proactive push intelligence) ────────────────────────────
# Detects and pushes: incident early warnings, knowledge decay risks,
# expertise gaps, and context-aware doc updates.
# Disabled by default — enable when ready for proactive alerting.
stream:
  enabled: false                    # STREAM_ENABLED — opt-in
  interval_minutes: 30              # STREAM_INTERVAL_MINUTES — scan interval
  incident_warning_min_users: 2     # STREAM_INCIDENT_WARNING_MIN_USERS
  # alert_channel: ~                # STREAM_ALERT_CHANNEL — Slack channel for alerts (optional)
  expertise_gap_days: 90            # STREAM_EXPERTISE_GAP_DAYS — days inactive before gap alert

# ── Event Bus (internal pub/sub) ──────────────────────────────────────────
# Always enabled — foundational infrastructure for all subsystem communication.
# Events are broadcast to subscribers (logger, metrics, SSE) in real time.
event_bus:
  capacity: 4096                    # EVENT_BUS_CAPACITY — broadcast channel buffer size (max: 65536)
  retention_days: 90                # EVENT_LOG_RETENTION_DAYS — days to keep events in event_log table

# ── Knowledge Fragments ─────────────────────────────────────────────────────
# First-class knowledge units with provenance. Captured from PRs, commits,
# IDE annotations, conversations, CI/CD, and manual entry.
# Every capture is served at once, labelled with who wrote it.
fragments:
  review_threshold: 0.4             # FRAGMENT_REVIEW_THRESHOLD — summary floor: a DocBrain summary below this model confidence is not stored
  max_content_length: 10000         # FRAGMENT_MAX_CONTENT_LENGTH — max fragment content in characters
  max_per_author_per_hour: 60       # FRAGMENT_MAX_PER_AUTHOR_PER_HOUR — captures one author may write per rolling hour (429 above)
  distillation:
    enabled: ${DISTILLATION_ENABLED:-true}                  # DISTILLATION_ENABLED — enable/disable conversation auto-distillation
    max_concurrent: ${DISTILLATION_MAX_CONCURRENT:-3}       # DISTILLATION_MAX_CONCURRENT — max concurrent LLM distillation calls
    max_content_chars: ${DISTILLATION_MAX_CONTENT_CHARS:-8000}  # DISTILLATION_MAX_CONTENT_CHARS — max conversation chars sent to LLM
    max_fragments: ${DISTILLATION_MAX_FRAGMENTS:-5}         # DISTILLATION_MAX_FRAGMENTS — max summaries kept per conversation (at most 5)
  clustering:
    enabled: ${FRAGMENT_CLUSTERING_ENABLED:-true}                          # FRAGMENT_CLUSTERING_ENABLED — enable/disable semantic clustering
    cluster_threshold: ${FRAGMENT_CLUSTER_THRESHOLD:-0.80}                 # FRAGMENT_CLUSTER_THRESHOLD — cosine similarity threshold for clustering
    min_cluster_size: ${FRAGMENT_MIN_CLUSTER_SIZE:-3}                      # FRAGMENT_MIN_CLUSTER_SIZE — min fragments per cluster
    min_source_diversity: ${FRAGMENT_MIN_SOURCE_DIVERSITY:-2}              # FRAGMENT_MIN_SOURCE_DIVERSITY — min distinct source types for composability
    max_fragments_per_run: ${FRAGMENT_MAX_PER_CLUSTERING_RUN:-2000}         # FRAGMENT_MAX_PER_CLUSTERING_RUN — max fragments loaded per clustering run

# ── Governance ───────────────────────────────────────────────────────────
# SLA thresholds live in the database (per-space overridable).
# These settings control the periodic SLA checker, which announces each lateness once.
governance:
  sla_checker_interval_hours: ${SLA_CHECKER_INTERVAL_HOURS:-1}              # How often the checker runs (hours)
  sla_checker_query_timeout_secs: ${SLA_CHECKER_QUERY_TIMEOUT_SECS:-30}     # Statement timeout in the checker's one transaction (seconds)
  sla_checker_max_events_per_run: ${SLA_CHECKER_MAX_EVENTS_PER_RUN:-50}     # Max SlaBreached announcements per run; the rest go next run

# ── CI/CD Pipeline Capture ──────────────────────────────────────────────
# Automated knowledge extraction from merged PRs and deployments.
# Uses the fast/cheap LLM model for analysis.
ci:
  enabled: ${CI_ANALYZE_ENABLED:-true}  # CI_ANALYZE_ENABLED — enable/disable CI capture endpoints

# ── External Connectors ──────────────────────────────────────────────────
# Stateless HTTP servers that implement GET /health, POST /documents/list,
# POST /documents/fetch. DocBrain calls them on a cron schedule.
connectors:
  enabled: ${CONNECTOR_ENABLED:-true}                                 # Enable/disable the connector scheduler
  max_concurrent_syncs: ${CONNECTOR_MAX_CONCURRENT_SYNCS:-3}          # Max connectors syncing simultaneously
  max_pages_per_sync: ${CONNECTOR_MAX_PAGES_PER_SYNC:-200}            # Max list pages fetched per sync
  max_documents_per_sync: ${CONNECTOR_MAX_DOCUMENTS_PER_SYNC:-5000}   # Max documents ingested per sync
  fetch_batch_size: ${CONNECTOR_FETCH_BATCH_SIZE:-50}                 # Documents fetched per batch
  request_timeout_secs: ${CONNECTOR_REQUEST_TIMEOUT_SECS:-30}         # HTTP timeout for connector requests
  sync_timeout_secs: ${CONNECTOR_SYNC_TIMEOUT_SECS:-3600}             # Overall sync timeout
  max_response_bytes: ${CONNECTOR_MAX_RESPONSE_BYTES:-10485760}       # Max response body size (10MB)
  circuit_breaker_threshold: ${CONNECTOR_CIRCUIT_BREAKER_THRESHOLD:-5} # Consecutive failures before auto-disable
  allow_internal: ${CONNECTOR_ALLOW_INTERNAL:-false}                   # Allow connector URLs on private/internal IPs

# ── Webhooks (outbound) ──────────────────────────────────────────────────
# Webhook delivery uses env vars directly (not the config struct).
# WEBHOOK_DELIVERY_TIMEOUT_SECONDS=10  — HTTP timeout per delivery (1-60)
# WEBHOOK_MAX_RETRIES=4                — Max delivery attempts (1-10)
# WEBHOOK_CIRCUIT_BREAKER_THRESHOLD=10 — Consecutive failures to auto-disable (3-100)
# ALLOW_INTERNAL_WEBHOOKS=false        — Allow private/internal IP targets

# ── Source-System ACL Mirroring ────────────────────────────────
# Query-time enforcement of per-document ACLs derived from source systems
# (Confluence restrictions, Slack channel membership, GitHub repo access,
# Jira issue security levels, etc.).
#
# Default mode is `off` → preserves behaviour from before ACL mirroring existed, exactly.
# Operators flip to `warn` first to validate ACL coverage on a real corpus
# (logs would-have-denied chunk_ids without changing user-visible results),
# then to `enforce` once per-connector AclProvider impls have populated
# the chunk index with `acl_principals` data.
#
acl:
  mode: "${ACL_MODE:-off}"                                            # off | warn | enforce
  unknown_policy: "${ACL_UNKNOWN_POLICY:-deny}"                       # deny | allow — for chunks lacking acl_principals data
  recall_overfetch: ${ACL_RECALL_OVERFETCH:-1.0}                      # OpenSearch top_k multiplier when filter is active (1.0 = no overfetch)
  user_principal_max_age_secs: ${ACL_USER_PRINCIPAL_MAX_AGE_SECS:-3600} # Drop user principals older than this. 0 = no fence.
  # Denial messages — control how denials are communicated to users.
  denial:
    mode: "${ACL_DENIAL_MODE:-disclosed_no_count}"                    # silent | disclosed_no_count | disclosed
    referral: "${ACL_DENIAL_REFERRAL:-your administrator}"            # operator-provided referral string surfaced in denial messages
    audit: ${ACL_DENIAL_AUDIT:-false}                                 # persist every denial to acl_audit_log (HIPAA/FedRAMP/SOC2)
    audit_raw_query: ${ACL_DENIAL_AUDIT_RAW_QUERY:-false}             # persist raw query text (default: SHA256-hashed)
  # bootstrap_principal_set: kept at the conservative default
  # ["public:system:public", "world:system:world"]. Operators who need
  # broader access for cron jobs should register a service-account user
  # rather than extend this list.
  #
  # Per-source policy (per-connector ACL providers consult this at ingest time):
  # sources:
  #   confluence:
  #     mode: mirror              # off | mirror | public | admin_only
  #     space_overrides:          # per-space override (case-insensitive)
  #       ENG: public
  #       HR: admin_only
  #   slack:
  #     mode: mirror
  #     channel_overrides:
  #       "#general": public
  #   github:
  #     mode: mirror
  #     visibility_policy:        # GitHub visibility-derived policy
  #       public: public
  #       internal: public        # GH Enterprise: internal == "all org members"
  #       private: mirror         # mirror collaborators + teams
  #     repo_overrides:
  #       "acme/secrets": admin_only
  #   jira:
  #     mode: mirror
  #     project_overrides: {}
  # Defaults to all sources at mode=off (opted-out of ACL system entirely).

# ── Expertise Publishable Gate ─────────────────────────────
# Thresholds the expertise scorer applies before publishing a (subject, team)
# ownership attribution. ALL must hold or the scorer ABSTAINS. Defaults are the
# abstain-heavy launch posture (~100% precision); tune post-launch from the
# dashboard. An absent section reproduces the conservative defaults exactly.
expertise_gate:
  v_min: ${EXPERTISE_GATE_V_MIN:-1.0}                 # Min decayed team_score (gate 1, volume)
  n_min: ${EXPERTISE_GATE_N_MIN:-5}                   # Min raw signal_count (gate 1, volume)
  m_askers: ${EXPERTISE_GATE_M_ASKERS:-2}             # Min distinct askers (gate 3)
  margin_frac: ${EXPERTISE_GATE_MARGIN_FRAC:-0.25}    # Min fraction leader must beat 2nd place (gate 4)
  diversity_min: ${EXPERTISE_GATE_DIVERSITY_MIN:-2}   # Min distinct signal_type count (gate 2)
  # ── UI accuracy gate (accuracy audit) ──────────────────────────────────
  # Confident ownership attributions are shown to users ONLY when the audited
  # confidently-wrong rate is within the bar AND the gate is enabled AND there
  # is enough audited evidence. Default DISABLED = honest cold-start (abstain
  # everywhere) until an operator proves accuracy and sets the bar from the
  # /governance/accuracy risk-coverage curve.
  ui_gate_enabled: ${EXPERTISE_GATE_UI_ENABLED:-false}                       # Master switch; false = always abstain
  ui_confidently_wrong_bar: ${EXPERTISE_GATE_UI_CONFIDENTLY_WRONG_BAR:-0.0}  # Max audited confidently-wrong rate to show confident attributions
  ui_min_audit_samples: ${EXPERTISE_GATE_UI_MIN_AUDIT_SAMPLES:-30}           # Min audited labels before the gate can open

# ── Doc-improvement evidence loop ─────────────────────────────────────────────
# The autopilot improvement evidence chain reports how far each published fix got
# along the proven path (published -> content-changed -> re-ingest-confirmed ->
# human-approved -> measured-delta), each link at its TRUE strength.
#
# reingest_confirm_timeout_hours is load-bearing: a published fix whose re-ingest
# has NOT been confirmed within this window is reported as "stale — published but
# never confirmed live" (something went wrong downstream) instead of the hopeful
# "published, not yet confirmed live" (the normal batch sync just hasn't run yet).
# Default 72h is long enough that a normal sync always lands first, so "stale"
# reliably signals a real failure, not a slow pipeline.
improvement:
  reingest_confirm_timeout_hours: ${IMPROVEMENT_REINGEST_CONFIRM_TIMEOUT_HOURS:-72}  # Hours before an unconfirmed published fix is flagged stale

# ── Evidence Bundle (signed, hash-chained provenance journal) ────────────
# Server-side, append-only, DSSE-signed evidence journal: every record links
# to the one before it (SHA-256 hash chain) and is signed by the instance's
# own evidence signing key (separate from the license attestation key).
evidence:
  enabled: ${EVIDENCE_ENABLED:-true}                              # EVIDENCE_ENABLED — master switch
  classes:                                                        # domain-event classes that get journaled (YAML-only, no env override)
    - fragments
    - reviews
    - decisions
    - premises
  checkpoint_every_n: ${EVIDENCE_CHECKPOINT_EVERY_N:-256}         # EVIDENCE_CHECKPOINT_EVERY_N — records between signed checkpoints (clamped 16-65536)
  checkpoint_every_secs: ${EVIDENCE_CHECKPOINT_EVERY_SECS:-3600}  # EVIDENCE_CHECKPOINT_EVERY_SECS — max seconds between signed checkpoints
  # recovery_pubkey: ~                                            # EVIDENCE_RECOVERY_PUBKEY — hex-encoded Ed25519 public key for cold compromise recovery (optional; only read at first boot)
