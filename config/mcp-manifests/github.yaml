  manifest_version: 1
  id: github
  display_name: "GitHub"
  description: "Read-only search across code, PRs, issues, and file contents via GitHub Copilot MCP."
  category: "code"
  icon: "github.svg"

  server:
    transport: http_sse
    endpoint: "https://api.githubcopilot.com/mcp/"
    protocol_version: "2024-11-05"

  auth:
    modes:
      - service_account
    service_account:
      secret_refs:
        - GITHUB_BOT_TOKEN
      header_template: "Bearer ${GITHUB_BOT_TOKEN}"

  tools:
    - name: github.search_code
      upstream_name: search_code
      description: "Search code across accessible GitHub repositories. PREFER scoping with 'org:org-name' qualifier first; only widen to
  all repos when the user explicitly asks for public/external code. Use for 'find X in our repos' / 'where is function Y defined'. Supports
  qualifiers: 'repo:org/name', 'language:hcl', 'path:terraform/', 'org:org-name'. Pass per_page=5 to keep result metadata under the output
   cap."
      args_schema:
        type: object
        properties:
          query:
            type: string
            maxLength: 500
            description: "GitHub code search query. Examples: 'account factory language:hcl org:org-name', 'aft
  repo:org-name/repo-name', 'multi-account terraform org:org-name'."
          per_page:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
        required: [query]
      output_size_cap_bytes: 16384
      latency_budget_ms: 5000
      read_only: true

    - name: github.search_pull_requests
      upstream_name: search_issues
      description: "Search pull requests across accessible repos. PREFER scoping with 'org:org-name' qualifier for internal-org questions.
   Use for 'open PRs about X' / 'recent PRs to repo Y' / 'who reviewed PR Z'. Pass 'type:pr' in query for PR-only results. Pass per_page=5 to
  keep result metadata under the output cap."
      args_schema:
        type: object
        properties:
          query:
            type: string
            maxLength: 500
            description: "GitHub issues/PR search query. Include 'type:pr' for PRs only, 'type:issue' for issues. Examples: 'type:pr is:open
  author:user-name org:org-name', 'type:issue label:bug repo:org-name/repo-name'."
          per_page:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
        required: [query]
      output_size_cap_bytes: 16384
      latency_budget_ms: 5000
      read_only: true

    - name: github.get_file_contents
      upstream_name: get_file_contents
      description: "Read the contents of a file at a path in a GitHub repository. Use for 'what's in path X of repo Y' / 'show me the README of
   Z'."
      args_schema:
        type: object
        properties:
          owner:
            type: string
            description: "Repository owner (org or user)."
          repo:
            type: string
            description: "Repository name."
          path:
            type: string
            maxLength: 500
            description: "File path within the repo, e.g. 'README.md' or 'src/main.rs'."
          ref:
            type: string
            description: "Branch, tag, or commit SHA. Defaults to repo's default branch when omitted."
        required: [owner, repo, path]
      output_size_cap_bytes: 16384
      latency_budget_ms: 5000
      read_only: true

  egress:
    hosts:
      - "api.githubcopilot.com"

  rbac:
    required_role: viewer

  retention:
    audit_log_days: 90
