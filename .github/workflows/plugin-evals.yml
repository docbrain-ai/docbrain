name: plugin-evals

# The docbrain plugin's eval suite (plugin-evals/docbrain) in real Claude Code, with the DocBrain
# connector mocked: every case must pass. The suite lives beside the plugin, so a run first copies
# both into one folder. Started by hand (Actions > plugin-evals > Run workflow) until
# the ANTHROPIC_API_KEY secret's account has credit again; then add back
#   push: { paths: ["plugins/**", "plugin-evals/**", ".github/workflows/plugin-evals.yml"] }
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: plugin evals (Claude Code)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.312 --registry=https://registry.npmjs.org/
      - name: Validate
        run: claude plugin validate plugins/docbrain --profile directory --strict
      - name: Put the plugin and its suite in one folder
        run: |
          mkdir "$RUNNER_TEMP/docbrain-plugin"
          cp -R plugins/docbrain/. plugin-evals/docbrain/. "$RUNNER_TEMP/docbrain-plugin"
          test -f "$RUNNER_TEMP/docbrain-plugin/.claude-plugin/plugin.json"
          test -f "$RUNNER_TEMP/docbrain-plugin/.mcp.json"
          test -f "$RUNNER_TEMP/docbrain-plugin/evals/commit-why/fixture.sh"
      - name: Evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          claude plugin eval "$RUNNER_TEMP/docbrain-plugin" --scaffold --trust-plugin --ablation none
          --threshold 1.0 --concurrency 4 --no-publish --keep-temp
          --json "$RUNNER_TEMP/docbrain-plugin/evals/results/ci.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-eval-results
          path: ${{ runner.temp }}/docbrain-plugin/evals/results/
      # Each run's conversation, to read why a case failed (eval prompts and mocked answers only).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-eval-traces
          path: /tmp/claude-eval-*/out/trace.jsonl
          retention-days: 3
